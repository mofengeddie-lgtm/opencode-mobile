nts to the soil?", "help": "¿Quiénes son los principales descomponedores?", "opts": ["Viruses", "Bacteria and fungi", "Only algae"], "ans": 1, "why": ["Bacterias y hongos descomponen y reciclan nutrientes.", "Bacteria and fungi decompose and recycle nutrients."]}, {"mod": "cell", "q": "\u003cb>Plant-like protists\u003c/b> such as diatoms and algae are important for life on Earth because they:", "help": "Los protistas tipo planta son importantes porque…", "opts": ["produce oxygen through photosynthesis.", "cause the common cold.", "destroy the soil."], "ans": 0, "why": ["Las algas hacen fotosíntesis y producen oxígeno.", "Algae photosynthesize and produce oxygen."]}, {"mod": "cell", "q": "The \u003cb>cell walls of fungi\u003c/b> are made of:", "help": "La pared celular de los hongos es de…", "opts": ["cellulose", "chitin", "peptidoglycan"], "ans": 1, "why": ["Hongos = quitina (plantas = celulosa; bacterias = peptidoglicano).", "Fungi = chitin (plants = cellulose; bacteria = peptidoglycan)."]}];
const PAST = [{"id": "geo-0-1", "exam": "geo", "part": "Geología I · Selección única", "partEn": "Multiple choice (13/22)", "sub": "A. Evidencia del interior de la Tierra · Evidence of Earth's interior", "n": "1", "q": "\u003cem>P-waves pass through all of Earth, but S-waves stop at ~2,900 km. What can be concluded about the outer core?\u003c/em>", "tags": [{"k": "bad", "t": "Tú: a ✗"}, {"k": "good", "t": "Correcta: b — liquid molten metal"}], "status": "bad", "body": "\u003cdiv class=\"bi\">\n\u003cdiv class=\"es\">\n\u003cp>Las ondas S \u003cstrong>solo viajan por sólidos\u003c/strong>. Si se detienen a 2,900 km, ahí empieza un \u003cstrong>líquido\u003c/strong>: el núcleo externo es \u003cstrong>metal fundido\u003c/strong> (hierro y níquel). La opción \"granito congelado\" es incorrecta: el granito es roca de la corteza.\u003c/p>\n\u003c/div>\n\u003cdiv class=\"en\">\n\u003cp>S-waves \u003cstrong>only travel through solids\u003c/strong>. If they stop at 2,900 km, a \u003cstrong>liquid\u003c/strong> begins there: the outer core is \u003cstrong>molten metal\u003c/strong> (iron and nickel). \"Frozen granite\" is wrong: granite is a crust rock.\u003c/p>\n\u003c/div>\n\u003c/div>"}, {"id": "geo-0-2", "exam": "geo", "part": "Geología I · Selección única", "partEn": "Multiple choice (13/22)", "sub": "A. Evidencia del interior de la Tierra · Evidence of Earth's interior", "n": "2", "q": "\u003cem>Metallic meteorites are made of iron and nickel. How does this help?\u003c/em>", "tags": [{"k": "good", "t": "Tú: a ✓ — clues about the chemical composition of planetary cores"}], "status": "good", "body": "\u003cdiv class=\"bi\">\n\u003cdiv class=\"es\">\n\u003cp>Los meteoritos se formaron con el mismo material que la Tierra. Los metálicos son pedazos del \u003cstrong>núcleo\u003c/strong> de asteroides rotos → el núcleo de la Tierra es de \u003cstrong>hierro y níquel\u003c/strong>.\u003c/p>\n\u003c/div>\n\u003cdiv class=\"en\">\n\u003cp>Meteorites formed from the same material as Earth. Metallic ones are pieces of the \u003cstrong>cores\u003c/strong> of broken asteroids → Earth's core is \u003cstrong>iron and nickel\u003c/strong>.\u003c/p>\n\u003c/div>\n\u003c/div>"}, {"id": "geo-0-3", "exam": "geo", "part": "Geología I · Selección única", "partEn": "Multiple choice (13/22)", "sub": "A. Evidencia del interior de la Tierra · Evidence of Earth's interior", "n": "3", "q": "\u003cem>A volcano brings up dense green rock fragments (xenoliths) from 100 km deep. Why are they valuable?\u003c/em>", "tags": [{"k": "bad", "t": "Tú: c ✗"}, {"k": "good", "t": "Correcta: a — actual physical samples from the mantle"}], "status": "bad", "body": "\u003cdiv class=\"bi\">\n\u003cdiv class=\"es\">\n\u003cp>100 km bajo la corteza = \u003cstrong>manto\u003c/strong>. Los xenolitos son \u003cstrong>muestras reales\u003c/strong> del manto (evidencia directa). Los horizontes del suelo se forman en la \u003cstrong>superficie\u003c/strong>, nunca dentro del núcleo.\u003c/p>\n\u003c/div>\n\u003cdiv class=\"en\">\n\u003cp>100 km below the crust = \u003cstrong>mantle\u003c/strong>. Xenoliths are \u003cstrong>actual samples\u003c/strong> of the mantle (direct evidence). Soil horizons form at the \u003cstrong>surface\u003c/strong>, never inside the core.\u003c/p>\n\u003c/div>\n\u003c/div>"}, {"id": "geo-0-4", "exam": "geo", "part": "Geología I · Selección única", "partEn": "Multiple choice (13/22)", "sub": "B. Procesos de superficie y relieve · Surface processes and landforms", "n": "4", "q": "\u003cem>Two continental plates push together; rock layers buckle and fold.\u003c/em>", "tags": [{"k": "good", "t": "Tú: a ✓ — folded mountain range"}], "status": "good", "body": "\u003cdiv class=\"bi\">\n\u003cdiv class=\"es\">\n\u003cp>Límite \u003cstrong>convergente\u003c/strong> entre dos placas continentales → \u003cstrong>cordillera plegada\u003c/strong> (como el Himalaya). Es un proceso \u003cstrong>constructivo\u003c/strong>.\u003c/p>\n\u003c/div>\n\u003cdiv class=\"en\">\n\u003cp>\u003cstrong>Convergent\u003c/strong> boundary between two continental plates → \u003cstrong>folded mountain range\u003c/strong> (like the Himalayas). It is a \u003cstrong>constructive\u003c/strong> process.\u003c/p>\n\u003c/div>\n\u003c/div>"}, {"id": "geo-0-5", "exam": "geo", "part": "Geología I · Selección única", "partEn": "Multiple choice (13/22)", "sub": "B. Procesos de superficie y relieve · Surface processes and landforms", "n": "5", "q": "\u003cem>Two oceanic plates pull apart; magma rises and builds new oceanic crust. What feature?\u003c/em>", "tags": [{"k": "bad", "t": "Tú: a ✗"}, {"k": "note", "t": "Respuesta científica: dorsal oceánica · mid-ocean ridge"}], "status": "bad", "body": "\u003cdiv class=\"bi\">\n\u003cdiv class=\"es\">\n\u003cp>Placas \u003cstrong>oceánicas\u003c/strong> que \u003cstrong>se separan\u003c/strong> + magma que construye corteza nueva = \u003cstrong>dorsal oceánica\u003c/strong>. Esa opción \u003cstrong>no estaba\u003c/strong> en tu examen. La \u003cstrong>fosa\u003c/strong> (a) se forma cuando las placas \u003cstrong>chocan\u003c/strong>. Parece que tu docente marcó la \u003cstrong>b\u003c/strong> (cañón desértico), pero un cañón lo forma la \u003cstrong>erosión de un río\u003c/strong>. 👉 \u003cstrong>Pregúntale a tu docente\u003c/strong> qué respuesta esperaba.\u003c/p>\n\u003c/div>\n\u003cdiv class=\"en\">\n\u003cp>\u003cstrong>Oceanic\u003c/strong> plates \u003cstrong>pulling apart\u003c/strong> + magma building new crust = \u003cstrong>mid-ocean ridge\u003c/strong>. That option \u003cstrong>was not\u003c/strong> on your test. A \u003cstrong>trench\u003c/strong> (a) forms when plates \u003cstrong>collide\u003c/strong>. The teacher seems to have marked \u003cstrong>b\u003c/strong> (desert canyon), but a canyon is formed by \u003cstrong>river erosion\u003c/strong>. 👉 \u003cstrong>Ask the teacher\u003c/strong> which answer they expected.\u003c/p>\n\u003c/div>\n\u003c/div>"}, {"id": "geo-0-6", "exam": "geo", "part": "Geología I · Selección única", "partEn": "Multiple choice (13/22)", "sub": "B. Procesos de superficie y relieve · Surface processes and landforms", "n": "6", "q": "\u003cem>A fast river in a dry region cuts down through bedrock for millions of years. What forms the canyon?\u003c/em>", "tags": [{"k": "good", "t": "Tú: b ✓ — destructive forces of weathering and water erosion"}], "status": "good", "body": "\u003cdiv class=\"bi\">\n\u003cdiv class=\"es\">\n\u003cp>El cañón se forma por fuerzas \u003cstrong>destructivas (exógenas)\u003c/strong>: el río \u003cstrong>erosiona\u003c/strong> y la meteorización ensancha las paredes.\u003c/p>\n\u003c/div>\n\u003cdiv class=\"en\">\n\u003cp>A canyon forms by \u003cstrong>destructive (exogenic)\u003c/strong> forces: the river \u003cstrong>erodes\u003c/strong> and weathering widens the walls.\u003c/p>\n\u003c/div>\n\u003c/div>"}, {"id": "geo-0-7", "exam": "geo", "part": "Geología I · Selección única", "partEn": "Multiple choice (13/22)", "sub": "B. Procesos de superficie y relieve · Surface processes and landforms", "n": "7", "q": "\u003cem>A river slows down in a calm bay and drops sediment, building fan-shaped land. Which rock?\u003c/em>", "tags": [{"k": "good", "t": "Tú: c ✓ — sedimentary rock"}], "status": "good", "body": "\u003cdiv class=\"bi\">\n\u003cdiv class=\"es\">\n\u003cp>Es un \u003cstrong>delta\u003c/strong>: sedimento depositado → compactado y cementado → roca \u003cstrong>sedimentaria\u003c/strong>.\u003c/p>\n\u003c/div>\n\u003cdiv class=\"en\">\n\u003cp>It is a \u003cstrong>delta\u003c/strong>: deposited sediment → compacted and cemented → \u003cstrong>sedimentary\u003c/strong> rock.\u003c/p>\n\u003c/div>\n\u003c/div>"}, {"id": "geo-0-8", "exam": "geo", "part": "Geología I · Selección única", "partEn": "Multiple choice (13/22)", "sub": "B. Procesos de superficie y relieve · Surface processes and landforms", "n": "8", "q": "\u003cem>Why do divergent boundaries make a rift valley on continents but a ridge/volcano in the ocean?\u003c/em>", "tags": [{"k": "good", "t": "Tú: a ✓ — oceanic crust is much thinner (~5 km)…"}], "status": "good", "body": "\u003cdiv class=\"bi\">\n\u003cdiv class=\"es\">\n\u003cp>La corteza \u003cstrong>oceánica es delgada (~5 km)\u003c/strong>: el magma sube fácil y construye dorsales. La \u003cstrong>continental es gruesa (~70 km)\u003c/strong>: se estira y el centro se hunde.\u003c/p>\n\u003c/div>\n\u003cdiv class=\"en\">\n\u003cp>\u003cstrong>Oceanic crust is thin (~5 km)\u003c/strong>: magma rises easily and builds ridges. \u003cstrong>Continental crust is thick (~70 km)\u003c/strong>: it stretches and the center sinks.\u003c/p>\n\u003c/div>\n\u003c/div>"}, {"id": "geo-0-9", "exam": "geo", "part": "Geología I · Selección única", "partEn": "Multiple choice (13/22)", "sub": "C. Minerales y ciclo de las rocas · Minerals and the rock cycle", "n": "9", "q": "\u003cem>A mineral dragged across an unglazed porcelain plate leaves a dark red-brown powder. Which property?\u003c/em>", "tags": [{"k": "bad", "t": "Tú: a (cleavage) ✗"}, {"k": "good", "t": "Correcta: b — streak"}], "status": "bad", "body": "\u003cdiv class=\"bi\">\n\u003cdiv class=\"es\">\n\u003cp>\u003cstrong>Raya\u003c/strong> = color del \u003cstrong>polvo\u003c/strong> en la placa de porcelana. (Es la hematita.) \u003cstrong>Exfoliación\u003c/strong> es romperse en superficies planas, y \u003cstrong>brillo\u003c/strong> es cómo refleja la luz.\u003c/p>\n\u003c/div>\n\u003cdiv class=\"en\">\n\u003cp>\u003cstrong>Streak\u003c/strong> = color of the \u003cstrong>powder\u003c/strong> on the porcelain plate. (It is hematite.) \u003cstrong>Cleavage\u003c/strong> is breaking along flat surfaces, and \u003cstrong>luster\u003c/strong> is how it reflects light.\u003c/p>\n\u003c/div>\n\u003c/div>"}, {"id": "geo-0-10", "exam": "geo", "part": "Geología I · Selección única", "partEn": "Multiple choice (13/22)", "sub": "C. Minerales y ciclo de las rocas · Minerals and the rock cycle", "n": "10", "q": "\u003cem>A heavy countertop rock with large crystals of quartz, feldspar and mica; magma cooled slowly deep underground.\u003c/em>", "tags": [{"k": "bad", "t": "Tú: c (marble) ✗"}, {"k": "good", "t": "Correcta: a — intrusive igneous (granite)"}], "status": "bad", "body": "\u003cdiv class=\"bi\">\n\u003cdiv class=\"es\">\n\u003cp>\u003cstrong>Magma\u003c/strong> + enfriamiento \u003cstrong>lento bajo tierra\u003c/strong> + \u003cstrong>cristales grandes\u003c/strong> = \u003cstrong>ígnea intrusiva: granito\u003c/strong>. El mármol es \u003cstrong>metamórfico\u003c/strong> (no viene de magma).\u003c/p>\n\u003c/div>\n\u003cdiv class=\"en\">\n\u003cp>\u003cstrong>Magma\u003c/strong> + \u003cstrong>slow cooling underground\u003c/strong> + \u003cstrong>large crystals\u003c/strong> = \u003cstrong>intrusive igneous: granite\u003c/strong>. Marble is \u003cstrong>metamorphic\u003c/strong> (it doesn't come from magma).\u003c/p>\n\u003c/div>\n\u003c/div>"}, {"id": "geo-0-11", "exam": "geo", "part": "Geología I · Selección única", "partEn": "Multiple choice (13/22)", "sub": "C. Minerales y ciclo de las rocas · Minerals and the rock cycle", "n": "11", "q": "\u003cem>Why are fossils preserved in sedimentary rocks rather than igneous rocks?\u003c/em>", "tags": [{"k": "bad", "t": "Tú: b ✗"}, {"k": "good", "t": "Correcta: a — sedimentary compaction and cementation are gentle"}], "status": "bad", "body": "\u003cdiv class=\"bi\">\n\u003cdiv class=\"es\">\n\u003cp>La compactación y la cementación son \u003cstrong>suaves\u003c/strong> (poco calor y presión) y conservan los restos. El problema del magma no es que \"se enfríe lento\", sino que su \u003cstrong>calor destruye\u003c/strong> los organismos.\u003c/p>\n\u003c/div>\n\u003cdiv class=\"en\">\n\u003cp>Compaction and cementation are \u003cstrong>gentle\u003c/strong> (little heat and pressure) and preserve the remains. The problem with magma is not \"cooling slowly\", but that its \u003cstrong>heat destroys\u003c/strong> organisms.\u003c/p>\n\u003c/div>\n\u003c/div>"}, {"id": "geo-0-12", "exam": "geo", "part": "Geología I · Selección única", "partEn": "Multiple choice (13/22)", "sub": "C. Minerales y ciclo de las rocas · Minerals and the rock cycle", "n": "12", "q": "\u003cem>Lava cools rapidly on the surface: dark rock with tiny crystals.\u003c/em>", "tags": [{"k": "good", "t": "Tú: b ✓ — extrusive igneous rock"}], "status": "good", "body": "\u003cdiv class=\"bi\">\n\u003cdiv class=\"es\">\n\u003cp>Enfriamiento \u003cstrong>rápido en la superficie\u003c/strong> → cristales diminutos → \u003cstrong>ígnea extrusiva\u003c/strong> (basalto).\u003c/p>\n\u003c/div>\n\u003cdiv class=\"en\">\n\u003cp>\u003cstrong>Fast cooling on the surface\u003c/strong> → tiny crystals → \u003cstrong>extrusive igneous\u003c/strong> (basalt).\u003c/p>\n\u003c/div>\n\u003c/div>"}, {"id": "geo-0-13", "exam": "geo", "part": "Geología I · Selección única", "partEn": "Multiple choice (13/22)", "sub": "C. Minerales y ciclo de las rocas · Minerals and the rock cycle", "n": "13", "q": "\u003cem>Limestone deep underground gets intense heat and pressure without melting.\u003c/em>", "tags": [{"k": "good", "t": "Tú: b ✓ — marble"}], "status": "good", "body": "\u003cdiv class=\"bi\">\n\u003cdiv class=\"es\">\n\u003cp>Calor + presión \u003cstrong>sin derretirse\u003c/strong> = \u003cstrong>metamórfica\u003c/strong>. Caliza → \u003cstrong>mármol\u003c/strong>.\u003c/p>\n\u003c/div>\n\u003cdiv class=\"en\">\n\u003cp>Heat + pressure \u003cstrong>without melting\u003c/strong> = \u003cstrong>metamorphic\u003c/strong>. Limestone → \u003cstrong>marble\u003c/strong>.\u003c/p>\n\u003c/div>\n\u003c/div>"}, {"id": "geo-0-14", "exam": "geo", "part": "Geología I · Selección única", "partEn": "Multiple choice (13/22)", "sub": "C. Minerales y ciclo de las rocas · Minerals and the rock cycle", "n": "14", "q": "\u003cem>Durable, porous sedimentary rock of sand-sized quartz grains glued together.\u003c/em>", "tags": [{"k": "good", "t": "Tú: a ✓ — sandstone"}], "status": "good", "body": "\u003cdiv class=\"bi\">\n\u003cdiv class=\"es\">\n\u003cp>Granos de \u003cstrong>arena\u003c/strong> cementados = \u003cstrong>arenisca\u003c/strong> (\u003cem>sandstone\u003c/em>). La obsidiana es ígnea (vidrio volcánico).\u003c/p>\n\u003c/div>\n\u003cdiv class=\"en\">\n\u003cp>Cemented \u003cstrong>sand\u003c/strong> grains = \u003cstrong>sandstone\u003c/strong>. Obsidian is igneous (volcanic glass).\u003c/p>\n\u003c/div>\n\u003c/div>"}, {"id": "geo-0-15", "exam": "geo", "part": "Geología I · Selección única", "partEn": "Multiple choice (13/22)", "sub": "D. Meteorización, erosión y suelo · Weathering, erosion and soil", "n": "15", "q": "\u003cem>Rainwater in cracks freezes and expands at night, cracking the rock.\u003c/em>", "tags": [{"k": "bad", "t": "Tú: dudaste y marcaste a ✗"}, {"k": "good", "t": "Correcta: b — mechanical weathering"}], "status": "bad", "body": "\u003cdiv class=\"bi\">\n\u003cdiv class=\"es\">\n\u003cp>El hielo \u003cstrong>parte\u003c/strong> la roca en pedazos, pero la roca \u003cstrong>no cambia su composición\u003c/strong> → meteorización \u003cstrong>mecánica (física)\u003c/strong>: gelifracción.\u003c/p>\n\u003c/div>\n\u003cdiv class=\"en\">\n\u003cp>Ice \u003cstrong>splits\u003c/strong> the rock into pieces, but the rock \u003cstrong>does not change its composition\u003c/strong> → \u003cstrong>mechanical (physical)\u003c/strong> weathering: frost wedging.\u003c/p>\n\u003c/div>\n\u003c/div>"}, {"id": "geo-0-16", "exam": "geo", "part": "Geología I · Selección única", "partEn": "Multiple choice (13/22)", "sub": "D. Meteorización, erosión y suelo · Weathering, erosion and soil", "n": "16", "q": "\u003cem>Carbonic acid in rain reacts with calcium carbonate in limestone statues and dissolves them.\u003c/em>", "tags": [{"k": "bad", "t": "Tú: b ✗"}, {"k": "good", "t": "Correcta: a — chemical weathering"}], "status": "bad", "body": "\u003cdiv class=\"bi\">\n\u003cdiv class=\"es\">\n\u003cp>Palabras clave \u003cstrong>ácido, reacciona, disuelve\u003c/strong> → la sustancia \u003cstrong>cambia\u003c/strong> → meteorización \u003cstrong>química\u003c/strong>.\u003c/p>\n\u003c/div>\n\u003cdiv class=\"en\">\n\u003cp>Keywords \u003cstrong>acid, reacts, dissolve\u003c/strong> → the substance \u003cstrong>changes\u003c/strong> → \u003cstrong>chemical\u003c/strong> weathering.\u003c/p>\n\u003c/div>\n\u003c/div>"}, {"id": "geo-0-17", "exam": "geo", "part": "Geología I · Selección única", "partEn": "Multiple choice (13/22)", "sub": "D. Meteorización, erosión y suelo · Weathering, erosion and soil", "n": "17", "q": "\u003cem>A river picks up loose sediment, carries it downhill and drops it in a meadow.\u003c/em>", "tags": [{"k": "good", "t": "Tú: b ✓ — erosion followed by deposition"}], "status": "good", "body": "\u003cdiv class=\"bi\">\n\u003cdiv class=\"es\">\n\u003cp>Recoger y transportar = \u003cstrong>erosión\u003c/strong>; soltar cuando el agua va lenta = \u003cstrong>depósito\u003c/strong>.\u003c/p>\n\u003c/div>\n\u003cdiv class=\"en\">\n\u003cp>Picking up and carrying = \u003cstrong>erosion\u003c/strong>; dropping it when water slows = \u003cstrong>deposition\u003c/strong>.\u003c/p>\n\u003c/div>\n\u003c/div>"}, {"id": "geo-0-18", "exam": "geo", "part": "Geología I · Selección única", "partEn": "Multiple choice (13/22)", "sub": "D. Meteorización, erosión y suelo · Weathering, erosion and soil", "n": "18", "q": "\u003cem>Tree roots grow inside granite cracks and split the rock.\u003c/em>", "tags": [{"k": "good", "t": "Tú: a ✓ — biological weathering"}], "status": "good", "body": "\u003cdiv class=\"bi\">\n\u003cdiv class=\"es\">\n\u003cp>Un \u003cstrong>ser vivo\u003c/strong> (raíces) rompe la roca → meteorización \u003cstrong>biológica\u003c/strong>.\u003c/p>\n\u003c/div>\n\u003cdiv class=\"en\">\n\u003cp>A \u003cstrong>living thing\u003c/strong> (roots) breaks the rock → \u003cstrong>biological\u003c/strong> weathering.\u003c/p>\n\u003c/div>\n\u003c/div>"}, {"id": "geo-0-19", "exam": "geo", "part": "Geología I · Selección única", "partEn": "Multiple choice (13/22)", "sub": "D. Meteorización, erosión y suelo · Weathering, erosion and soil", "n": "19", "q": "\u003cem>A rich, dark layer of decomposed leaves that supplies nutrients and holds water.\u003c/em>", "tags": [{"k": "good", "t": "Tú: a ✓ — topsoil"}], "status": "good", "body": "\u003cdiv class=\"bi\">\n\u003cdiv class=\"es\">\n\u003cp>Oscuro, con humus y nutrientes = \u003cstrong>suelo superficial (horizonte A)\u003c/strong>.\u003c/p>\n\u003c/div>\n\u003cdiv class=\"en\">\n\u003cp>Dark, with humus and nutrients = \u003cstrong>topsoil (A horizon)\u003c/strong>.\u003c/p>\n\u003c/div>\n\u003c/div>"}, {"id": "geo-0-20", "exam": "geo", "part": "Geología I · Selección única", "partEn": "Multiple choice (13/22)", "sub": "D. Meteorización, erosión y suelo · Weathering, erosion and soil", "n": "20", "q": "\u003cem>A subsoil layer with dense clay and minerals washed down from above, little organic matter.\u003c/em>", "tags": [{"k": "good", "t": "Tú: b ✓ — B horizon"}], "status": "good", "body": "\u003cdiv class=\"bi\">\n\u003cdiv class=\"es\">\n\u003cp>Arcilla y minerales \u003cstrong>lavados desde arriba\u003c/strong> = \u003cstrong>horizonte B (subsuelo)\u003c/strong>.\u003c/p>\n\u003c/div>\n\u003cdiv class=\"en\">\n\u003cp>Clay and minerals \u003cstrong>washed down from above\u003c/strong> = \u003cstrong>B horizon (subsoil)\u003c/strong>.\u003c/p>\n\u003c/div>\n\u003c/div>"}, {"id": "geo-0-21", "exam": "geo", "part": "Geología I · Selección única", "partEn": "Multiple choice (13/22)", "sub": "D. Meteorización, erosión y suelo · Weathering, erosion and soil", "n": "21", "q": "\u003cem>Soil organisms trap pollutants before water reaches aquifers.\u003c/em>", "tags": [{"k": "good", "t": "Tú: a ✓ — natural groundwater filter"}], "status": "good", "body": "\u003cdiv class=\"bi\">\n\u003cdiv class=\"es\">\n\u003cp>El suelo funciona como \u003cstrong>filtro natural\u003c/strong> del agua subterránea.\u003c/p>\n\u003c/div>\n\u003cdiv class=\"en\">\n\u003cp>Soil works as a \u003cstrong>natural groundwater filter\u003c/strong>.\u003c/p>\n\u003c/div>\n\u003c/div>"}, {"id": "geo-0-22", "exam": "geo", "part": "Geología I · Selección única", "partEn": "Multiple choice (13/22)", "sub": "D. Meteorización, erosión y suelo · Weathering, erosion and soil", "n": "22", "q": "\u003cem>Corn planted on the same land for 10 years; soil lacks minerals. Which conservation strategy?\u003c/em>", "tags": [{"k": "bad", "t": "Tú: c ✗"}, {"k": "good", "t": "Correcta: a — crop rotation"}], "status": "bad", "body": "\u003cdiv class=\"bi\">\n\u003cdiv class=\"es\">\n\u003cp>Sembrar siempre lo mismo \u003cstrong>agota\u003c/strong> los mismos nutrientes. \u003cstrong>Rotar cultivos\u003c/strong> (ej. maíz → frijoles) los \u003cstrong>recupera\u003c/strong>. Quitar la roca madre o las cortinas rompevientos \u003cstrong>daña\u003c/strong> el suelo.\u003c/p>\n\u003c/div>\n\u003cdiv class=\"en\">\n\u003cp>Always planting the same crop \u003cstrong>uses up\u003c/strong> the same nutrients. \u003cstrong>Crop rotation\u003c/strong> (e.g., corn → beans) \u003cstrong>restores\u003c/strong> them. Removing bedrock or windbreaks \u003cstrong>harms\u003c/strong> the soil.\u003c/p>\n\u003c/div>\n\u003c/div>"}, {"id": "geo-1-1", "exam": "geo", "part": "Geología II · Pareos", "partEn": "Matching (2/9)", "sub": "A. Capas internas de la Tierra · Earth's internal layers (2/4)", "n": "1", "q": "Esfera densa y muy caliente de \u003cstrong>hierro y níquel sólido\u003c/strong> por la \u003cstrong>presión\u003c/strong> en el centro · \u003cem>dense hot sphere of solid iron &amp; nickel\u003c/em>", "tags": [{"k": "good", "t": "Tú: D ✓"}, {"k": "good", "t": "Correcta: \u003cstrong>D. Inner core\u003c/strong>"}], "status": "good", "body": "\u003cp class=\"clue\">Pista · Clue: sólido + centro = \u003cstrong>interno\u003c/strong>\u003c/p>"}, {"id": "geo-1-2", "exam": "geo", "part": "Geología II · Pareos", "partEn": "Matching (2/9)", "sub": "A. Capas internas de la Tierra · Earth's internal layers (2/4)", "n": "2", "q": "Capa de \u003cstrong>hierro y níquel líquido\u003c/strong> que genera el \u003cstrong>campo magnético\u003c/strong> · \u003cem>molten liquid iron &amp; nickel, magnetic field\u003c/em>", "tags": [{"k": "bad", "t": "Tú: B ✗"}, {"k": "good", "t": "Correcta: \u003cstrong>C. Outer core\u003c/strong>"}], "status": "bad", "body": "\u003cp class=\"clue\">Pista · Clue: líquido + magnético = \u003cstrong>externo\u003c/strong>\u003c/p>"}, {"id": "geo-1-3", "exam": "geo", "part": "Geología II · Pareos", "partEn": "Matching (2/9)", "sub": "A. Capas internas de la Tierra · Earth's internal layers (2/4)", "n": "3", "q": "La capa \u003cstrong>más grande\u003c/strong>, roca de silicato que \u003cstrong>fluye lento\u003c/strong> y mueve las placas · \u003cem>largest, silicate rock that slowly flows\u003c/em>", "tags": [{"k": "bad", "t": "Tú: C ✗"}, {"k": "good", "t": "Correcta: \u003cstrong>B. Mantle\u003c/strong>"}], "status": "bad", "body": "\u003cp class=\"clue\">Pista · Clue: la más grande + placas = \u003cstrong>manto\u003c/strong>\u003c/p>"}, {"id": "geo-1-4", "exam": "geo", "part": "Geología II · Pareos", "partEn": "Matching (2/9)", "sub": "A. Capas internas de la Tierra · Earth's internal layers (2/4)", "n": "4", "q": "Capa \u003cstrong>exterior y delgada\u003c/strong> de roca sólida (granito y basalto) donde está la vida · \u003cem>outermost thin layer\u003c/em>", "tags": [{"k": "good", "t": "Tú: A ✓"}, {"k": "good", "t": "Correcta: \u003cstrong>A. Crust\u003c/strong>"}], "status": "good", "body": "\u003cp class=\"clue\">Pista · Clue: exterior + vida = \u003cstrong>corteza\u003c/strong>\u003c/p>"}, {"id": "geo-1-1", "exam": "geo", "part": "Geología II · Pareos", "partEn": "Matching (2/9)", "sub": "B. Perfil del suelo y horizontes · Soil profile and horizons (0/5)", "n": "1", "q": "\u003cstrong>Topsoil\u003c/strong>: mezcla oscura de \u003cstrong>humus y minerales\u003c/strong>, vital para raíces y cultivos · \u003cem>dark mix of humus and minerals\u003c/em>", "tags": [{"k": "bad", "t": "Tú: 4 ✗"}, {"k": "good", "t": "Correcta: \u003cstrong>2. A Horizon\u003c/strong>"}], "status": "bad", "body": "\u003cp class=\"clue\">Pareo · Matching\u003c/p>"}, {"id": "geo-1-2", "exam": "geo", "part": "Geología II · Pareos", "partEn": "Matching (2/9)", "sub": "B. Perfil del suelo y horizontes · Soil profile and horizons (0/5)", "n": "2", "q": "\u003cstrong>Parent material\u003c/strong>: pedazos de roca madre parcialmente meteorizada · \u003cem>partially weathered chunks of bedrock\u003c/em>", "tags": [{"k": "bad", "t": "Tú: 5 ✗"}, {"k": "good", "t": "Correcta: \u003cstrong>4. C Horizon\u003c/strong>"}], "status": "bad", "body": "\u003cp class=\"clue\">Pareo · Matching\u003c/p>"}, {"id": "geo-1-3", "exam": "geo", "part": "Geología II · Pareos", "partEn": "Matching (2/9)", "sub": "B. Perfil del suelo y horizontes · Soil profile and horizons (0/5)", "n": "3", "q": "\u003cstrong>Organic layer\u003c/strong>: hojas frescas y en descomposición, ramas y humus · \u003cem>fresh and decomposing leaves\u003c/em>", "tags": [{"k": "bad", "t": "Tú: 3 ✗"}, {"k": "good", "t": "Correcta: \u003cstrong>1. O Horizon\u003c/strong>"}], "status": "bad", "body": "\u003cp class=\"clue\">Pareo · Matching\u003c/p>"}, {"id": "geo-1-4", "exam": "geo", "part": "Geología II · Pareos", "partEn": "Matching (2/9)", "sub": "B. Perfil del suelo y horizontes · Soil profile and horizons (0/5)", "n": "4", "q": "\u003cstrong>Subsoil\u003c/strong>: capa densa con \u003cstrong>arcilla y minerales\u003c/strong> lavados desde arriba · \u003cem>dense clay &amp; minerals washed down\u003c/em>", "tags": [{"k": "bad", "t": "Tú: 2 ✗"}, {"k": "good", "t": "Correcta: \u003cstrong>3. B Horizon\u003c/strong>"}], "status": "bad", "body": "\u003cp class=\"clue\">Pareo · Matching\u003c/p>"}, {"id": "geo-1-5", "exam": "geo", "part": "Geología II · Pareos", "partEn": "Matching (2/9)", "sub": "B. Perfil del suelo y horizontes · Soil profile and horizons (0/5)", "n": "5", "q": "\u003cstrong>Bedrock\u003c/strong>: roca \u003cstrong>sólida\u003c/strong> continua sin meteorizar · \u003cem>continuous, unweathered solid rock\u003c/em>", "tags": [{"k": "bad", "t": "Tú: 1 ✗"}, {"k": "good", "t": "Correcta: \u003cstrong>5. R Horizon\u003c/strong>"}], "status": "bad", "body": "\u003cp class=\"clue\">Pareo · Matching\u003c/p>"}, {"id": "geo-2-1", "exam": "geo", "part": "Geología IV · Respuesta corta", "partEn": "Short answer (5/11)", "sub": "", "n": "1", "q": "\u003cem>The internal layer of the Earth responsible for the magnetic field is the ___.\u003c/em>", "tags": [{"k": "bad", "t": "Tú: metamorphic ✗"}, {"k": "good", "t": "Correcta: outer core"}], "status": "bad", "body": "\u003cdiv class=\"bi\">\n\u003cdiv class=\"es\">\n\u003cp>El hierro y níquel \u003cstrong>líquido en movimiento\u003c/strong> del \u003cstrong>núcleo externo\u003c/strong> crea el campo magnético. \"Metamórfica\" es un \u003cstrong>tipo de roca\u003c/strong>, no una capa.\u003c/p>\n\u003c/div>\n\u003cdiv class=\"en\">\n\u003cp>The \u003cstrong>moving liquid\u003c/strong> iron and nickel of the \u003cstrong>outer core\u003c/strong> creates the magnetic field. \"Metamorphic\" is a \u003cstrong>rock type\u003c/strong>, not a layer.\u003c/p>\n\u003c/div>\n\u003c/div>"}, {"id": "geo-2-2", "exam": "geo", "part": "Geología IV · Respuesta corta", "partEn": "Short answer (5/11)", "sub": "", "n": "2", "q": "\u003cem>The thickness of the crust ranges from about 5 km for the ___ crust to about 70 km for the ___ crust.\u003c/em>", "tags": [{"k": "bad", "t": "Tú: outer / inner ✗"}, {"k": "good", "t": "Correcta: oceanic / continental"}], "status": "bad", "body": "\u003cdiv class=\"bi\">\n\u003cdiv class=\"es\">\n\u003cp>\u003cstrong>Oceánica\u003c/strong> = delgada (5 km, bajo los océanos). \u003cstrong>Continental\u003c/strong> = gruesa (hasta 70 km, bajo las montañas).\u003c/p>\n\u003c/div>\n\u003cdiv class=\"en\">\n\u003cp>\u003cstrong>Oceanic\u003c/strong> = thin (5 km, under oceans). \u003cstrong>Continental\u003c/strong> = thick (up to 70 km, under mountains).\u003c/p>\n\u003c/div>\n\u003c/div>"}, {"id": "geo-2-4", "exam": "geo", "part": "Geología IV · Respuesta corta", "partEn": "Short answer (5/11)", "sub": "", "n": "4", "q": "\u003cem>Name 2 destructive forces responsible for landform formation.\u003c/em>", "tags": [{"k": "ok", "t": "Tú: a ✓ (weathering y water erosion) · b ✗"}, {"k": "good", "t": "Correctas: weathering, erosion (water, wind, ice), landslides"}], "status": "partial", "body": "\u003cdiv class=\"bi\">\n\u003cdiv class=\"es\">\n\u003cp>\"Constructive volcanic deposition\" es \u003cstrong>constructiva\u003c/strong>, no destructiva. Destructivas: \u003cstrong>meteorización\u003c/strong>, \u003cstrong>erosión\u003c/strong> (agua, viento, hielo), \u003cstrong>deslizamientos\u003c/strong>.\u003c/p>\n\u003c/div>\n\u003cdiv class=\"en\">\n\u003cp>\"Constructive volcanic deposition\" is \u003cstrong>constructive\u003c/strong>, not destructive. Destructive: \u003cstrong>weathering\u003c/strong>, \u003cstrong>erosion\u003c/strong> (water, wind, ice), \u003cstrong>landslides\u003c/strong>.\u003c/p>\n\u003c/div>\n\u003c/div>"}, {"id": "geo-2-5", "exam": "geo", "part": "Geología IV · Respuesta corta", "partEn": "Short answer (5/11)", "sub": "", "n": "5", "q": "\u003cem>Name 2 endogenic processes of landform formation.\u003c/em>", "tags": [{"k": "ok", "t": "Tú: a ✓ (tectonic plates) · b ✗"}, {"k": "good", "t": "Correctas: plate tectonics (folding, faulting), volcanism, earthquakes"}], "status": "partial", "body": "\u003cdiv class=\"bi\">\n\u003cdiv class=\"es\">\n\u003cp>\"Destructive forces\" no es un proceso \u003cstrong>endógeno\u003c/strong>. Endógenos (de \u003cstrong>adentro\u003c/strong> de la Tierra): \u003cstrong>movimiento de placas\u003c/strong> (plegamiento, fallas), \u003cstrong>volcanismo\u003c/strong>, \u003cstrong>terremotos\u003c/strong>.\u003c/p>\n\u003c/div>\n\u003cdiv class=\"en\">\n\u003cp>\"Destructive forces\" is not an \u003cstrong>endogenic\u003c/strong> process. Endogenic (from \u003cstrong>inside\u003c/strong> Earth): \u003cstrong>plate movement\u003c/strong> (folding, faulting), \u003cstrong>volcanism\u003c/strong>, \u003cstrong>earthquakes\u003c/strong>.\u003c/p>\n\u003c/div>\n\u003c/div>"}, {"id": "geo-2-6", "exam": "geo", "part": "Geología IV · Respuesta corta", "partEn": "Short answer (5/11)", "sub": "", "n": "6", "q": "\u003cem>Name two characteristics a material must have to be considered a mineral.\u003c/em>", "tags": [{"k": "bad", "t": "Tú: cleavage, streak, luster, heat ✗"}, {"k": "good", "t": "Correcta: naturally occurring · inorganic · solid · definite chemical composition · crystalline structure"}], "status": "bad", "body": "\u003cdiv class=\"bi\">\n\u003cdiv class=\"es\">\n\u003cp>Escribiste \u003cstrong>propiedades para identificar\u003c/strong> minerales. La pregunta pide lo que \u003cstrong>define\u003c/strong> un mineral. Cualquiera de las 5: \u003cstrong>natural, inorgánico, sólido, composición química definida, estructura cristalina\u003c/strong>.\u003c/p>\n\u003c/div>\n\u003cdiv class=\"en\">\n\u003cp>You wrote \u003cstrong>properties used to identify\u003c/strong> minerals. The question asks what \u003cstrong>defines\u003c/strong> a mineral. Any of the 5: \u003cstrong>naturally occurring, inorganic, solid, definite chemical composition, crystalline structure\u003c/strong>.\u003c/p>\n\u003c/div>\n\u003c/div>"}, {"id": "geo-2-7", "exam": "geo", "part": "Geología IV · Respuesta corta", "partEn": "Short answer (5/11)", "sub": "", "n": "7", "q": "\u003cem>Name the two types of igneous rocks.\u003c/em>", "tags": [{"k": "good", "t": "Tú: intrusive y extrusive ✓✓"}], "status": "good", "body": "\u003cdiv class=\"bi\">\n\u003cdiv class=\"es\">\n\u003cp>¡Perfecto! \u003cstrong>Intrusiva\u003c/strong> (se enfría bajo tierra, lenta) y \u003cstrong>extrusiva\u003c/strong> (en la superficie, rápida).\u003c/p>\n\u003c/div>\n\u003cdiv class=\"en\">\n\u003cp>Perfect! \u003cstrong>Intrusive\u003c/strong> (cools underground, slowly) and \u003cstrong>extrusive\u003c/strong> (on the surface, quickly).\u003c/p>\n\u003c/div>\n\u003c/div>"}, {"id": "geo-3-1", "exam": "geo", "part": "Geología V · Pensamiento crítico", "partEn": "Critical thinking (2.5/8)", "sub": "", "n": "1", "q": "\u003cem>Explain two agricultural soil conservation practices (3 pts).\u003c/em>", "tags": [{"k": "bad", "t": "Tú: 0.5 — explicaste cómo se forma el suelo"}], "status": "bad", "body": "\u003cdiv class=\"bi\">\n\u003cdiv class=\"es\">\n\u003cp>\u003cstrong>Respuesta modelo\u003c/strong>:\n\u003cstrong>Práctica 1 – Rotación de cultivos\u003c/strong>: el agricultor cambia el cultivo cada temporada (por ejemplo, maíz y luego frijoles). Así el suelo recupera sus nutrientes y no se agota.\n\u003cstrong>Práctica 2 – Arado en curvas de nivel\u003c/strong>: se ara siguiendo la forma de la colina. Los surcos frenan el agua de lluvia y evitan que se lleve el suelo (erosión).\u003c/p>\n\u003c/div>\n\u003cdiv class=\"en\">\n\u003cp>\u003cstrong>Model answer\u003c/strong>:\n\u003cstrong>Practice 1 – Crop rotation\u003c/strong>: the farmer changes the crop every season (for example, corn and then beans). This way the soil recovers its nutrients and is not used up.\n\u003cstrong>Practice 2 – Contour plowing\u003c/strong>: the land is plowed following the shape of the hill. The furrows slow down rainwater and stop it from carrying the soil away (erosion).\u003c/p>\n\u003c/div>\n\u003c/div>"}, {"id": "geo-3-2", "exam": "geo", "part": "Geología V · Pensamiento crítico", "partEn": "Critical thinking (2.5/8)", "sub": "", "n": "2", "q": "\u003cem>Landform formation: Volcano (5 pts).\u003c/em>", "tags": [{"k": "ok", "t": "Tú: 2/5"}], "status": "partial", "body": "\u003cdiv class=\"table-scroll\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Punto de la rúbrica · Rubric point\u003c/th>\n\u003cth>Tú · You\u003c/th>\n\u003cth>Respuesta modelo · Model answer\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>1. Fuerza dominante · \u003cem>Dominant force\u003c/em>\u003c/td>\n\u003ctd>\"destructive forces of weathering\" ✗\u003c/td>\n\u003ctd>\u003cstrong>Constructive (endogenic) force: Earth's internal heat that makes magma\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>2. Límite o agente · \u003cem>Boundary / agent\u003c/em>\u003c/td>\n\u003ctd>\"sedimentary\" ✗ (es un tipo de roca)\u003c/td>\n\u003ctd>\u003cstrong>Convergent boundary (subduction)\u003c/strong>, e.g., the Cocos plate sinking under the Caribbean plate in Costa Rica\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>3. Cómo se mueve el material · \u003cem>How material moves\u003c/em>\u003c/td>\n\u003ctd>sin respuesta ✗\u003c/td>\n\u003ctd>\u003cstrong>First\u003c/strong>, the oceanic plate sinks and melts. \u003cstrong>Then\u003c/strong>, magma (less dense) rises through cracks. \u003cstrong>Next\u003c/strong>, pressure builds and lava and ash erupt. \u003cstrong>Finally\u003c/strong>, layers cool and pile up to build the cone.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>4. Tipo de roca · \u003cem>Rock type\u003c/em>\u003c/td>\n\u003ctd>igneous (intrusive and extrusive) ✓\u003c/td>\n\u003ctd>\u003cstrong>Extrusive igneous rock (basalt, andesite)\u003c/strong> because lava cools quickly on the surface\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cdiv class=\"bi\">\n\u003cdiv class=\"es\">\n\u003cp>Para el cañón, la fosa y el delta, mira la tabla de la sección 6 del \u003cstrong>PDF de estudio\u003c/strong>: el examen puede pedir cualquiera.\u003c/p>\n\u003c/div>\n\u003cdiv class=\"en\">\n\u003cp>For the canyon, trench and delta, see the table in section 6 of the \u003cstrong>study book\u003c/strong>: the test can ask for any of them.\u003c/p>\n\u003c/div>\n\u003c/div>"}, {"id": "cell-4-1", "exam": "cell", "part": "La Célula I · Selección única", "partEn": "Multiple choice (16/22)", "sub": "A. Teoría celular · Cell theory", "n": "1", "q": "\u003cem>Which scientist first used the term \"cell\" after observing cork in 1665?\u003c/em>", "tags": [{"k": "good", "t": "Tú: c ✓ — Robert Hooke"}], "status": "good", "body": "\u003cdiv class=\"bi\">\n\u003cdiv class=\"es\">\n\u003cp>Hooke vio celdas vacías en el \u003cstrong>corcho\u003c/strong> y las llamó \"células\" (cuartitos).\u003c/p>\n\u003c/div>\n\u003cdiv class=\"en\">\n\u003cp>Hooke saw empty compartments in \u003cstrong>cork\u003c/strong> and called them \"cells\" (little rooms).\u003c/p>\n\u003c/div>\n\u003c/div>"}, {"id": "cell-4-2", "exam": "cell", "part": "La Célula I · Selección única", "partEn": "Multiple choice (16/22)", "sub": "A. Teoría celular · Cell theory", "n": "2", "q": "\u003cem>Theodor Schwann (1839) extended the cell theory by…\u003c/em>", "tags": [{"k": "good", "t": "Tú: a ✓ — expanded Schleiden's plant ideas to unify plant and animal biology"}], "status": "good", "body": "\u003cdiv class=\"bi\">\n\u003cdiv class=\"es\">\n\u003cp>Schleiden: plantas. \u003cstrong>Schwann: animales\u003c/strong> → juntos: \u003cstrong>todo\u003c/strong> ser vivo está hecho de células. (b = Leeuwenhoek; c = Virchow.)\u003c/p>\n\u003c/div>\n\u003cdiv class=\"en\">\n\u003cp>Schleiden: plants. \u003cstrong>Schwann: animals\u003c/strong> → together: \u003cstrong>all\u003c/strong> living things are made of cells. (b = Leeuwenhoek; c = Virchow.)\u003c/p>\n\u003c/div>\n\u003c/div>"}, {"id": "cell-4-3", "exam": "cell", "part": "La Célula I · Selección única", "partEn": "Multiple choice (16/22)", "sub": "B. Niveles de organización · Levels of organization", "n": "3", "q": "\u003cem>Correct order of the 5 levels, simplest to most complex.\u003c/em>", "tags": [{"k": "good", "t": "Tú: b ✓ — Cell → Tissue → Organ → Organ System → Organism"}], "status": "good", "body": "\u003cdiv class=\"bi\">\n\u003cdiv class=\"es\">\n\u003cp>Célula → tejido → órgano → sistema → organismo.\u003c/p>\n\u003c/div>\n\u003cdiv class=\"en\">\n\u003cp>Cell → tissue → organ → organ system → organism.\u003c/p>\n\u003c/div>\n\u003c/div>"}, {"id": "cell-4-4", "exam": "cell", "part": "La Célula I · Selección única", "partEn": "Multiple choice (16/22)", "sub": "B. Niveles de organización · Levels of organization", "n": "4", "q": "\u003cem>A group of similar cells working together to perform a specific function.\u003c/em>", "tags": [{"k": "good", "t": "Tú: b ✓ — Tissue"}], "status": "good", "body": "\u003cdiv class=\"bi\">\n\u003cdiv class=\"es\">\n\u003cp>\u003cstrong>Tejido\u003c/strong> = células parecidas + una función.\u003c/p>\n\u003c/div>\n\u003cdiv class=\"en\">\n\u003cp>\u003cstrong>Tissue\u003c/strong> = similar cells + one function.\u003c/p>\n\u003c/div>\n\u003c/div>"}, {"id": "cell-4-5", "exam": "cell", "part": "La Célula I · Selección única", "partEn": "Multiple choice (16/22)", "sub": "B. Niveles de organización · Levels of organization", "n": "5", "q": "\u003cem>How do a paramecium and a human differ in levels of organization?\u003c/em>", "tags": [{"k": "bad", "t": "Tú: a ✗"}, {"k": "good", "t": "Correcta: b — the paramecium does all vital activities in one cell; humans rely on specialized tissues, organs and systems"}], "status": "bad", "body": "\u003cdiv class=\"bi\">\n\u003cdiv class=\"es\">\n\u003cp>El paramecio es \u003cstrong>unicelular\u003c/strong>: \u003cstrong>no puede tener órganos\u003c/strong>. Una sola célula hace todo. El humano es multicelular, con células especializadas.\u003c/p>\n\u003c/div>\n\u003cdiv class=\"en\">\n\u003cp>A paramecium is \u003cstrong>unicellular\u003c/strong>: it \u003cstrong>cannot have organs\u003c/strong>. One single cell does everything. A human is multicellular, with specialized cells.\u003c/p>\n\u003c/div>\n\u003c/div>"}, {"id": "cell-4-6", "exam": "cell", "part": "La Célula I · Selección única", "partEn": "Multiple choice (16/22)", "sub": "C. La célula · The cell", "n": "6", "q": "\u003cem>Genetic material floats freely in the cytoplasm, not enclosed in a nuclear membrane.\u003c/em>", "tags": [{"k": "good", "t": "Tú: b ✓ — Prokaryotic cell"}], "status": "good", "body": "\u003cdiv class=\"bi\">\n\u003cdiv class=\"es\">\n\u003cp>Sin membrana nuclear = \u003cstrong>sin núcleo\u003c/strong> = \u003cstrong>procariota\u003c/strong>.\u003c/p>\n\u003c/div>\n\u003cdiv class=\"en\">\n\u003cp>No nuclear membrane = \u003cstrong>no nucleus\u003c/strong> = \u003cstrong>prokaryotic\u003c/strong>.\u003c/p>\n\u003c/div>\n\u003c/div>"}, {"id": "cell-4-7", "exam": "cell", "part": "La Célula I · Selección única", "partEn": "Multiple choice (16/22)", "sub": "C. La célula · The cell", "n": "7", "q": "\u003cem>A eukaryotic cell with membrane, mitochondria, Golgi and lysosomes, but NO cell wall, chloroplasts or large central vacuole.\u003c/em>", "tags": [{"k": "bad", "t": "Tú: c (plant) ✗"}, {"k": "good", "t": "Correcta: a — animal cell"}], "status": "bad", "body": "\u003cdiv class=\"bi\">\n\u003cdiv class=\"es\">\n\u003cp>Lo que le \u003cstrong>falta\u003c/strong> es justo lo que tienen las plantas (pared, cloroplastos, vacuola central). Sin eso → \u003cstrong>animal\u003c/strong>. Además tiene \u003cstrong>lisosomas\u003c/strong>, típicos de las células animales.\u003c/p>\n\u003c/div>\n\u003cdiv class=\"en\">\n\u003cp>What it \u003cstrong>lacks\u003c/strong> is exactly what plants have (wall, chloroplasts, central vacuole). Without them → \u003cstrong>animal\u003c/strong>. It also has \u003cstrong>lysosomes\u003c/strong>, typical of animal cells.\u003c/p>\n\u003c/div>\n\u003c/div>"}, {"id": "cell-4-8", "exam": "cell", "part": "La Célula I · Selección única", "partEn": "Multiple choice (16/22)", "sub": "C. La célula · The cell", "n": "8", "q": "\u003cem>An amoeba digests, eliminates waste and makes energy in its single cell. Which postulate?\u003c/em>", "tags": [{"k": "good", "t": "Tú: b ✓ — the cell is the basic unit of structure and function"}], "status": "good", "body": "\u003cdiv class=\"bi\">\n\u003cdiv class=\"es\">\n\u003cp>Una célula hace \u003cstrong>todas las funciones\u003c/strong> → la célula es la \u003cstrong>unidad básica de estructura y función\u003c/strong>.\u003c/p>\n\u003c/div>\n\u003cdiv class=\"en\">\n\u003cp>One cell does \u003cstrong>all the functions\u003c/strong> → the cell is the \u003cstrong>basic unit of structure and function\u003c/strong>.\u003c/p>\n\u003c/div>\n\u003c/div>"}, {"id": "cell-4-9", "exam": "cell", "part": "La Célula I · Selección única", "partEn": "Multiple choice (16/22)", "sub": "D. Microorganismos · Microorganisms", "n": "9", "q": "\u003cem>An infectious agent with no cytoplasm, ribosomes or membrane; only a protein capsid around genetic material.\u003c/em>", "tags": [{"k": "good", "t": "Tú: a ✓ — a non-cellular virus"}], "status": "good", "body": "\u003cdiv class=\"bi\">\n\u003cdiv class=\"es\">\n\u003cp>Cápside + material genético, sin estructuras celulares = \u003cstrong>virus (acelular)\u003c/strong>.\u003c/p>\n\u003c/div>\n\u003cdiv class=\"en\">\n\u003cp>Capsid + genetic material, no cell structures = \u003cstrong>virus (non-cellular)\u003c/strong>.\u003c/p>\n\u003c/div>\n\u003c/div>"}, {"id": "cell-4-10", "exam": "cell", "part": "La Célula I · Selección única", "partEn": "Multiple choice (16/22)", "sub": "D. Microorganismos · Microorganisms", "n": "10", "q": "\u003cem>A bacterium copies its circular DNA and divides evenly into two identical daughter cells.\u003c/em>", "tags": [{"k": "good", "t": "Tú: b ✓ — Binary fission"}], "status": "good", "body": "\u003cdiv class=\"bi\">\n\u003cdiv class=\"es\">\n\u003cp>Dos células \u003cstrong>iguales\u003c/strong> = \u003cstrong>fisión binaria\u003c/strong>.\u003c/p>\n\u003c/div>\n\u003cdiv class=\"en\">\n\u003cp>Two \u003cstrong>equal\u003c/strong> cells = \u003cstrong>binary fission\u003c/strong>.\u003c/p>\n\u003c/div>\n\u003c/div>"}, {"id": "cell-4-11", "exam": "cell", "part": "La Célula I · Selección única", "partEn": "Multiple choice (16/22)", "sub": "D. Microorganismos · Microorganisms", "n": "11", "q": "\u003cem>Which organisms convert atmospheric nitrogen gas into compounds plants can use?\u003c/em>", "tags": [{"k": "good", "t": "Tú: c ✓ — nitrogen-fixing bacteria"}], "status": "good", "body": "\u003cdiv class=\"bi\">\n\u003cdiv class=\"es\">\n\u003cp>Las bacterias \u003cstrong>fijadoras de nitrógeno\u003c/strong> (en el suelo y en las raíces de los frijoles) convierten el N₂.\u003c/p>\n\u003c/div>\n\u003cdiv class=\"en\">\n\u003cp>\u003cstrong>Nitrogen-fixing bacteria\u003c/strong> (in soil and in bean roots) convert N₂.\u003c/p>\n\u003c/div>\n\u003c/div>"}, {"id": "cell-4-12", "exam": "cell", "part": "La Célula I · Selección única", "partEn": "Multiple choice (16/22)", "sub": "D. Microorganismos · Microorganisms", "n": "12", "q": "\u003cem>Why do antibiotics work against strep throat but not the common cold?\u003c/em>", "tags": [{"k": "good", "t": "Tú: c ✓ — strep is bacteria; the cold is a virus"}], "status": "good", "body": "\u003cdiv class=\"bi\">\n\u003cdiv class=\"es\">\n\u003cp>Los antibióticos atacan estructuras de \u003cstrong>bacterias\u003c/strong>; los \u003cstrong>virus\u003c/strong> no las tienen.\u003c/p>\n\u003c/div>\n\u003cdiv class=\"en\">\n\u003cp>Antibiotics attack \u003cstrong>bacterial\u003c/strong> structures; \u003cstrong>viruses\u003c/strong> don't have them.\u003c/p>\n\u003c/div>\n\u003c/div>"}, {"id": "cell-4-13", "exam": "cell", "part": "La Célula I · Selección única", "partEn": "Multiple choice (16/22)", "sub": "D. Microorganismos · Microorganisms", "n": "13", "q": "\u003cem>Why is it hard to design safe antiviral medicines?\u003c/em>", "tags": [{"k": "good", "t": "Tú: b ✓ — they must stop the virus without harming human host cells"}], "status": "good", "body": "\u003cdiv class=\"bi\">\n\u003cdiv class=\"es\">\n\u003cp>El virus usa \u003cstrong>nuestras propias células\u003c/strong> para reproducirse.\u003c/p>\n\u003c/div>\n\u003cdiv class=\"en\">\n\u003cp>The virus uses \u003cstrong>our own cells\u003c/strong> to reproduce.\u003c/p>\n\u003c/div>\n\u003c/div>"}, {"id": "cell-4-14", "exam": "cell", "part": "La Célula I · Selección única", "partEn": "Multiple choice (16/22)", "sub": "D. Microorganismos · Microorganisms", "n": "14", "q": "\u003cem>Why is high community vaccination essential to protect newborns and immunocompromised people?\u003c/em>", "tags": [{"k": "bad", "t": "Tú: c ✗"}, {"k": "good", "t": "Correcta: b — herd immunity limits pathogen spread"}], "status": "bad", "body": "\u003cdiv class=\"bi\">\n\u003cdiv class=\"es\">\n\u003cp>\u003cstrong>Inmunidad de rebaño\u003c/strong>: si casi todos están vacunados, el microbio no se propaga y protege a quien \u003cstrong>no puede vacunarse\u003c/strong>. Nadie \"absorbe\" células T de otra persona.\u003c/p>\n\u003c/div>\n\u003cdiv class=\"en\">\n\u003cp>\u003cstrong>Herd immunity\u003c/strong>: if almost everyone is vaccinated, the germ can't spread, protecting those who \u003cstrong>cannot be vaccinated\u003c/strong>. Nobody \"absorbs\" T cells from another person.\u003c/p>\n\u003c/div>\n\u003c/div>"}, {"id": "cell-4-15", "exam": "cell", "part": "La Célula I · Selección única", "partEn": "Multiple choice (16/22)", "sub": "D. Microorganismos · Microorganisms", "n": "15", "q": "\u003cem>Which structural feature distinguishes prokaryotic bacteria from eukaryotic protists and fungi?\u003c/em>", "tags": [{"k": "good", "t": "Tú: a ✓ — bacteria lack a nucleus and membrane-bound organelles"}], "status": "good", "body": "\u003cdiv class=\"bi\">\n\u003cdiv class=\"es\">\n\u003cp>Procariota = \u003cstrong>sin núcleo y sin organelos con membrana\u003c/strong>.\u003c/p>\n\u003c/div>\n\u003cdiv class=\"en\">\n\u003cp>Prokaryotic = \u003cstrong>no nucleus and no membrane-bound organelles\u003c/strong>.\u003c/p>\n\u003c/div>\n\u003c/div>"}, {"id": "cell-4-16", "exam": "cell", "part": "La Célula I · Selección única", "partEn": "Multiple choice (16/22)", "sub": "D. Microorganismos · Microorganisms", "n": "16", "q": "\u003cem>Why are viruses considered non-cellular?\u003c/em>", "tags": [{"k": "good", "t": "Tú: a ✓ — they lack cell structures and cannot replicate without hijacking a host cell"}], "status": "good", "body": "\u003cdiv class=\"bi\">\n\u003cdiv class=\"es\">\n\u003cp>Sin citoplasma ni organelos; necesitan una \u003cstrong>célula huésped\u003c/strong> para reproducirse.\u003c/p>\n\u003c/div>\n\u003cdiv class=\"en\">\n\u003cp>No cytoplasm or organelles; they need a \u003cstrong>host cell\u003c/strong> to reproduce.\u003c/p>\n\u003c/div>\n\u003c/div>"}, {"id": "cell-4-17", "exam": "cell", "part": "La Célula I · Selección única", "partEn": "Multiple choice (16/22)", "sub": "D. Microorganismos · Microorganisms", "n": "17", "q": "\u003cem>A vital function of the human gut microbiome?\u003c/em>", "tags": [{"k": "good", "t": "Tú: a ✓ — helps digestion and makes vitamin K"}], "status": "good", "body": "\u003cdiv class=\"bi\">\n\u003cdiv class=\"es\">\n\u003cp>Las bacterias del intestino \u003cstrong>ayudan a digerir\u003c/strong> y producen \u003cstrong>vitamina K\u003c/strong>.\u003c/p>\n\u003c/div>\n\u003cdiv class=\"en\">\n\u003cp>Gut bacteria \u003cstrong>help digest food\u003c/strong> and make \u003cstrong>vitamin K\u003c/strong>.\u003c/p>\n\u003c/div>\n\u003c/div>"}, {"id": "cell-4-18", "exam": "cell", "part": "La Célula I · Selección única", "partEn": "Multiple choice (16/22)", "sub": "D. Microorganismos · Microorganisms", "n": "18", "q": "\u003cem>Yeasts: a small outgrowth develops on the parent and eventually detaches.\u003c/em>", "tags": [{"k": "bad", "t": "Tú: a (binary fission) ✗"}, {"k": "good", "t": "Correcta: b — Budding"}], "status": "bad", "body": "\u003cdiv class=\"bi\">\n\u003cdiv class=\"es\">\n\u003cp>\u003cstrong>Brote pequeño\u003c/strong> que \u003cstrong>se separa\u003c/strong> = \u003cstrong>gemación\u003c/strong>. En la fisión binaria salen \u003cstrong>dos mitades iguales\u003c/strong>.\u003c/p>\n\u003c/div>\n\u003cdiv class=\"en\">\n\u003cp>A \u003cstrong>small outgrowth\u003c/strong> that \u003cstrong>detaches\u003c/strong> = \u003cstrong>budding\u003c/strong>. Binary fission gives \u003cstrong>two equal halves\u003c/strong>.\u003c/p>\n\u003c/div>\n\u003c/div>"}, {"id": "cell-5-1", "exam": "cell", "part": "La Célula II · Pareo de organelos", "partEn": "Organelle matching (1/8)", "sub": "", "n": "1", "q": "Exclusivo de \u003cstrong>plantas\u003c/strong> y organismos fotosintéticos; hace \u003cstrong>fotosíntesis\u003c/strong>", "tags": [{"k": "good", "t": "Tú: G ✓"}, {"k": "good", "t": "Correcta: \u003cstrong>G. Chloroplast\u003c/strong>"}], "status": "good", "body": "\u003cp class=\"clue\">Pista · Clue: \u003cem>photosynthesis\u003c/em>\u003c/p>"}, {"id": "cell-5-2", "exam": "cell", "part": "La Célula II · Pareo de organelos", "partEn": "Organelle matching (1/8)", "sub": "", "n": "2", "q": "Estructuras especializadas para el \u003cstrong>movimiento\u003c/strong>", "tags": [{"k": "bad", "t": "Tú: H ✗"}, {"k": "good", "t": "Correcta: \u003cstrong>D. Cilia and flagella\u003c/strong>"}], "status": "bad", "body": "\u003cp class=\"clue\">Pista · Clue: \u003cem>movement\u003c/em>\u003c/p>"}, {"id": "cell-5-3", "exam": "cell", "part": "La Célula II · Pareo de organelos", "partEn": "Organelle matching (1/8)", "sub": "", "n": "3", "q": "Contienen \u003cstrong>enzimas digestivas\u003c/strong> que rompen moléculas y materiales no deseados", "tags": [{"k": "bad", "t": "Tú: F ✗"}, {"k": "good", "t": "Correcta: \u003cstrong>H. Lysosomes\u003c/strong>"}], "status": "bad", "body": "\u003cp class=\"clue\">Pista · Clue: \u003cem>enzymes\u003c/em>\u003c/p>"}, {"id": "cell-5-4", "exam": "cell", "part": "La Célula II · Pareo de organelos", "partEn": "Organelle matching (1/8)", "sub": "", "n": "4", "q": "\u003cstrong>Almacenan\u003c/strong> nutrientes, agua, iones y desechos", "tags": [{"k": "bad", "t": "Tú: D ✗"}, {"k": "good", "t": "Correcta: \u003cstrong>E. Vacuole\u003c/strong>"}], "status": "bad", "body": "\u003cp class=\"clue\">Pista · Clue: \u003cem>store\u003c/em>\u003c/p>"}, {"id": "cell-5-5", "exam": "cell", "part": "La Célula II · Pareo de organelos", "partEn": "Organelle matching (1/8)", "sub": "", "n": "5", "q": "Su función principal es generar \u003cstrong>energía\u003c/strong> por respiración celular (ATP)", "tags": [{"k": "bad", "t": "Tú: E ✗"}, {"k": "good", "t": "Correcta: \u003cstrong>C. Mitochondria\u003c/strong>"}], "status": "bad", "body": "\u003cp class=\"clue\">Pista · Clue: \u003cem>energy, ATP\u003c/em>\u003c/p>"}, {"id": "cell-5-6", "exam": "cell", "part": "La Célula II · Pareo de organelos", "partEn": "Organelle matching (1/8)", "sub": "", "n": "6", "q": "Organelo que guarda el \u003cstrong>ADN\u003c/strong>, en el centro de las células eucariotas", "tags": [{"k": "bad", "t": "Tú: A ✗"}, {"k": "good", "t": "Correcta: \u003cstrong>B. Nucleus\u003c/strong>"}], "status": "bad", "body": "\u003cp class=\"clue\">Pista · Clue: \u003cem>DNA\u003c/em>\u003c/p>"}, {"id": "cell-5-7", "exam": "cell", "part": "La Célula II · Pareo de organelos", "partEn": "Organelle matching (1/8)", "sub": "", "n": "7", "q": "\u003cstrong>Rodea\u003c/strong> la célula y es una \u003cstrong>barrera\u003c/strong> selectiva", "tags": [{"k": "bad", "t": "Tú: D ✗"}, {"k": "good", "t": "Correcta: \u003cstrong>A. Cell membrane\u003c/strong>"}], "status": "bad", "body": "\u003cp class=\"clue\">Pista · Clue: \u003cem>barrier\u003c/em>\u003c/p>"}, {"id": "cell-5-8", "exam": "cell", "part": "La Célula II · Pareo de organelos", "partEn": "Organelle matching (1/8)", "sub": "", "n": "8", "q": "\u003cstrong>Sintetizan proteínas\u003c/strong> con la información del ARN mensajero", "tags": [{"k": "bad", "t": "Tú: C ✗"}, {"k": "good", "t": "Correcta: \u003cstrong>F. Ribosome\u003c/strong>"}], "status": "bad", "body": "\u003cp class=\"clue\">Pista · Clue: \u003cem>proteins\u003c/em>\u003c/p>"}, {"id": "cell-6-1", "exam": "cell", "part": "La Célula III · Respuesta corta", "partEn": "Short answer (2/7)", "sub": "", "n": "1", "q": "\u003cem>Name the 3 postulates of the cell theory.\u003c/em>", "tags": [{"k": "bad", "t": "Tú: tipos de células ✗✗✗"}], "status": "bad", "body": "\u003cdiv class=\"bi\">\n\u003cdiv class=\"es\">\n\u003col>\n\u003cli>Todos los seres vivos están hechos de una o más células.\u003c/li>\n\u003cli>La célula es la unidad básica de estructura y función de los seres vivos.\u003c/li>\n\u003cli>Toda célula viene de otra célula que ya existía.\u003c/li>\n\u003c/ol>\n\u003c/div>\n\u003cdiv class=\"en\">\n\u003col>\n\u003cli>All living things are made of one or more cells.\u003c/li>\n\u003cli>The cell is the basic unit of structure and function in living things.\u003c/li>\n\u003cli>All cells come from pre-existing cells.\u003c/li>\n\u003c/ol>\n\u003c/div>\n\u003c/div>"}, {"id": "cell-6-2", "exam": "cell", "part": "La Célula III · Respuesta corta", "partEn": "Short answer (2/7)", "sub": "", "n": "2", "q": "\u003cem>Name 1 similarity between plant and animal cells.\u003c/em>", "tags": [{"k": "good", "t": "Tú: eukaryotic ✓"}], "status": "good", "body": "\u003cdiv class=\"bi\">\n\u003cdiv class=\"es\">\n\u003cp>También sirve: las dos tienen núcleo, membrana celular, mitocondrias.\u003c/p>\n\u003c/div>\n\u003cdiv class=\"en\">\n\u003cp>Also correct: both have a nucleus, cell membrane, mitochondria.\u003c/p>\n\u003c/div>\n\u003c/div>"}, {"id": "cell-6-3", "exam": "cell", "part": "La Célula III · Respuesta corta", "partEn": "Short answer (2/7)", "sub": "", "n": "3", "q": "\u003cem>Name 1 difference between plant and animal cells.\u003c/em>", "tags": [{"k": "bad", "t": "Tú: \"eukaryotic plant cell\" ✗"}, {"k": "good", "t": "Correcta: plant cells have a cell wall and chloroplasts; animal cells don't"}], "status": "bad", "body": "\u003cdiv class=\"bi\">\n\u003cdiv class=\"es\">\n\u003cp>\"Eucariota\" es una \u003cstrong>semejanza\u003c/strong> (las dos lo son), no una diferencia. Diferencias: \u003cstrong>pared celular\u003c/strong>, \u003cstrong>cloroplastos\u003c/strong>, \u003cstrong>vacuola central grande\u003c/strong> (solo plantas).\u003c/p>\n\u003c/div>\n\u003cdiv class=\"en\">\n\u003cp>\"Eukaryotic\" is a \u003cstrong>similarity\u003c/strong> (both are), not a difference. Differences: \u003cstrong>cell wall\u003c/strong>, \u003cstrong>chloroplasts\u003c/strong>, \u003cstrong>large central vacuole\u003c/strong> (plants only).\u003c/p>\n\u003c/div>\n\u003c/div>"}, {"id": "cell-6-4", "exam": "cell", "part": "La Célula III · Respuesta corta", "partEn": "Short answer (2/7)", "sub": "", "n": "4", "q": "\u003cem>Name 1 similarity between binary fission and fragmentation.\u003c/em>", "tags": [{"k": "good", "t": "Tú: asexual reproduction ✓"}], "status": "good", "body": "\u003cdiv class=\"bi\">\n\u003cdiv class=\"es\">\n\u003cp>Las dos son \u003cstrong>asexuales\u003c/strong>: un solo padre e hijos idénticos.\u003c/p>\n\u003c/div>\n\u003cdiv class=\"en\">\n\u003cp>Both are \u003cstrong>asexual\u003c/strong>: one parent and identical offspring.\u003c/p>\n\u003c/div>\n\u003c/div>"}, {"id": "cell-6-5", "exam": "cell", "part": "La Célula III · Respuesta corta", "partEn": "Short answer (2/7)", "sub": "", "n": "5", "q": "\u003cem>Name 1 difference between binary fission and fragmentation.\u003c/em>", "tags": [{"k": "bad", "t": "Tú: \"eventually detaches / sexual reproduction\" ✗"}], "status": "bad", "body": "\u003cdiv class=\"bi\">\n\u003cdiv class=\"es\">\n\u003cp>\"Se separa\" describe la \u003cstrong>gemación\u003c/strong>, y ninguna es sexual. \u003cstrong>Respuesta\u003c/strong>: en la fisión binaria \u003cstrong>una célula se divide en dos iguales\u003c/strong> (unicelulares, como las bacterias); en la fragmentación \u003cstrong>el cuerpo de un organismo multicelular se rompe en pedazos\u003c/strong> y cada pedazo crece hasta ser uno nuevo (estrella de mar).\u003c/p>\n\u003c/div>\n\u003cdiv class=\"en\">\n\u003cp>\"Detaches\" describes \u003cstrong>budding\u003c/strong>, and neither one is sexual. \u003cstrong>Answer\u003c/strong>: in binary fission \u003cstrong>one cell divides into two equal cells\u003c/strong> (unicellular, like bacteria); in fragmentation \u003cstrong>a multicellular organism's body breaks into pieces\u003c/strong> and each piece grows into a new one (starfish).\u003c/p>\n\u003c/div>\n\u003c/div>"}, {"id": "cell-7-1", "exam": "cell", "part": "La Célula IV · Escritura", "partEn": "Writing (4/13)", "sub": "", "n": "1", "q": "\u003cem>Explain why asexual reproduction is better for stable environments while sexual reproduction is preferable in variable environments (3 pts).\u003c/em>", "tags": [{"k": "bad", "t": "Tú: 0/3"}], "status": "bad", "body": "\u003cdiv class=\"bi\">\n\u003cdiv class=\"es\">\n\u003cp>\u003cstrong>Por qué perdiste los puntos\u003c/strong>: nombraste tipos (fisión binaria, gemación) pero no explicaste \u003cstrong>por qué\u003c/strong>.\u003c/p>\n\u003cp>\u003cstrong>Respuesta modelo\u003c/strong>: La reproducción asexual es mejor en ambientes estables porque \u003cstrong>un solo padre, que ya está adaptado\u003c/strong>, produce \u003cstrong>muchos hijos idénticos rápidamente\u003c/strong>, sin gastar energía buscando pareja. La reproducción sexual es mejor en ambientes cambiantes porque los hijos tienen \u003cstrong>variación genética\u003c/strong>; si el ambiente cambia, \u003cstrong>algunos tendrán características para sobrevivir\u003c/strong>.\u003c/p>\n\u003c/div>\n\u003cdiv class=\"en\">\n\u003cp>\u003cstrong>Why you lost points\u003c/strong>: you named types (binary fission, budding) but didn't explain \u003cstrong>why\u003c/strong>.\u003c/p>\n\u003cp>\u003cstrong>Model answer\u003c/strong>: Asexual reproduction is better for stable environments because \u003cstrong>one parent that is already well adapted\u003c/strong> produces \u003cstrong>many identical offspring quickly\u003c/strong>, without using energy to find a mate. Sexual reproduction is preferable in variable environments because the offspring have \u003cstrong>genetic variation\u003c/strong>; if the environment changes, \u003cstrong>some of them will have traits to survive\u003c/strong>.\u003c/p>\n\u003c/div>\n\u003c/div>"}, {"id": "cell-7-2", "exam": "cell", "part": "La Célula IV · Escritura", "partEn": "Writing (4/13)", "sub": "", "n": "2", "q": "\u003cem>Explain the 2 replication cycles of viruses and one difference (3 pts).\u003c/em>", "tags": [{"k": "ok", "t": "Tú: 1/3"}], "status": "partial", "body": "\u003cdiv class=\"bi\">\n\u003cdiv class=\"es\">\n\u003cp>\u003cstrong>Ojo\u003c/strong>: escribiste que el virus \"es procariota\". \u003cstrong>Falso\u003c/strong>: los virus \u003cstrong>no son células\u003c/strong> (acelulares).\u003c/p>\n\u003cp>\u003cstrong>Respuesta modelo\u003c/strong>:\n\u003cstrong>Ciclo lítico\u003c/strong>: el virus se adhiere a la célula e inyecta su ADN. La célula fabrica muchas copias del virus hasta que \u003cstrong>revienta\u003c/strong> y las libera.\n\u003cstrong>Ciclo lisogénico\u003c/strong>: el ADN del virus \u003cstrong>se une al ADN de la célula\u003c/strong> y queda escondido. Se copia cada vez que la célula se divide, hasta que un detonante lo activa.\n\u003cstrong>Diferencia\u003c/strong>: el lítico \u003cstrong>destruye la célula rápido\u003c/strong>; el lisogénico se queda \u003cstrong>latente\u003c/strong> sin matarla por un tiempo.\u003c/p>\n\u003c/div>\n\u003cdiv class=\"en\">\n\u003cp>\u003cstrong>Careful\u003c/strong>: you wrote that the virus \"is prokaryotic\". \u003cstrong>False\u003c/strong>: viruses are \u003cstrong>not cells\u003c/strong> (non-cellular).\u003c/p>\n\u003cp>\u003cstrong>Model answer\u003c/strong>:\n\u003cstrong>Lytic cycle\u003c/strong>: the virus attaches to the cell and injects its DNA. The cell makes many copies of the virus until it \u003cstrong>bursts\u003c/strong> and releases them.\n\u003cstrong>Lysogenic cycle\u003c/strong>: the virus DNA \u003cstrong>joins the host cell's DNA\u003c/strong> and stays hidden. It is copied every time the cell divides, until a trigger activates it.\n\u003cstrong>Difference\u003c/strong>: the lytic cycle \u003cstrong>destroys the cell quickly\u003c/strong>; the lysogenic cycle stays \u003cstrong>dormant\u003c/strong> without killing it for a while.\u003c/p>\n\u003c/div>\n\u003c/div>"}, {"id": "cell-7-3", "exam": "cell", "part": "La Célula IV · Escritura", "partEn": "Writing (4/13)", "sub": "", "n": "3", "q": "\u003cem>Compare the number of cells and type of cells of bacteria, protists and fungi (4 pts).\u003c/em>", "tags": [{"k": "ok", "t": "Tú: 3/4"}], "status": "partial", "body": "\u003cdiv class=\"bi\">\n\u003cdiv class=\"es\">\n\u003cp>\u003cstrong>Error\u003c/strong>: dijiste que los hongos son unicelulares; pueden ser \u003cstrong>uni- o multicelulares\u003c/strong>.\u003c/p>\n\u003cp>\u003cstrong>Respuesta modelo\u003c/strong>:\n\u003cstrong>a. Número\u003c/strong>: las bacterias son \u003cstrong>unicelulares\u003c/strong>; los protistas son \u003cstrong>casi todos unicelulares\u003c/strong> (algunos multicelulares, como el kelp); los hongos pueden ser \u003cstrong>unicelulares (levaduras) o multicelulares (setas)\u003c/strong>.\n\u003cstrong>b. Tipo\u003c/strong>: las bacterias son \u003cstrong>procariotas\u003c/strong>; los protistas y los hongos son \u003cstrong>eucariotas\u003c/strong>.\u003c/p>\n\u003c/div>\n\u003cdiv class=\"en\">\n\u003cp>\u003cstrong>Mistake\u003c/strong>: you said fungi are unicellular; they can be \u003cstrong>uni- or multicellular\u003c/strong>.\u003c/p>\n\u003cp>\u003cstrong>Model answer\u003c/strong>:\n\u003cstrong>a. Number\u003c/strong>: bacteria are \u003cstrong>unicellular\u003c/strong>; protists are \u003cstrong>mostly unicellular\u003c/strong> (some are multicellular, like kelp); fungi can be \u003cstrong>unicellular (yeasts) or multicellular (mushrooms)\u003c/strong>.\n\u003cstrong>b. Type\u003c/strong>: bacteria are \u003cstrong>prokaryotic\u003c/strong>; protists and fungi are \u003cstrong>eukaryotic\u003c/strong>.\u003c/p>\n\u003c/div>\n\u003c/div>"}, {"id": "cell-7-4", "exam": "cell", "part": "La Célula IV · Escritura", "partEn": "Writing (4/13)", "sub": "", "n": "4", "q": "\u003cem>Explain the role of microorganisms in ecosystems and human health (3 pts).\u003c/em>", "tags": [{"k": "bad", "t": "Tú: 0/3"}], "status": "bad", "body": "\u003cdiv class=\"bi\">\n\u003cdiv class=\"es\">\n\u003cp>\u003cstrong>Por qué perdiste los puntos\u003c/strong>: tu docente preguntó \"\u003cem>How?\u003c/em>\" y \"\u003cem>What is their role?\u003c/em>\": faltaba decir \u003cstrong>qué hacen\u003c/strong>.\u003c/p>\n\u003cp>\u003cstrong>Respuesta modelo\u003c/strong>:\n\u003cstrong>Ecosistemas\u003c/strong>: las bacterias y los hongos son \u003cstrong>descomponedores\u003c/strong>: descomponen organismos muertos y \u003cstrong>devuelven nutrientes al suelo\u003c/strong>. Algunas bacterias \u003cstrong>fijan nitrógeno\u003c/strong> para las plantas y las algas \u003cstrong>producen oxígeno\u003c/strong>.\n\u003cstrong>Salud humana\u003c/strong>: los microorganismos del intestino \u003cstrong>ayudan a digerir\u003c/strong> y producen \u003cstrong>vitamina K\u003c/strong>; algunos se usan para hacer medicinas como la \u003cstrong>penicilina\u003c/strong>. Otros son \u003cstrong>patógenos\u003c/strong> y causan enfermedades, como la faringitis (bacteria) o la gripe (virus).\u003c/p>\n\u003c/div>\n\u003cdiv class=\"en\">\n\u003cp>\u003cstrong>Why you lost points\u003c/strong>: the teacher asked \"\u003cem>How?\u003c/em>\" and \"\u003cem>What is their role?\u003c/em>\": you needed to say \u003cstrong>what they do\u003c/strong>.\u003c/p>\n\u003cp>\u003cstrong>Model answer\u003c/strong>:\n\u003cstrong>Ecosystems\u003c/strong>: bacteria and fungi are \u003cstrong>decomposers\u003c/strong>: they break down dead organisms and \u003cstrong>return nutrients to the soil\u003c/strong>. Some bacteria \u003cstrong>fix nitrogen\u003c/strong> for plants, and algae \u003cstrong>produce oxygen\u003c/strong>.\n\u003cstrong>Human health\u003c/strong>: gut microorganisms \u003cstrong>help digest food\u003c/strong> and make \u003cstrong>vitamin K\u003c/strong>; some are used to make medicines like \u003cstrong>penicillin\u003c/strong>. Others are \u003cstrong>pathogens\u003c/strong> that cause diseases, like strep throat (bacteria) or the flu (virus).\u003c/p>\n\u003c/div>\n\u003c/div>"}];

  const daysToExam = () => Math.max(0, Math.ceil((new Date(2026, 11, 4).getTime() - new Date(new Date().toDateString()).getTime()) / DAY));
  const PANIC_N = Math.ceil(ITEMS.length * 0.2); // el 20 % más probable
  const MODES = { ratitos: { es: "Ratitos", min: 5, note: "3–5 min · bus" }, pomodoro: { es: "Pomodoro", min: 25, note: "25 min + 5 de pausa" }, maraton: { es: "Maratón", min: 90, note: "1–2 h con pausas" } };

  /* ================= FSRS-6 (21 pesos por defecto) ================= */
  const W = [0.212, 1.2931, 2.3065, 8.2956, 6.4133, 0.8334, 3.0194, 0.001, 1.8722, 0.1666, 0.796, 1.4835, 0.0614, 0.2629, 1.6483, 0.6014, 1.8729, 0.5425, 0.0912, 0.0658, 0.1542];
  const DECAY = -W[20];
  const FACTOR = Math.pow(0.9, 1 / DECAY) - 1;
  const retr = (t, s) => Math.pow(1 + (FACTOR * t) / s, DECAY);
  const ivl = (s, r = 0.9) => (s / FACTOR) * (Math.pow(r, 1 / DECAY) - 1);
  const clampD = (d) => Math.min(10, Math.max(1, d));
  const d0 = (g) => clampD(W[4] - Math.exp(W[5] * (g - 1)) + 1);
  const nextD = (d, g) => { const dp = d + (-W[6] * (g - 3) * (10 - d)) / 9; return clampD(W[7] * d0(4) + (1 - W[7]) * dp); };
  const sRecall = (d, s, r, g) => s * (Math.exp(W[8]) * (11 - d) * Math.pow(s, -W[9]) * (Math.exp(W[10] * (1 - r)) - 1) * (g === 2 ? W[15] : 1) * (g === 4 ? W[16] : 1) + 1);
  const sForget = (d, s, r) => Math.min(s, W[11] * Math.pow(d, -W[12]) * (Math.pow(s + 1, W[13]) - 1) * Math.exp(W[14] * (1 - r)));
  const sShort = (s, g) => { let inc = Math.exp(W[17] * (g - 3 + W[18])) * Math.pow(s, -W[19]); if (g >= 3) inc = Math.max(inc, 1); return s * inc; };

  /* ================= Estado y guardado ================= */
  const KEY = "entender7:v1";
  const blank = () => ({ v: 1, cards: {}, feyn: {}, seen: {}, checkin: null, mode: "ratitos", hist: {}, days: {}, sims: [], life: false, log: [], lastVisit: 0, updatedAt: 0,
    custom: [], cal: {}, calTime: "16:00", calm: false, voice: false, focus: "plan", imgMiss: {}, pastOk: {}, tutorMode: "fable" });
  const loadLocal = () => { try { const raw = localStorage.getItem(KEY); if (raw) return Object.assign(blank(), JSON.parse(raw)); } catch { /* sin almacenamiento */ } return blank(); };
  let S = loadLocal();
  syncCustom();
  let lang = "both";
  try { lang = localStorage.getItem("entender7:lang") || "both"; } catch { /* nada */ }
  document.body.dataset.lang = lang;
  // Preferencias de este dispositivo: tema (Claro / Oscuro) y letra fácil de leer.
  const pref = (k, v) => { try { if (v === undefined) return localStorage.getItem("entender7:" + k); if (v === null) localStorage.removeItem("entender7:" + k); else localStorage.setItem("entender7:" + k, v); } catch { /* nada */ } return null; };
  function applyTheme(th) { if (th === "light" || th === "dark") document.documentElement.dataset.theme = th; else delete document.documentElement.dataset.theme; }
  const isDark = () => document.documentElement.dataset.theme === "dark" || (!document.documentElement.dataset.theme && matchMedia("(prefers-color-scheme: dark)").matches);
  applyTheme(pref("theme"));
  function applyFont(on) {
    document.body.classList.toggle("readable", on);
    if (on && !document.getElementById("font-readable")) {
      const l = document.createElement("link"); l.id = "font-readable"; l.rel = "stylesheet";
      l.href = "https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap";

  let remote = null, writing = false, again = false, remoteTimer = 0, sync = "local";
  const persistLocal = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch { /* nada */ } };
  function save() {
    S.updatedAt = Date.now();
    const k = dayKey();
    S.hist[k] = { geo: modPct("geo"), cell: modPct("cell") };
    const keys = Object.keys(S.hist).sort();
    while (keys.length > 40) delete S.hist[keys.shift()];
    persistLocal();
    if (remote) { clearTimeout(remoteTimer); remoteTimer = setTimeout(flushRemote, 1500); }
  }
  async function flushRemote() {
    if (!remote) return;
    if (writing) { again = true; return; }
    writing = true;
    try { await remote.set(JSON.parse(JSON.stringify(S))); setSync("cloud"); }
    catch (e) { if (e && e.code === "invalid_argument") { remote = null; setSync("local"); } else setSync("retry"); }
    finally { writing = false; if (again) { again = false; flushRemote(); } }
  }
  function setSync(s) { sync = s; const el = $("#sync"); if (el) el.textContent = SYNC_COPY[s]; }
  const SYNC_COPY = { cloud: "☁ Progreso guardado en tu cuenta", local: "Guardado en este dispositivo", loading: "Sincronizando…", slow: "Sin conexión: se guarda en este dispositivo", retry: "No se pudo sincronizar; se guarda aquí y se reintenta" };
  async function initRemote() {
    if (!window.claude || !window.claude.use) return;

      if (!db || !user) return;
      const uid = await user.id();
      if (!uid) return;
      const ref = db.doc(`data/users/${uid}/progreso`);
      setSync("loading");

      const snap = await ref.get();
      clearTimeout(timer);
      remote = ref;
      if (snap.exists) {
        const r = snap.data();
        if ((r.updatedAt || 0) > (S.updatedAt || 0)) { S = Object.assign(blank(), JSON.parse(JSON.stringify(r))); syncCustom(); persistLocal(); render(); }

  }

  /* ================= Memoria: estados y dominio ================= */
  function status(id, now = Date.now()) {
    const c = S.cards[id];
    if (!c || !c.reps) return "new";
    if (c.due <= now) return "due";
    if (c.st === "review" && c.s >= 5 && retr((now - c.last) / DAY, c.s) >= 0.85) return "mastered";
    return "learning";
  }
  function mastery(id, now = Date.now()) {
    const c = S.cards[id];
    if (!c || !c.reps || c.st !== "review") return c && c.reps ? 0.05 : 0;
    return Math.max(0, Math.min(1, retr((now - c.last) / DAY, c.s) * Math.min(1, c.s / 5)));
  }
  const avg = (arr) => (arr.length ? arr.reduce((a, b) => a + b, 0) / arr.length : 0);
  const modPct = (m) => Math.round(100 * avg(ITEMS.filter((i) => i.mod === m).map((i) => mastery(i.id))));
  const topicPct = (t) => Math.round(100 * avg(ITEMS.filter((i) => i.topic === t).map((i) => mastery(i.id))));
  const counts = (pool) => pool.reduce((a, i) => { a[status(i.id)]++; return a; }, { new: 0, learning: 0, mastered: 0, due: 0 });
  function yesterdayPct(m) {
    const today = dayKey();
    const prev = Object.keys(S.hist).filter((k) => k < today).sort().pop();
    return prev ? S.hist[prev][m] : 0;
  }
  // Racha con protector: 1 día de gracia (si faltaste un solo día, la racha no se rompe).
  function streakInfo() {
    let n = 0, grace = 0, d = Date.now();
    if (!S.days[dayKey(d)]) d -= DAY;
    for (;;) {
      if (S.days[dayKey(d)]) { n++; d -= DAY; continue; }
      if (!grace && n > 0 && S.days[dayKey(d - DAY)]) { grace = 1; d -= DAY; continue; }
      break;
    }
    return { n, grace };
  }
  const streak = () => streakInfo().n;
  function capDue(due) {
    const now = Date.now();
    if (S.life && now >= EXAM) return Math.max(due, now + 30 * DAY);
    if (now >= EXAM) return due;
    const lim = EXAM - 20 * 3600e3; // el día antes del examen
    return Math.min(due, Math.max(now + 6 * 3600e3, lim));
  }
  function rate(id, g, ms, err) {
    const now = Date.now();
    const c = Object.assign({ st: "new", reps: 0, lapses: 0 }, S.cards[id]);
    if (!c.reps) { c.s = W[g - 1]; c.d = d0(g); }
    else {
      const t = Math.max(0, (now - c.last) / DAY);
      c.s = t < 1 ? sShort(c.s, g) : g === 1 ? sForget(c.d, c.s, retr(t, c.s)) : sRecall(c.d, c.s, retr(t, c.s), g);
      c.d = nextD(c.d, g);
    }
    if (g === 1 && c.st === "review") c.lapses++;
    c.reps++; c.last = now;
    if (g === 1) { c.st = "learn"; c.due = now + 5 * 60e3; }
    else { c.st = "review"; c.due = capDue(now + Math.max(1, Math.round(ivl(c.s) * (g === 2 ? 0.8 : 1))) * DAY); }
    S.cards[id] = c;
    S.log.push([now, id, g, Math.round(ms), err || 0]);
    if (S.log.length > 300) S.log.splice(0, S.log.length - 300);
    S.days[dayKey(now)] = (S.days[dayKey(now)] || 0) + 1;
    save();
  }

  /* ================= Planificador por fecha (Deadline Scheduler) ================= */
  function todayTopics() {
    const k = dayKey();
    const keys = Object.keys(CONTENT.plan).sort();
    if (k < keys[0]) return CONTENT.plan[keys[0]];
    return CONTENT.plan[k] || [];
  }
  function mood() { return S.checkin && S.checkin.date === dayKey() ? S.checkin.mood : "normal"; }
  const isNight = () => new Date().getHours() >= 23;
  function interleave(list) {
    const groups = {};
    list.forEach((id) => (groups[ITEM[id].topic] ||= []).push(id));
    const out = []; let last = null;
    while (out.length < list.length) {
      const keys = Object.keys(groups).filter((k) => groups[k].length).sort((a, b) => groups[b].length - groups[a].length);
      const k = keys.find((x) => x !== last) || keys[0];
      out.push(groups[k].shift()); last = k;
    }
    return out;
  }
  function planCounts() {
    const due = ITEMS.filter((i) => status(i.id) === "due").length;
    const fresh = ITEMS.filter((i) => status(i.id) === "new").length;
    const days = Math.max(1, daysToExam());
    let quota = Math.min(fresh, Math.ceil(fresh / days) + 2);
    if (mood() === "cansado") quota = Math.min(quota, 3);
    if (mood() === "energia") quota = Math.min(fresh, quota + 4);
    if (isNight() || Date.now() >= EXAM) quota = 0;
    return { due, quota };
  }
  function buildQueue(kind, minutes, topic) {
    let target = minutes <= 5 ? 8 : minutes <= 30 ? 32 : 80;
    if (mood() === "cansado") target = Math.round(target * 0.6);
    let pool = ITEMS;
    if (kind === "topic") pool = ITEMS.filter((i) => i.topic === topic);
    if (kind === "panic") pool = ITEMS.filter((i) => i.hot);
    const due = pool.filter((i) => status(i.id) === "due").sort((a, b) => S.cards[a.id].due - S.cards[b.id].due).map((i) => i.id);
    const fresh = pool.filter((i) => status(i.id) === "new").map((i) => i.id);
    if (kind === "panic") return interleave(pool.slice().sort((a, b) => mastery(a.id) - mastery(b.id)).slice(0, PANIC_N).map((i) => i.id));
    if (kind === "hard" || kind === "fails") return interleave(focusPool(kind).slice(0, target).map((i) => i.id));
    if (kind === "topic") {
      const rest = pool.map((i) => i.id).filter((id) => !due.includes(id) && !fresh.includes(id));
      return [...due, ...fresh, ...rest];
    }
    const today = todayTopics();
    const order = [...fresh.filter((id) => today.includes(ITEM[id].topic)), ...fresh.filter((id) => !today.includes(ITEM[id].topic))];
    const { quota } = planCounts();
    const reviews = due.slice(0, target);
    const nNew = Math.max(0, Math.min(quota, target - reviews.length));
    return interleave([...reviews, ...order.slice(0, nNew)]);
  }

  // «Solo lo difícil»: alta dificultad FSRS, olvidos o «fija en examen» sin dominar. «Solo mis fallos»: lo que fallaste.
  function focusPool(kind) {
    const failed = new Set(S.log.filter((l) => l[2] === 1).map((l) => l[1]));
    return ITEMS.filter((i) => {
      const c = S.cards[i.id];
      if (kind === "fails") return failed.has(i.id) || (c && c.lapses > 0);
      return !!(c && c.reps && (c.d >= 6.5 || c.lapses > 0 || (i.hot && mastery(i.id) < 0.5)));
    }).sort((a, b) => mastery(a.id) - mastery(b.id));
  }

  /* ================= Navegación ================= */
  function route() {

  syncThemeBtn();
  try { matchMedia("(prefers-color-scheme: dark)").addEventListener("change", syncThemeBtn); } catch { /* navegador viejo */ }
