      ${checked ? "" : `<section class="card" aria-labelledby="mood-h"><h2 class="h" id="mood-h">¿Cómo andas hoy?</h2>
        <div class="mood">${[["energia", "⚡", "Con energía"], ["normal", "🙂", "Normal"], ["cansado", "😴", "Cansado"]].map(([k, e, l]) => `<button type="button" data-mood="${k}"><span aria-hidden="true">${e}</span>${l}</button>`).join("")}</div>
        <p class="small muted">Ajusto la sesión a cómo te sientes. Un toque y listo.</p></section>`}
      <section class="card accent" aria-labelledby="plan-h">
        <div><div class="kicker">${after ? "Para la vida" : "Hoy solo estudia esto"}</div><h2 class="h" id="plan-h">${due} repasos + ${quota} preguntas nuevas</h2>
        <p class="small muted">${today.length ? "Tema del día: " + today.map((t) => esc(TOPIC[t].es)).join(" · ") : after ? "Repasos suaves para no olvidar." : "Día de repaso: mezclo todo lo que estás por olvidar."}</p></div>
        ${today.length ? `<div class="plan-topics">${today.map((t) => `<a href="#t-${t}"><span>${esc(TOPIC[t].es)}</span><span class="mono muted">${topicPct(t)}%</span></a>`).join("")}</div>` : ""}
        <div><div class="kicker" style="margin-bottom:.4rem">¿Cuánto tiempo tienes?</div>

        ${S.focus !== "plan" && !focusCount ? `<p class="small muted">${S.focus === "fails" ? "Todavía no tienes fallos guardados. Empieza con el plan del día." : "Aún no hay preguntas difíciles para ti. Empieza con el plan del día."}</p>` : ""}
        <button type="button" class="btn primary block" id="start">${S.focus === "plan" ? (due + quota ? `Empezar · ~${Math.max(2, Math.min(MODES[S.mode].min, est))} min` : "Todo al día · practicar libre") : focusCount ? `Empezar · ${S.focus === "hard" ? "lo difícil" : "mis fallos"}` : "Practicar libre"}${S.calm ? " · 5 preguntas" : ""}</button>
      </section>
      <section class="card" aria-labelledby="way-h"><div class="kicker">A tu manera</div><h2 class="h" id="way-h" hidden>A tu manera</h2>
        <div class="toggles">
          <div class="toggle"><div><b>Modo TDAH</b><p class="small muted">5 preguntas por ronda, letra grande y sin distracciones.</p></div><button type="button" class="btn" data-tg="calm" aria-pressed="${!!S.calm}">${S.calm ? "Activado" : "Activar"}</button></div>
          ${TTS ? `<div class="toggle"><div><b>Voz primero</b><p class="small muted">Te leo cada pregunta, la respuesta y lo que dice el tutor. Ideal en el bus.</p></div><button type="button" class="btn" data-tg="voice" aria-pressed="${!!S.voice}">${S.voice ? "Activado" : "Activar"}</button></div>` : ""}
        </div>
        <p class="small muted">Letra fácil de leer y modo Claro / Oscuro: en el menú de tus materias.</p></section>
      <section class="card" aria-labelledby="prog-h"><div class="kicker">Tu avance real · ayer → hoy</div><h2 class="h" id="prog-h" hidden>Avance</h2>${modRows}</section>
      <div class="grid2">
        <a class="card" href="#panico" style="text-decoration:none"><div class="kicker" style="color:var(--accent)">Modo Pánico</div><b>Solo lo que más sale en el examen</b><span class="small muted">30 minutos con las preguntas más probables.</span></a>
        <a class="card" href="#simulacro" style="text-decoration:none"><div class="kicker">Simulacro real</div><b>20 preguntas · 20 minutos · nota cruda</b><span class="small muted">${lastSim ? `Último: hoy sacarías <b class="mono">${Math.round((100 * lastSim.score) / lastSim.total)}</b> (${lastSim.score}/${lastSim.total})` : "Como el examen, con preguntas tramposas."}</span></a>
        <a class="card" href="#subir" style="text-decoration:none"><div class="kicker">Subir y Entender</div><b>Tus apuntes → un tema nuevo</b><span class="small muted">Pega texto, una transcripción de YouTube o una foto, y lo convierto en los 5 pasos con preguntas.</span></a>
      </div>
      ${MCP ? calCardHtml() : ""}
      <section class="card quiet"><div class="row-wrap" style="justify-content:space-between"><div><b>Guardar para la vida</b><p class="small muted">Después del examen: 1 micro-repaso de 5 minutos al mes con lo más importante.</p></div>
        <button type="button" class="btn" id="life" aria-pressed="${S.life}">${S.life ? "Activado" : "Activar"}</button></div></section>
      <section class="only-mobile" style="gap:.6rem">${CONTENT.modules.map((m) => `<div class="kicker">${esc(m.es)}</div><div class="plan-topics">${TOPICS.filter((t) => t.mod === m.id).map((t) => `<a href="#t-${t.id}"><span>${esc(t.es)}</span><span class="mono muted">${topicPct(t.id)}%</span></a>`).join("")}</div>`).join("")}</section>`;
    $$("[data-mood]", v).forEach((b) => b.addEventListener("click", () => {
      S.checkin = { date: dayKey(), mood: b.dataset.mood };
      if (b.dataset.mood === "cansado") S.mode = "ratitos";
      save(); render();
    }));
    $$("[data-mode]", v).forEach((b) => b.addEventListener("click", () => { S.mode = b.dataset.mode; save(); render(); }));
    $$("[data-focus]", v).forEach((b) => b.addEventListener("click", () => { S.focus = b.dataset.focus; save(); render(); }));
    $$("[data-tg]", v).forEach((b) => b.addEventListener("click", () => { const k = b.dataset.tg; S[k] = !S[k]; save(); render(); }));
    $("#start", v).addEventListener("click", startPlanned);
    $("#hero-start", v).addEventListener("click", startPlanned);
    // El nombre viene de otra persona/plataforma: siempre como texto.
    $("#hello", v).textContent = myName ? `Hola, ${myName.split(/\s+/)[0]}` : "Hola";
    if (MCP) bindCalCard(v);
    $("#life", v).addEventListener("click", () => { S.life = !S.life; save(); render(); });
    S.lastVisit = Date.now(); persistLocal();
  }

  /* ================= Tema: Sistema de Entender en 5 pasos ================= */
  function renderTopic(v, t) {
    const idx = TOPICS.filter((x) => x.mod === t.mod).indexOf(t) + 1;
    const total = TOPICS.filter((x) => x.mod === t.mod).length;
    $("#crumb").innerHTML = `Ya entendiste el <b class="mono">${topicPct(t.id)}%</b> de <b>${esc(t.es)}</b> · <span class="muted">Modo: ${esc(modeLabel())}</span>`;
    const c = counts(ITEMS.filter((i) => i.topic === t.id));
    const feyn = S.feyn[t.id];
    document.body.style.overflow = "";
    v.innerHTML = `<div class="topic-grid">
      <div class="tg-head"><div><div class="kicker">${esc(MOD[t.mod].es)} · Bloque ${idx}/${total} · ${esc(MOD[t.mod].objectives)}</div>
      <h1 class="title">${esc(t.es)}</h1><p class="title-en en">${esc(t.en)}</p>
      <div class="states" style="margin-top:.6rem"><span><i class="st-new"></i>Nuevo ${c.new}</span><span><i class="st-learning"></i>En curso ${c.learning}</span><span><i class="st-mastered"></i>Dominado ${c.mastered}</span><span><i class="st-due"></i>Repaso ${c.due}</span></div></div>
      <div class="row-wrap"><a class="pill gem primary" href="#guia-${t.id}">✨ Aprender guiado · 7 pasos</a><span class="small muted">Imagen, explicación, preguntas y tu propia explicación, en orden.</span></div>
      ${howHtml(t)}</div>
      <aside class="imgpanel" id="imgpanel" aria-label="Imagen tocable"></aside>
      <div class="steps">
        <section class="step"><div class="step-n">1</div><div class="step-body"><h2 class="h">Guía · el mapa</h2>
          <div class="map3"><div><span class="kicker">Lo fácil</span>${bl(t.map.easy)}</div><div><span class="kicker">Lo difícil</span>${bl(t.map.hard)}</div><div class="exam"><span class="kicker">Siempre sale en el examen</span>${bl(t.map.exam)}</div></div></div></section>
        <section class="step"><div class="step-n">2</div><div class="step-body"><h2 class="h">Resumen que sí se entiende</h2>
          <ul class="sum">${t.sum.map((p) => `<li>${bl(p)}</li>`).join("")}</ul>
          ${t.table ? `<div class="kicker">Tabla para repasar</div>${tableHtml(t.table)}` : ""}</div></section>
        <section class="step"><div class="step-n">3</div><div class="step-body"><h2 class="h">Explicador de 2 minutos</h2>
          <p class="small muted">Mira la imagen tocable mientras escuchas: en «Proceso», cada paso se ilumina.</p>
          <ol class="beats" id="beats">${t.beats.map((p, i) => `<li data-b="${i}"><div>${bl(p, "div")}</div></li>`).join("")}</ol>
          <div class="row-wrap">
            <button type="button" class="btn dark" id="play" hidden>▶ Escuchar · 2 min</button>
            <button type="button" class="btn" id="audio" hidden>🎧 Solo audio (bus)</button>
            <button type="button" class="btn" id="stepbtn">Paso a paso →</button>
            <button type="button" class="btn" id="stop" hidden>■ Parar</button>
          </div></div></section>
        <section class="step"><div class="step-n">4</div><div class="step-body"><h2 class="h">Ejemplo de tu vida</h2>
          <div class="card life">${bl(t.life, "p")}</div></div></section>
        <section class="step"><div class="step-n">5</div><div class="step-body"><h2 class="h">¿De verdad entendiste?</h2>
          <p>Explícamelo con tus palabras en la barra de abajo, como si se lo enseñaras a alguien de 10 años. Te contesto en la conversación: qué entendiste y qué falta, sin juzgarte.</p>
          ${feyn ? `<span class="chip ${feyn === "entendido" ? "ok" : ""}">${{ entendido: "✓ Lo explicaste con tus palabras", casi: "◐ Casi: te falta un detalle", todavia: "Todavía no: vuelve a intentarlo" }[feyn]}</span>` : ""}
          <div class="row-wrap"><button type="button" class="btn primary" id="practice">Practicar este tema · ${t.items.length} preguntas</button>
          <button type="button" class="btn" id="explain">Explicar con mis palabras</button></div></div></section>
      </div></div>
      ${t.mod === "mine" ? `<div class="row-wrap"><button type="button" class="link-btn" id="del-topic">Borrar este tema</button></div>` : ""}`;
    renderPanel(t);
    $("#how-go", v).addEventListener("click", () => {
      const act = METHODS[methodOf(t)].act;
      if (act.startsWith("img:")) { renderPanel(t, act.slice(4)); $("#imgpanel").scrollIntoView({ behavior: "smooth", block: "start" }); }
      else $("#" + act, v).click();
    });
    const del = $("#del-topic", v);
    if (del) del.addEventListener("click", () => {
      if (!del.dataset.sure) { del.dataset.sure = "1"; del.textContent = "¿Seguro? Toca otra vez para borrarlo"; return; }
      S.custom = S.custom.filter((x) => x.id !== t.id);
      t.items.forEach((i) => delete S.cards[i[0]]);
      delete S.seen[t.id]; delete S.feyn[t.id]; delete S.imgMiss[t.id];
      syncCustom(); save(); location.hash = "subir";
    });
    S.seen[t.id] = true; persistLocal();
    $("#practice", v).addEventListener("click", () => startSession("topic", buildQueue("topic", 30, t.id), 0));
    $("#explain", v).addEventListener("click", () => { ctxTopic = t.id; renderCtx(); const a = $("#ask"); a.focus(); a.placeholder = `Explica «${t.es}» con tus palabras…`; a.dataset.custom = "1"; });
    setupExplainer(v, t);
  }

  const modeLabel = () => ({ ratitos: "Ratitos 5 min", pomodoro: "Pomodoro 25 min", maraton: "Maratón 1–2 h" }[S.mode] || MODES[S.mode].es);

  /* Enseña CÓMO estudiar: el método ideal según el tipo de tema */
  const HOW = { teoria: "linea", niveles: "feynman", sistemas: "casos" };
  const METHODS = {
    diagrama: { es: "Dibújalo de memoria", why: "Este tema es un dibujo: si lo puedes dibujar y nombrar sus partes, ya lo entiendes.", steps: ["Mira la imagen tocable 1 minuto y toca cada parte.", "Ciérrala y dibújala en un papel con sus nombres en español e inglés.", "Compárala y corrige lo que faltó. Mañana, otra vez."], btn: "Ver la imagen", act: "img:diagrama" },
    tabla: { es: "Compara y juega «¿Quién soy?»", why: "Aquí el examen te pide diferenciar cosas parecidas, no solo definirlas.", steps: ["Abre «Comparación» y elige las dos que más confundes.", "Di en voz alta una diferencia por cada fila.", "En la práctica te saldrán retos «¿Quién soy?» con esta tabla."], btn: "Comparar", act: "img:compara" },
    casos: { es: "Aprende con casos reales", why: "El examen te da un ejemplo y tú dices qué proceso es.", steps: ["Lee el ejemplo de tu vida (paso 4).", "Busca un ejemplo nuevo en tu casa, tu barrio o en Costa Rica.", "Practica: te saldrán casos reales mezclados."], btn: "Practicar con casos", act: "practice" },
    feynman: { es: "Explícalo en voz alta", why: "Son ideas en orden: si se lo explicas a alguien de 10 años, ya lo sabes.", steps: ["Lee el resumen (paso 2).", "Explícalo con tus palabras, en voz alta o escrito abajo.", "El tutor te dice qué entendiste y qué te faltó."], btn: "Explicar ahora", act: "explain" },
    linea: { es: "Ordénalo como una historia", why: "Son personas y fechas en orden: una historia se recuerda mejor que una lista.", steps: ["Abre la línea de tiempo y di qué hizo cada uno antes de tocarlo.", "Cuenta la historia completa sin mirar.", "Termina con los 3 postulados."], btn: "Ver la línea de tiempo", act: "img:linea" },
  };
  function methodOf(t) {
    const h = HOW[t.id];
    if (h && (h !== "linea" || t.timeline)) return h;
    if (t.mod === "mine") return "feynman";
    return t.table ? "tabla" : figsOf(t).length ? "diagrama" : "casos";
  }
  function howHtml(t) {
    const m = METHODS[methodOf(t)];
    return `<details class="how"><summary><span class="kicker">🧭 Cómo estudiar este tema</span><span>${m.es}</span></summary>
      <div class="how-body"><p class="small">${m.why}</p><ol class="small">${m.steps.map((x) => `<li>${x}</li>`).join("")}</ol><div><button type="button" class="btn" id="how-go">${m.btn}</button></div></div></details>`;
  }

  /* ================= Imagen tocable: cada explicación = 1 imagen ================= */
  const IMG_TYPES = { diagrama: "Diagrama", linea: "Línea de tiempo", compara: "Comparación", proceso: "Proceso", mapa: "Mapa mental", ejemplo: "Ejemplo cotidiano" };
  const imgTypes = (t) => [figsOf(t).length && "diagrama", t.timeline && "linea", t.table && entities(t.table).length > 1 && "compara", "proceso", "mapa", "ejemplo"].filter(Boolean);
  const EMOJI = { geo: "🌋", cell: "🔬", mine: "📒" };
  const short = (s) => String(s).split("·")[0].trim();
  let IMGV = { topic: null, type: null, cmp: [0, 1] };
  function bestType(t) {
    const miss = S.imgMiss[t.id] || {};
    const types = imgTypes(t);
    return types.slice().sort((a, b) => (miss[a] || 0) - (miss[b] || 0) || types.indexOf(a) - types.indexOf(b))[0];
  }
  function renderPanel(t, type) {
    const p = $("#imgpanel"); if (!p) return;
    if (IMGV.topic !== t.id) IMGV = { topic: t.id, type: bestType(t), cmp: [0, 1] };
    if (type) IMGV.type = type;
    const types = imgTypes(t);
    if (!types.includes(IMGV.type)) IMGV.type = types[0];
    const full = p.classList.contains("full");
    p.innerHTML = `<div class="imgpanel-head"><div class="kicker">Imagen tocable</div><button type="button" class="link-btn" id="zoom">${full ? "✕ Cerrar" : "⤢ Ver grande"}</button></div>
      <div class="imgtabs" role="tablist" aria-label="Tipo de imagen">${types.map((k) => `<button type="button" role="tab" data-type="${k}" aria-selected="${k === IMGV.type}">${IMG_TYPES[k]}</button>`).join("")}</div>
      <div class="imgbody" id="imgbody" role="tabpanel" aria-label="${IMG_TYPES[IMGV.type]}"></div>
      <div class="callout" id="callout" hidden aria-live="polite"></div>
      <button type="button" class="btn block" id="another">🔄 Hazme otra imagen (no entendí esta)</button>`;
    const body = $("#imgbody", p);
    ({ diagrama: drawDiagram, linea: drawTimeline, compara: drawCompare, proceso: drawProcess, mapa: drawMindMap, ejemplo: drawExample })[IMGV.type](body, t);
    $$("[data-type]", p).forEach((b) => b.addEventListener("click", () => renderPanel(t, b.dataset.type)));
    $("#zoom", p).addEventListener("click", () => toggleZoom(t));
    $("#another", p).addEventListener("click", () => {
      const miss = (S.imgMiss[t.id] ||= {});
      miss[IMGV.type] = (miss[IMGV.type] || 0) + 1; save();
      renderPanel(t, types[(types.indexOf(IMGV.type) + 1) % types.length]);
      if (Object.values(miss).reduce((a, b) => a + b, 0) >= 3) showCallout("¿Te ayudo de otra forma?", ["Ya probaste varias imágenes. Toca «No entendí la imagen» abajo o escríbele al tutor qué parte no entiendes.", "You've tried several pictures. Tap the hint below or tell the tutor which part you don't get."]);
    });
  }
  function toggleZoom(t) {
    const p = $("#imgpanel"); if (!p) return;
    p.classList.toggle("full");
    document.body.style.overflow = p.classList.contains("full") ? "hidden" : "";
    renderPanel(t);
    if (p.classList.contains("full")) $("#zoom", p).focus();
  }
  function showCallout(label, pair) {
    const c = $("#callout"); if (!c) return;
    c.hidden = false;
    c.innerHTML = `<b>${esc(label)}</b>${bl(pair, "div")}`;

      }).join("")}`).join("")}`;
    $$("[data-pexam]", v).forEach((b) => b.addEventListener("click", () => { pastExam = b.dataset.pexam; render(); }));
    $$("[data-pall]", v).forEach((b) => b.addEventListener("click", () => { pastAll = b.dataset.pall === "1"; render(); }));
    $$("[data-pok]", v).forEach((b) => b.addEventListener("click", () => { const id = b.dataset.pok; if (S.pastOk[id]) delete S.pastOk[id]; else S.pastOk[id] = Date.now(); save(); const y = window.scrollY; render(); window.scrollTo(0, y); }));
  }

  /* ================= Identidad sobre notas ================= */
  function identityLine() {
    const today = dayKey();
    const keys = Object.keys(S.hist).filter((k) => k < today).sort();
    if (!keys.length) return "";
    const first = keys[0];
    const days = Math.max(1, Math.round((new Date(today + "T12:00").getTime() - new Date(first + "T12:00").getTime()) / DAY));
    const parts = CONTENT.modules.map((m) => [m.es, S.hist[first][m.id] || 0, modPct(m.id)]).filter(([, a, b]) => b > a);
    if (!parts.length) return "";
    return `Hace ${days} ${days === 1 ? "día" : "días"} tenías ${parts.map(([n, a]) => `${a}% en ${esc(n)}`).join(" y ")}. Hoy ya dominas ${parts.map(([n, , b]) => `<b class="mono">${b}%</b>`).join(" y ")}. Sí puedes aprender esto.`;
  }

  /* ================= Subir y Entender: tus apuntes → tema con 5 pasos ================= */
  let upPhoto = null, upCtl = null, upMsg = "";
  function renderUpload(v) {
    $("#crumb").innerHTML = `<b>Subir y Entender</b>`;
    const mine = TOPICS.filter((t) => t.mod === "mine");
    v.innerHTML = `<div><div class="kicker">Subir y Entender</div><h1 class="title">Tus apuntes, convertidos en un tema</h1>
      <p class="muted" style="margin-top:.4rem">Pega lo que te dio tu docente, tus apuntes o la transcripción de un video. En unos segundos lo convierto en los 5 pasos del Sistema de Entender, con preguntas que se repasan solas.</p></div>
      ${SAMPLE ? "" : `<div class="notice">Esta función usa a Claude. Abre la app dentro de Claude para usarla; lo demás funciona igual.</div>`}
      <section class="card" aria-labelledby="up-h"><h2 class="h" id="up-h">¿Qué quieres entender?</h2>
        <label for="up-text" class="small"><b>Texto</b> (apuntes, resumen o transcripción)</label>
        <textarea id="up-text" class="field" rows="8" maxlength="30000" placeholder="Pega aquí el texto…"></textarea>
        <p class="small muted">¿Un video de YouTube? Debajo del video toca «…más» → «Mostrar transcripción», copia el texto y pégalo aquí.</p>
        <div class="row-wrap">${IMG ? `<button type="button" class="btn" id="up-photo-btn">📷 ${upPhoto ? "Cambiar foto" : "Subir foto de tus apuntes"}</button>${upPhoto ? `<span class="attach">📷 ${esc(upPhoto.name || "foto")} <button type="button" class="link-btn" id="up-photo-x" aria-label="Quitar foto">×</button></span>` : ""}` : ""}
          <label class="small" for="up-mod">Materia</label><select id="up-mod" class="field"><option value="Geología">Geología</option><option value="La Célula">La Célula</option><option value="Ciencias">Otra de Ciencias</option></select></div>
        <button type="button" class="btn primary block" id="up-go" ${SAMPLE ? "" : "disabled"}>Entender esto</button>
        <p class="small" id="up-msg" aria-live="polite">${esc(upMsg)}</p>
        <button type="button" class="btn" id="up-stop" hidden>Detener</button>
      </section>
      ${mine.length ? `<section class="card quiet"><div class="kicker">Mis temas · ${mine.length} de 8</div><div class="mine-list">${mine.map((t) => `<a class="btn" href="#t-${t.id}" style="justify-content:space-between"><span>${esc(t.es)}</span><span class="mono muted">${topicPct(t.id)}%</span></a>`).join("")}</div></section>` : ""}`;
    const pb = $("#up-photo-btn", v); if (pb) pb.addEventListener("click", () => $("#up-photo-in").click());
    const px = $("#up-photo-x", v); if (px) px.addEventListener("click", () => { upPhoto = null; render(); });
    $("#up-go", v).addEventListener("click", runUpload);
    $("#up-stop", v).addEventListener("click", () => { if (upCtl) upCtl.abort(); });
  }
  const upIn = Object.assign(document.createElement("input"), { type: "file", id: "up-photo-in", hidden: true, accept: "image/*" });
  document.body.append(upIn);
  upIn.addEventListener("change", (e) => {
    const f = e.target.files && e.target.files[0];
    e.target.value = "";
    if (!f || !IMG) return;
    if (f.size > IMG.maxInputBytes) { upMsg = "Esa foto es muy pesada. Prueba con una más liviana o recórtala."; render(); return; }
    upPhoto = f; upMsg = ""; render();
  });
  const str = (x, n) => (typeof x === "string" ? x.replace(/\s+/g, " ").trim().slice(0, n) : "");
  const okPair = (p, n) => { if (!Array.isArray(p)) return null; const es = str(p[0], n), en = str(p[1], n); return es ? [es, en || es] : null; };
  function cleanTopic(raw, subject) {
    if (!raw || typeof raw !== "object") return null;
    const id = "u" + Date.now().toString(36);
    const pairs = (a, n, max) => (Array.isArray(a) ? a.map((p) => okPair(p, n)).filter(Boolean) : []).slice(0, max);
    const sum = pairs(raw.sum, 260, 6), beats = pairs(raw.beats, 320, 6);
    const items = (Array.isArray(raw.items) ? raw.items : []).filter(Array.isArray)
      .map((i) => [str(i[0], 300), str(i[1], 300), str(i[2], 300), str(i[3], 300)]).filter((i) => i[0] && i[2]).slice(0, 10)
      .map((i, k) => [`${id}-${k + 1}`, i[0], i[1] || i[0], i[2], i[3] || i[2], false]);
    if (sum.length < 2 || items.length < 2) return null;
    const m = raw.map && typeof raw.map === "object" ? raw.map : {};
    return { id, mod: "mine", svg: null, subject, es: str(raw.es, 80) || "Mi tema", en: str(raw.en, 80) || "My topic",
      map: { easy: okPair(m.easy, 220) || sum[0], hard: okPair(m.hard, 220) || sum[1], exam: okPair(m.exam, 220) || sum[0] },
      sum, beats: beats.length >= 2 ? beats : sum, life: okPair(raw.life, 420) || sum[0], items, createdAt: Date.now() };
  }
  async function runUpload() {
    const text = $("#up-text").value.trim();
    const subject = $("#up-mod").value;
    if (!SAMPLE) return;
    if (!text && !upPhoto) { upMsg = "Pega un texto o sube una foto primero."; $("#up-msg").textContent = upMsg; return; }
    const go = $("#up-go"), stop = $("#up-stop"), msg = $("#up-msg");
    go.disabled = true; stop.hidden = false;
    msg.textContent = "Leyendo y entendiendo tus apuntes…"; msg.classList.add("glimmer");
    const prompt = `Eres el motor de "Entender", una app de estudio para un estudiante de 7.º grado de Costa Rica. Su examen de Ciencias (${subject}) es en inglés y su idioma fuerte es el español.
Convierte el MATERIAL en un tema con el "Sistema de Entender". Responde SOLO con un objeto JSON con esta forma exacta:
{"es":"título corto en español","en":"short English title","map":{"easy":["lo fácil","the easy part"],"hard":["lo difícil","the hard part"],"exam":["lo que siempre sale en el examen","what always appears on the test"]},"sum":[["frase","sentence"]],"beats":[["paso de la explicación","explanation step"]],"life":["ejemplo de la vida diaria en Costa Rica","everyday example"],"items":[["pregunta","question","respuesta corta","short answer"]]}
Reglas: "sum" tiene 5 frases y "beats" 5 pasos en orden; "items" tiene de 6 a 8 preguntas que comprueban comprensión (no solo memoria), con respuestas de máximo 25 palabras. Cada par va [español, inglés]. Frases cortas y sencillas. Usa SOLO lo que dice el material: no inventes datos. Si el material no es de estudio, devuelve {"error":"no es material de estudio"}.
MATERIAL:
${text ? text.slice(0, 30000) : "(está en la foto adjunta)"}`;
    upCtl = new AbortController();
    try {
      const opts = { signal: upCtl.signal, cache: false };
      if (tutorMode() === "fable") opts.model = TUTOR_MODEL; else opts.modelTier = "quick"; // Rápido y Ahorro: modelo rápido, gasta menos
      if (upPhoto) opts.images = [upPhoto];
      const raw = await SAMPLE.json(prompt, opts);
      if (raw && raw.error) throw { code: "not_study" };
      const t = cleanTopic(raw, subject);
      if (!t) throw { code: "invalid_json" };
      S.custom = (S.custom || []).concat(t);
      while (S.custom.length > 8) { const old = S.custom.shift(); old.items.forEach((i) => delete S.cards[i[0]]); }
      syncCustom(); save();
      upPhoto = null; upMsg = "";
      location.hash = "t-" + t.id;
    } catch (e) {
      const code = e && e.code;
      upMsg = code === "cancelled" ? "Detenido. Tu texto sigue ahí." : code === "not_study" ? "Eso no parece material de estudio. Prueba con tus apuntes o un resumen del tema." : code === "invalid_json" ? "No me salió bien el tema. Toca «Entender esto» otra vez o pega menos texto." : ERR_COPY[code] || "Se cortó la conexión. Vuelve a intentarlo.";
      if (code === "not_granted" || code === "sampling_disabled") SAMPLE = null;
      const m2 = $("#up-msg"); if (m2) { m2.classList.remove("glimmer"); m2.textContent = upMsg; }
    } finally {
      upCtl = null;
      const g2 = $("#up-go"), s2 = $("#up-stop");
      if (g2) g2.disabled = !SAMPLE; if (s2) s2.hidden = true;
    }
  }

  /* ================= Recordatorios en Google Calendar (conector mcp) ================= */
  let MCP = null, calBusy = false, calMsg = "", calNote = "";
  const CAL = "Google Calendar";
  const APP_URL = "https://claude.ai/artifact/DWHg9mvRsX87YFjpJPUUwF";
  const fmtDay = (d) => new Date(d + "T12:00").toLocaleDateString("es-CR", { weekday: "long", day: "numeric", month: "short" });
  function calEvents() {
    const time = /^\d\d:\d\d$/.test(S.calTime || "") ? S.calTime : "16:00";
    const [hh, mm] = time.split(":").map(Number);
    const endMin = Math.min(23 * 60 + 59, hh * 60 + mm + 30);
    const endT = `${pad(Math.floor(endMin / 60))}:${pad(endMin % 60)}`;
    const today = dayKey();
    const out = Object.keys(CONTENT.plan).sort().filter((d) => d >= today && !S.cal[d]).map((d) => {
      const names = CONTENT.plan[d].map((id) => TOPIC[id].es);
      return { key: d, label: fmtDay(d), input: {
        summary: names.length ? `📚 Ciencias: ${names.join(", ")}` : "📚 Ciencias: repaso mezclado",
        startTime: `${d}T${time}:00`, endTime: `${d}T${endT}:00`,
        description: `${names.length ? "Temas de hoy: " + names.join(" · ") : "Día de repaso: la app mezcla lo que estás por olvidar."}\n\nAbre Entender y toca «Empezar»: ${APP_URL}`,
        overrideReminders: [{ method: "popup", minutes: 10 }] } };
    });
    if (!S.cal.exam && today <= "2026-12-04") out.push({ key: "exam", label: "el día del examen", input: {
      summary: "📝 Examen de Ciencias · convocatoria", allDay: true, startTime: "2026-12-04T00:00:00", endTime: "2026-12-05T00:00:00",
      description: `Geología + La Célula. La noche antes: solo un repaso suave o el Modo Pánico, nada nuevo. Duerme bien.\n\n${APP_URL}`,
      overrideReminders: [{ method: "popup", minutes: 300 }] } });
    return out;
  }
  function calCardHtml() {
    const evs = calEvents(), made = Object.keys(S.cal).length;
    let inner;
    if (calNote) inner = `<p class="small">${esc(calNote)}</p><div><button type="button" class="link-btn" id="cal-recheck">Ya lo hice: revisar otra vez</button></div>`;
    else if (!evs.length) inner = `<p class="small">✅ Tu plan ya está en tu calendario${made ? ` (${made} eventos)` : ""}.</p>`;
    else inner = `<div class="row-wrap"><label class="small" for="cal-time">Hora de estudio</label><input type="time" class="field" id="cal-time" value="${esc(S.calTime || "16:00")}">
      <button type="button" class="btn" id="cal-go" ${calBusy ? "disabled" : ""}>Agregar ${evs.length} ${evs.length === 1 ? "evento" : "eventos"}</button></div>`;
    return `<section class="card quiet" id="cal-card" aria-labelledby="cal-h"><div><b id="cal-h">📅 Recordatorios en tu Google Calendar</b>
      <p class="small muted">Pongo cada día de estudio con sus temas (30 min, aviso 10 min antes) y el día del examen. Solo se crean cuando tocas el botón.</p></div>
      ${inner}<p class="small" id="cal-msg" aria-live="polite">${esc(calMsg)}</p></section>`;
  }
  function bindCalCard(v) {
    const ti = $("#cal-time", v); if (ti) ti.addEventListener("change", () => { if (/^\d\d:\d\d$/.test(ti.value)) { S.calTime = ti.value; save(); } });
    const go = $("#cal-go", v); if (go) go.addEventListener("click", addToCalendar);
    const rc = $("#cal-recheck", v); if (rc) rc.addEventListener("click", checkCal);
  }
  function refreshCal() { const c = $("#cal-card"); if (c && route().name === "hoy") { c.outerHTML = calCardHtml(); bindCalCard($("#view")); } }
  const setCalMsg = (m) => { calMsg = m; const el = $("#cal-msg"); if (el) el.textContent = m; };
  function calError(err, ev, made) {
    const pre = made ? `Se crearon ${made}. ` : "";
    switch (err && err.code) {
      case "needs_reauth": return pre + "Reconecta Google Calendar en claude.ai → Configuración → Conectores y vuelve a tocar el botón.";
      case "server_not_connected": case "server_not_found": return pre + "Agrega Google Calendar en claude.ai → Configuración → Conectores y vuelve a tocar el botón.";
      case "selection_required": return pre + "Tienes más de un Google Calendar conectado: elige uno cuando Claude te lo pregunte y vuelve a intentar.";
      case "approval_required": case "consent_required": return pre + "Necesito tu permiso para usar tu Google Calendar. Claude te lo pide cuando abres la app ahí: acepta y vuelve a tocar el botón.";
      case "not_in_manifest": return pre + "No diste permiso a esta app para usar tu Google Calendar. Puedes cambiarlo en el menú Permisos de esta página.";
      case "blocked_by_policy": return pre + "Tu organización no permite usar Google Calendar desde aquí.";
      case "tool_error": return pre + `Google Calendar no aceptó el evento de ${ev.label}: ${String(err.message || "error desconocido").slice(0, 160)}`;
      case "not_granted": case "capability_disabled": case "capability_removed": MCP = null; return pre + "Esta vista no puede usar tus conectores. Abre la app dentro de Claude.";
      default: return pre + `Se cortó la conexión con Google Calendar. Puede que el evento de ${ev.label} sí se haya creado: revisa tu calendario antes de volver a intentar.`;
    }
  }
  async function addToCalendar() {
    if (!MCP || calBusy) return;
    const ti = $("#cal-time"); if (ti && /^\d\d:\d\d$/.test(ti.value)) S.calTime = ti.value;
    const evs = calEvents(); if (!evs.length) return;
    calBusy = true; const go = $("#cal-go"); if (go) go.disabled = true;
    let made = 0;
    for (const ev of evs) {
      setCalMsg(`Creando ${made + 1} de ${evs.length}…`);
      try { await MCP.callTool(CAL, "create_event", ev.input); S.cal[ev.key] = true; made++; save(); }
      catch (err) { calBusy = false; calMsg = calError(err, ev, made); refreshCal(); return; }
    }
    calBusy = false; calMsg = `✅ Listo: ${made} ${made === 1 ? "evento nuevo" : "eventos nuevos"} en tu Google Calendar.`; refreshCal();
  }
  async function checkCal() {
    if (!MCP) return;
    calNote = "";
    try {
      const r = await MCP.listTools(CAL);
      const sv = (r.servers || []).find((x) => x.server === CAL);
      if (!sv || !sv.tools.length) calNote = "Para usar esto, agrega (o elige) Google Calendar en claude.ai → Configuración → Conectores.";
      else if (sv.authStatus === "needs_reauth") calNote = "Reconecta Google Calendar en claude.ai → Configuración → Conectores.";
      else if (!sv.tools.some((x) => x.name === "create_event")) calNote = "Tu Google Calendar no permite crear eventos desde aquí.";
    } catch (e) {
      if (e && (e.code === "not_granted" || e.code === "capability_disabled" || e.code === "capability_removed")) MCP = null;
    }
    if (route().name === "hoy") render();
  }

  /* ================= Capacidades de la plataforma ================= */
  async function initCaps() {
    if (!window.claude || !window.claude.use) return;
    claude.use("sample").then(async (s) => {
      SAMPLE = s;
      if (!s) return;
      renderCtx(); measure();
      if (["subir", "topic"].includes(route().name)) render();
      const lim = await s.limits().catch(() => null);
      if (lim && lim.images) { IMG = lim.images; $("#photo").accept = upIn.accept = lim.images.mediaTypes.join(","); if (route().name === "subir") render(); }
    });
    claude.use("tts").then((t) => {
      TTS = t; if (!t) return;
      t.onLine(({ id }) => { if (id && id[0] === "b") markBeat($("#view"), Number(id.slice(1))); });
      t.onState(({ state }) => { if (state === "idle") speaking = false; });
      if (route().name === "topic" || route().name === "hoy") render();
    });
    claude.use("mcp").then((m) => { MCP = m; if (m) checkCal(); });
    claude.use("user").then((u) => {
      if (!u || !u.name) return;
      u.name().then((n) => { myName = typeof n === "string" ? n.trim() : ""; const h = $("#hello"); if (h && myName) h.textContent = `Hola, ${myName.split(/\s+/)[0]}`; }).catch(() => {});
    });
    claude.use("dictation").then((d) => {
      DICT = d; if (!d) return;
      $("#mic-btn").hidden = false;
      d.onState(({ state }) => { $("#mic-btn").classList.toggle("on", state !== "idle"); $("#partial").hidden = state === "idle"; if (state === "idle") $("#partial").textContent = ""; measure(); });
      d.onPartial(({ text }) => { $("#partial").textContent = text; });
      d.onFinal(({ text }) => { const a = $("#ask"); a.value = a.value ? a.value + text : text.trimStart(); grow(); });
    });
  }

  render(); measure();
  initRemote(); initCaps();
})();
</script>
