<title>Entender Ciencias</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap">
<style>
/* Layout (estilo Claude + Codex): materias a la izquierda, una sola acción al centro, entrada única abajo.
   Paleta estricta de 3 colores: crema / carbón suave, tinta y un acento ámbar. Serifa en títulos, mono en números. */
:root {
  --bg: #FAF9F5; --side: #F2F0E9; --surface: #FFFFFF; --soft: #EFEDE6; --line: #E4E1D8;
  --ink: #1F1E1C; --muted: #6B6862;
  --accent: #B5532F; --accent-ink: #FFFFFF; --accent-soft: #F6E4DB; --send-ink: #FFFFFF;
  --good: #2E6A4F; --good-soft: #E3EFE8;
  --plate: #FFFDF9;
  --font-title: "Source Serif 4", Georgia, "Times New Roman", serif;
  --font-body: Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  --composer-h: 92px;
  --g1: #3B6FE0; --g2: #8E5BC4; --g3: #C9506A;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #171716; --side: #0C0C0C; --surface: #242423; --soft: #2C2C2A; --line: #363633;
    --ink: #ECEAE5; --muted: #A3A09A;
    --accent: #D97757; --accent-ink: #1A1A19; --accent-soft: #3B2720; --send-ink: #FFFFFF;
    --good: #7CC4A0; --good-soft: #1C2A23; --plate: #F4F0E8; color-scheme: dark;
    --g1: #8AB4F8; --g2: #C58AF9; --g3: #F28B82;
  }
}
:root[data-theme="dark"] {
  --bg: #171716; --side: #0C0C0C; --surface: #242423; --soft: #2C2C2A; --line: #363633;
  --ink: #ECEAE5; --muted: #A3A09A;
  --accent: #D97757; --accent-ink: #1A1A19; --accent-soft: #3B2720; --send-ink: #FFFFFF;
  --good: #7CC4A0; --good-soft: #1C2A23; --plate: #F4F0E8; color-scheme: dark;
    --g1: #8AB4F8; --g2: #C58AF9; --g3: #F28B82;
}

* { box-sizing: border-box; }
html, body { min-height: 100%; }
body { background: var(--bg); color: var(--ink); font: 16px/1.55 var(--font-body); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 8px; }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.kicker { font: 600 .74rem var(--font-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.title { font-family: var(--font-title); font-weight: 700; font-size: clamp(1.75rem, 5vw, 2.35rem); line-height: 1.12; margin: .2rem 0 0; text-wrap: balance; letter-spacing: -.01em; }
.title-en { color: var(--muted); font-size: 1.05rem; margin: .25rem 0 0; }
h2.h { font-family: var(--font-title); font-size: 1.3rem; font-weight: 700; margin: 0; line-height: 1.2; }
p { margin: 0; }
.muted { color: var(--muted); }
.small { font-size: .86rem; }
[hidden] { display: none !important; }

/* Bilingüe */
.en { display: block; color: var(--muted); font-size: .94em; }
.bi-inline .en { display: inline; }
body[data-lang="es"] .en { display: none !important; }
body[data-lang="en"] .es { display: none !important; }
body[data-lang="en"] .en { color: inherit; font-size: 1em; }

/* ---------- Estructura ---------- */
.app { display: grid; grid-template-columns: 1fr; min-height: 100vh; }
@media (min-width: 960px) { .app { grid-template-columns: 284px minmax(0, 1fr); } body.focus .app { grid-template-columns: minmax(0, 1fr); } }
.side { background: var(--soft); border-right: 1px solid var(--line); display: flex; flex-direction: column; gap: 1rem; padding: 1.1rem 1rem 1rem max(16px, env(safe-area-inset-left, 0px)); min-width: 0; }
@media (min-width: 960px) { .side { position: sticky; top: 0; height: 100vh; overflow-y: auto; } body.focus .side { display: none; } }
@media (max-width: 959px) {
  .side { position: fixed; z-index: 40; inset: 0 auto 0 0; width: min(86vw, 330px); overflow-y: auto; transform: translateX(-105%); transition: transform .25s ease; padding-top: calc(1.1rem + env(safe-area-inset-top, 0px)); padding-bottom: calc(1rem + env(safe-area-inset-bottom, 0px)); }
  .side.open { transform: none; box-shadow: 0 0 40px rgb(0 0 0 / .25); }
}
.scrim { position: fixed; inset: 0; z-index: 35; background: rgb(0 0 0 / .35); }
.main { display: flex; flex-direction: column; min-width: 0; min-height: 100vh; }
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: .65rem; padding: .6rem max(16px, env(safe-area-inset-right, 0px)) .6rem max(16px, env(safe-area-inset-left, 0px)); min-height: 52px; }
.icon-btn { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; width: 38px; height: 38px; display: inline-grid; place-items: center; font-size: 1.1rem; flex: none; }
body.focus .menu-btn { display: none; }
@media (min-width: 960px) { body.side-hidden .app { grid-template-columns: minmax(0, 1fr); } body.side-hidden .side { display: none; } }
.crumb { flex: 1; min-width: 0; font-size: .92rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.crumb b { font-weight: 600; }
.timer { font-size: .95rem; font-weight: 600; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: .2rem .55rem; }
.progress-top { position: absolute; left: 0; right: 0; bottom: -1px; height: 3px; background: transparent; }
.progress-top span { display: block; height: 100%; background: var(--accent); transition: width .3s; }
.view { flex: 1; width: 100%; max-width: 760px; margin: 0 auto; padding: 1.4rem max(16px, env(safe-area-inset-right, 0px)) calc(var(--composer-h) + 2rem) max(16px, env(safe-area-inset-left, 0px)); display: grid; gap: 1.1rem; align-content: start; }

/* ---------- Barra lateral ---------- */
.brand { font-family: var(--font-title); font-size: 1.45rem; font-weight: 700; letter-spacing: -.01em; }
.brand-sub { font-size: .82rem; color: var(--muted); }
.side nav { display: grid; gap: .9rem; }
.side-link { display: flex; justify-content: space-between; align-items: center; text-decoration: none; padding: .45rem .6rem; border-radius: 10px; font-weight: 600; }
.side-link[aria-current="page"], .topic-link[aria-current="page"] { background: var(--surface); box-shadow: inset 0 0 0 1px var(--line); }
.mod { display: grid; gap: .35rem; }
.mod-row { display: flex; justify-content: space-between; align-items: baseline; padding: 0 .6rem; font-weight: 700; }
.bar { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; margin: 0 .6rem; }
.bar span { display: block; height: 100%; background: var(--accent); border-radius: 0 3px 3px 0; }
.topic-list { list-style: none; margin: .2rem 0 0; padding: 0; display: grid; gap: 1px; }
.topic-link { display: grid; grid-template-columns: auto 1fr auto; gap: .55rem; align-items: center; text-decoration: none; font-size: .9rem; padding: .35rem .6rem; border-radius: 8px; }
.topic-link:hover { background: var(--surface); }
.topic-link .pct { font: 500 .78rem var(--font-mono); color: var(--muted); }
.ring { width: 14px; height: 14px; border-radius: 50%; background: conic-gradient(var(--accent) calc(var(--p) * 1%), var(--line) 0); flex: none; }
.side-foot { margin-top: auto; display: grid; gap: .55rem; font-size: .86rem; padding: 0 .6rem; }
.side-foot .row { display: flex; justify-content: space-between; gap: .5rem; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; padding: 2px; background: var(--surface); }
.seg button { border: 0; background: transparent; padding: .3rem .7rem; border-radius: 999px; font-size: .82rem; font-weight: 600; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.sync { font-size: .78rem; color: var(--muted); }

/* ---------- Tarjetas y botones ---------- */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 1.1rem 1.15rem; display: grid; gap: .75rem; min-width: 0; }
.card.quiet { background: transparent; }
.card.accent { border-color: var(--accent); }
.row-wrap { display: flex; flex-wrap: wrap; gap: .5rem; align-items: center; }
.btn { border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 12px; padding: .65rem 1rem; font-weight: 600; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; gap: .45rem; min-height: 44px; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.dark { background: var(--ink); border-color: var(--ink); color: var(--bg); }
.btn.block { width: 100%; }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.link-btn { border: 0; background: none; padding: .25rem; color: var(--muted); font-size: .88rem; text-decoration: underline; text-underline-offset: 3px; }
.chip { display: inline-flex; align-items: center; gap: .35rem; border: 1px solid var(--line); border-radius: 999px; padding: .15rem .6rem; font-size: .78rem; font-weight: 600; color: var(--muted); background: var(--surface); }
.chip.hot { color: var(--accent); border-color: var(--accent); }
.chip.ok { color: var(--good); border-color: var(--good); }
.grid2 { display: grid; gap: .75rem; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); }

/* Hoy */
.big-num { font: 600 clamp(2.4rem, 9vw, 3.4rem)/1 var(--font-mono); }
.mood { display: grid; grid-template-columns: repeat(3, 1fr); gap: .5rem; }
.mood button { border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: .8rem .4rem; font-weight: 600; display: grid; gap: .2rem; justify-items: center; min-height: 72px; }
.mood button span { font-size: 1.35rem; }
.modes { display: grid; grid-template-columns: repeat(3, 1fr); gap: .5rem; }
.modes button { border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: .65rem .5rem; text-align: left; display: grid; gap: .1rem; min-height: 64px; }
.modes button b { font-size: .95rem; }
.modes button small { color: var(--muted); font-size: .76rem; }
.modes button[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.stat-row { display: grid; grid-template-columns: 1fr auto; gap: .35rem .75rem; align-items: baseline; }
.stat-row .delta { font: 600 .95rem var(--font-mono); }
.states { display: flex; flex-wrap: wrap; gap: .4rem 1rem; font-size: .82rem; color: var(--muted); }
.states i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: .3rem; vertical-align: 0; }
.st-new { background: var(--line); } .st-learning { background: var(--muted); } .st-mastered { background: var(--good); } .st-due { background: var(--accent); }
.plan-topics { display: grid; gap: .4rem; }
.plan-topics a { display: flex; justify-content: space-between; gap: .5rem; text-decoration: none; border: 1px solid var(--line); border-radius: 10px; padding: .55rem .75rem; background: var(--bg); }
.only-mobile { display: grid; }
@media (min-width: 960px) { .only-mobile { display: none; } }

/* Tema: Sistema de Entender */
.steps { display: grid; gap: .9rem; }
.step { display: grid; grid-template-columns: 2rem minmax(0, 1fr); gap: .75rem; }
.step-n { width: 2rem; height: 2rem; border-radius: 50%; border: 1.5px solid var(--ink); display: grid; place-items: center; font: 600 .85rem var(--font-mono); }
.step-body { display: grid; gap: .7rem; min-width: 0; padding-bottom: .4rem; }
.map3 { display: grid; gap: .5rem; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); }
.map3 > div { border: 1px solid var(--line); border-radius: 12px; padding: .7rem .8rem; background: var(--surface); display: grid; gap: .25rem; align-content: start; }
.map3 > div.exam { border-color: var(--accent); background: var(--accent-soft); }
.map3 .kicker { color: var(--ink); display: block; }
body.focus .menu-btn { display: none; }
.map3 .exam .kicker { color: var(--accent); }
.sum { list-style: none; margin: 0; padding: 0; display: grid; gap: .55rem; }
.sum li { padding-left: .9rem; border-left: 2px solid var(--line); }
.plate { margin: 0; overflow-x: auto; background: var(--plate); border: 1px solid var(--line); border-radius: 14px; padding: .7rem; }
.fig-wrap { margin: 0; display: grid; gap: .35rem; min-width: 0; }
.fig-wrap figcaption { font-size: .84rem; color: var(--muted); }
.tbl { overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
.tbl table { width: 100%; border-collapse: collapse; font-size: .88rem; min-width: 540px; }
.tbl th, .tbl td { text-align: left; vertical-align: top; padding: .5rem .65rem; border-bottom: 1px solid var(--line); line-height: 1.4; }
.tbl thead th { background: var(--soft); font-size: .8rem; font-weight: 700; }
.tbl tbody th { font-weight: 600; }
.tbl tbody tr:last-child > * { border-bottom: 0; }
.plate svg { display: block; width: 100%; min-width: 560px; height: auto; }
.beats { list-style: none; margin: 0; padding: 0; display: grid; gap: .4rem; counter-reset: b; }
.beats li { counter-increment: b; display: grid; grid-template-columns: 1.6rem 1fr; gap: .5rem; padding: .5rem .6rem; border-radius: 10px; transition: background .2s; }
.beats li::before { content: counter(b); font: 600 .8rem var(--font-mono); color: var(--muted); padding-top: .15rem; }
.beats li.now { background: var(--accent-soft); }
.beats li.now::before { color: var(--accent); }
.audio-only { position: fixed; inset: 0; z-index: 50; background: var(--bg); display: grid; place-items: center; padding: 2rem max(16px, env(safe-area-inset-right, 0px)) 2rem max(16px, env(safe-area-inset-left, 0px)); text-align: center; }
.audio-only .now-line { font-family: var(--font-title); font-size: clamp(1.4rem, 5vw, 2rem); max-width: 30ch; line-height: 1.3; }
.life { font-size: 1.05rem; }

/* Sesión (modo enfoque) */
.qcard { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 1.3rem 1.2rem; display: grid; gap: .9rem; min-height: 12rem; align-content: start; }
.qcard .q { font-family: var(--font-title); font-size: clamp(1.25rem, 4.2vw, 1.6rem); line-height: 1.3; font-weight: 600; }
.qcard .q .en { font-family: var(--font-body); font-size: .62em; font-weight: 400; margin-top: .45rem; }
.answer { border-top: 1px dashed var(--line); padding-top: .85rem; display: grid; gap: .6rem; }
.answer .a { font-size: 1.08rem; font-weight: 600; }
.answer .a .en { font-weight: 400; }
.actions { position: sticky; bottom: calc(var(--composer-h) + .5rem); display: grid; gap: .5rem; padding-top: .5rem; background: linear-gradient(to bottom, transparent, var(--bg) 35%); }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: .6rem; }
.two .btn { min-height: 56px; font-size: 1.02rem; }
.err-chips { display: flex; flex-wrap: wrap; gap: .4rem; }
.err-chips button { border: 1px solid var(--line); background: var(--bg); border-radius: 999px; padding: .3rem .7rem; font-size: .82rem; }
.err-chips button[aria-pressed="true"] { border-color: var(--ink); background: var(--ink); color: var(--bg); }
.notice { border-radius: 12px; padding: .7rem .9rem; background: var(--accent-soft); font-size: .92rem; }
.done-num { font: 600 2.6rem/1 var(--font-mono); }

/* Simulacro */
.opts { display: grid; gap: .5rem; }
.opts button { text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: .75rem .9rem; display: grid; grid-template-columns: 1.6rem 1fr; gap: .4rem; min-height: 52px; }
.opts button span:first-child { font: 600 .9rem var(--font-mono); color: var(--muted); }
.opts button[aria-pressed="true"] { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }
.review-list { display: grid; gap: .6rem; }
.review-list .card { gap: .4rem; }

/* Tutor + entrada única */
.tutor { position: sticky; bottom: var(--composer-h); z-index: 9; margin: 0 auto; width: 100%; max-width: 760px; padding: 0 max(16px, env(safe-area-inset-right, 0px)) 0 max(16px, env(safe-area-inset-left, 0px)); }
.tutor-box { background: var(--surface); border: 1px solid var(--line); border-radius: 16px 16px 0 0; box-shadow: 0 -8px 30px rgb(0 0 0 / .08); max-height: min(58vh, 520px); display: grid; grid-template-rows: auto 1fr auto; }
.tutor-head { display: flex; align-items: center; justify-content: space-between; gap: .5rem; padding: .65rem .9rem; border-bottom: 1px solid var(--line); }
.tutor-head .kicker { color: var(--accent); }
.msgs { overflow-y: auto; padding: .8rem .9rem; display: grid; gap: .65rem; align-content: start; }
.msg { max-width: 92%; white-space: pre-wrap; overflow-wrap: anywhere; line-height: 1.5; font-size: .96rem; }
.msg.me { justify-self: end; background: var(--soft); border-radius: 14px 14px 4px 14px; padding: .55rem .8rem; }
.msg.tu { justify-self: start; }
.msg .meta { display: flex; gap: .4rem; align-items: center; margin-top: .35rem; }
.tutor-foot { display: flex; gap: .4rem; flex-wrap: wrap; padding: .55rem .9rem; border-top: 1px solid var(--line); }
.composer { position: sticky; bottom: 0; z-index: 10; background: var(--bg); border-top: 1px solid var(--line); padding: .6rem max(16px, env(safe-area-inset-right, 0px)) calc(.6rem + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.composer-inner { max-width: 760px; margin: 0 auto; display: grid; gap: .35rem; }
.ctx { display: flex; align-items: center; gap: .4rem; font-size: .78rem; color: var(--muted); }
.ctx b { color: var(--ink); font-weight: 600; }
.inbox { display: flex; align-items: flex-end; gap: .4rem; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: .4rem .4rem .4rem .8rem; }
.inbox textarea { flex: 1; border: 0; outline: none; background: transparent; resize: none; min-height: 26px; max-height: 140px; padding: .35rem 0; line-height: 1.4; }
.inbox .icon-btn { border: 0; width: 38px; height: 38px; background: transparent; }
.inbox .icon-btn.on { background: var(--accent-soft); color: var(--accent); }
.send { background: var(--ink); color: var(--bg); border: 0; border-radius: 12px; height: 38px; padding: 0 .9rem; font-weight: 600; }
.partial { font-size: .82rem; color: var(--muted); font-style: italic; }
.attach { display: inline-flex; align-items: center; gap: .3rem; font-size: .78rem; border: 1px solid var(--line); border-radius: 8px; padding: .1rem .45rem; }

/* Gemini: solo el destello cuando la IA piensa y los chips de sugerencia */
.glimmer { background: linear-gradient(90deg, var(--g1), var(--g2), var(--g3), var(--g1)); background-size: 300% 100%; -webkit-background-clip: text; background-clip: text; color: transparent; animation: glim 2.4s linear infinite; font-weight: 600; }
@keyframes glim { to { background-position: -300% 0; } }
.sugg { display: flex; gap: .4rem; overflow-x: auto; scrollbar-width: none; padding: 1px; }
.sugg::-webkit-scrollbar { display: none; }
.sugg button { flex: none; border: 1.5px solid transparent; border-radius: 999px; padding: .3rem .8rem; font-size: .82rem; font-weight: 600; color: var(--ink); background: linear-gradient(var(--surface), var(--surface)) padding-box, linear-gradient(90deg, var(--g1), var(--g2), var(--g3)) border-box; min-height: 34px; }
.sugg button:hover { background: linear-gradient(var(--soft), var(--soft)) padding-box, linear-gradient(90deg, var(--g1), var(--g2), var(--g3)) border-box; }
.top-actions { display: flex; gap: .4rem; align-items: center; flex: none; }

/* Tema: pantalla dividida (pasos a la izquierda, imagen tocable a la derecha) */
.view.wide { max-width: 1260px; }
.topic-grid { display: grid; gap: 1.1rem; grid-template-columns: minmax(0, 1fr); }
.topic-grid > * { min-width: 0; }
.tg-head { display: grid; gap: .8rem; }
@media (min-width: 1280px) {
  .topic-grid { grid-template-columns: minmax(0, 1fr) minmax(480px, 54%); grid-template-areas: "head panel" "steps panel"; grid-template-rows: auto 1fr; gap: 1.1rem 1.6rem; align-items: start; }
  .tg-head { grid-area: head; } .topic-grid > .steps { grid-area: steps; }
  .imgpanel { grid-area: panel; position: sticky; top: 68px; max-height: calc(100vh - 68px - var(--composer-h) - 12px); overflow-y: auto; }
}
.how { border: 1px solid var(--line); border-radius: 14px; background: var(--surface); }
.how summary { cursor: pointer; padding: .7rem .9rem; font-weight: 600; list-style: none; display: flex; gap: .5rem; align-items: baseline; }
.how summary::-webkit-details-marker { display: none; }
.how summary .kicker { flex: none; }
.how[open] summary { border-bottom: 1px solid var(--line); }
.how .how-body { padding: .7rem .9rem .9rem; display: grid; gap: .55rem; }
.how ol { margin: 0; padding-left: 1.2rem; display: grid; gap: .2rem; }

/* Imagen tocable */
.imgpanel { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: .85rem; display: grid; gap: .65rem; align-content: start; scroll-margin-top: 64px; }

<template id="svg-lytic-lysogenic"><svg role="img" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" font-family="Inter, sans-serif">

  <text x="10" y="24" font-weight="800" font-size="16" fill="#b91c1c">Ciclo lítico · <tspan fill="#1d4ed8">Lytic cycle</tspan> <tspan font-size="12.5" fill="#4b5563" font-weight="600">— rápido, destruye la célula · fast, destroys the cell</tspan></text>

  </g>
  <text x="10" y="182" font-weight="800" font-size="16" fill="#6d28d9">Ciclo lisogénico · <tspan fill="#1d4ed8">Lysogenic cycle</tspan> <tspan font-size="12.5" fill="#4b5563" font-weight="600">— se esconde, no mata aún · hides, doesn't kill yet</tspan></text>
  <g fill="#f5f3ff" stroke="#7c3aed" stroke-width="2">

    <path d="M151 238 L168 238"/><path d="M311 238 L328 238"/><path d="M471 238 L488 238"/><path d="M631 238 L648 238"/>
    <path d="M700 195 L440 124" stroke="#ea580c" stroke-dasharray="6 4"/>
  </g>
  <g font-size="12.5" text-anchor="middle">
    <text x="80" y="62" font-weight="700">1. Se adhiere</text><text x="80" y="96" fill="#1d4ed8">Attaches</text>
    <text x="240" y="62" font-weight="700">2. Inyecta su ADN</text><text x="240" y="96" fill="#1d4ed8">Injects its DNA</text>
    <text x="400" y="58" font-weight="700">3. La célula hace</text><text x="400" y="74" font-weight="700">copias del virus</text><text x="400" y="96" fill="#1d4ed8">Cell makes</text><text x="400" y="111" fill="#1d4ed8">virus copies</text>
    <text x="560" y="62" font-weight="700">4. Se arman</text><text x="560" y="78" font-weight="700">virus nuevos</text><text x="560" y="100" fill="#1d4ed8">New viruses assembled</text>
    <text x="720" y="58" font-weight="700">5. La célula</text><text x="720" y="74" font-weight="700">revienta (lisis)</text><text x="720" y="96" fill="#1d4ed8">Cell bursts</text><text x="720" y="111" fill="#1d4ed8">(lysis)</text>
    <text x="80" y="220" font-weight="700">1. Se adhiere</text><text x="80" y="254" fill="#1d4ed8">Attaches</text>
    <text x="240" y="220" font-weight="700">2. Inyecta su ADN</text><text x="240" y="254" fill="#1d4ed8">Injects its DNA</text>
    <text x="400" y="216" font-weight="700">3. ADN viral se une</text><text x="400" y="232" font-weight="700">al ADN de la célula</text><text x="400" y="254" fill="#1d4ed8">Viral DNA joins</text><text x="400" y="269" fill="#1d4ed8">the host DNA</text>
    <text x="560" y="216" font-weight="700">4. La célula se divide</text><text x="560" y="232" font-weight="700">y copia el ADN viral</text><text x="560" y="254" fill="#1d4ed8">Cell divides and</text><text x="560" y="269" fill="#1d4ed8">copies viral DNA</text>
    <text x="720" y="216" font-weight="700">5. Detonante</text><text x="720" y="232" font-weight="700">(estrés) → lítico</text><text x="720" y="254" fill="#1d4ed8">Trigger (stress)</text><text x="720" y="269" fill="#1d4ed8">→ lytic cycle</text>
  </g>

const MCQ = [{"mod": "geo", "q": "During an earthquake, a station on the \u003cb>opposite side of Earth\u003c/b> detects \u003cb>P-waves\u003c/b> but \u003cb>no S-waves\u003c/b>. What does this tell scientists?", "help": "Una estación al otro lado de la Tierra recibe ondas P pero no ondas S. ¿Qué indica?", "opts": ["The inner core is made of gas.", "Part of Earth's core is \u003cb>liquid\u003c/b>, because S-waves cannot travel through liquids.", "The crust is thicker on the opposite side of Earth."], "ans": 1, "why": ["Las ondas S no pasan por líquidos → núcleo externo líquido.", "S-waves can&#x27;t cross liquids → liquid outer core."]}, {"mod": "geo", "q": "The \u003cb>deepest hole\u003c/b> ever drilled reached only about \u003cb>12 km\u003c/b>. Why does most knowledge about Earth's interior come from \u003cb>indirect evidence\u003c/b>?", "help": "El pozo más profundo llegó a 12 km. ¿Por qué casi todo lo que sabemos viene de evidencia indirecta?", "opts": ["The mantle is made of ice that melts the drills.", "The inner layers are too deep and hot to sample, so scientists study seismic waves, meteorites and xenoliths.", "Seismic waves can only be measured from space."], "ans": 1, "why": ["Las capas son muy profundas y calientes; se estudian con ondas, meteoritos y xenolitos.", "Layers are too deep and hot; studied with waves, meteorites, xenoliths."]}, {"mod": "geo", "q": "Earth's \u003cb>average density\u003c/b> (5.5 g/cm³) is much \u003cb>higher\u003c/b> than the density of crust rocks (about 2.7 g/cm³). What does this suggest?", "help": "La Tierra en promedio es mucho más densa que las rocas de la corteza. ¿Qué sugiere?", "opts": ["The core is made of very \u003cb>dense metal\u003c/b>.", "The mantle is hollow.", "The crust is the heaviest layer."], "ans": 0, "why": ["Si la Tierra es más densa que su corteza, el centro es metal denso (hierro y níquel).", "If Earth is denser than its crust, the center is dense metal."]}, {"mod": "geo", "q": "Which layer is the \u003cb>largest by volume\u003c/b> and has slowly \u003cb>flowing\u003c/b> rock that moves tectonic plates?", "help": "¿Qué capa es la más grande y tiene roca que fluye y mueve las placas?", "opts": ["Crust", "Mantle", "Inner core"], "ans": 1, "why": ["El manto es la capa más grande y sus corrientes mueven las placas.", "The mantle is the largest; its currents move plates."]}, {"mod": "geo", "q": "In Costa Rica, the \u003cb>oceanic Cocos plate sinks beneath\u003c/b> the Caribbean plate. Which \u003cb>two features\u003c/b> form because of this \u003cb>subduction\u003c/b>?", "help": "La placa Cocos se hunde bajo la placa Caribe. ¿Qué dos relieves se forman?", "opts": ["A deep-ocean trench and volcanoes.", "A delta and a canyon.", "A mid-ocean ridge and a rift valley."], "ans": 0, "why": ["Subducción → fosa (Mesoamericana) y volcanes (Arenal, Poás).", "Subduction → trench and volcanoes."]}, {"mod": "geo", "q": "Which is an example of an \u003cb>exogenic\u003c/b> process?", "help": "¿Cuál es un proceso exógeno (externo)?", "opts": ["Magma rising inside a volcano.", "Wind carrying sand and dropping it to form a dune.", "Two plates colliding to form mountains."], "ans": 1, "why": ["El viento es un agente externo → exógeno.", "Wind is an external agent → exogenic."]}, {"mod": "geo", "q": "Two \u003cb>continental\u003c/b> plates \u003cb>pull apart\u003c/b>. The crust \u003cb>stretches\u003c/b> and the center \u003cb>sinks\u003c/b>. Which landform is created?", "help": "Dos placas continentales se separan y el centro se hunde. ¿Qué relieve se forma?", "opts": ["A rift valley.", "A folded mountain range.", "A delta."], "ans": 0, "why": ["Divergente en un continente → valle de rift.", "Divergent on a continent → rift valley."]}, {"mod": "geo", "q": "Along the San Andreas Fault, two plates \u003cb>slide past each other\u003c/b> horizontally. What is \u003cb>most common\u003c/b> there?", "help": "Dos placas se deslizan de lado. ¿Qué es lo más común ahí?", "opts": ["Earthquakes.", "New oceanic crust.", "A deep-ocean trench."], "ans": 0, "why": ["Límite transformante → fallas y terremotos.", "Transform boundary → faults and earthquakes."]}, {"mod": "geo", "q": "The walls of a \u003cb>canyon\u003c/b> show many colored \u003cb>layers\u003c/b> of sandstone, shale and limestone. What type of rock are these layers?", "help": "Las paredes de un cañón muestran capas de arenisca, lutita y caliza. ¿Qué tipo de roca son?", "opts": ["Extrusive igneous rock.", "Sedimentary rock.", "Metamorphic rock."], "ans": 1, "why": ["Arenisca, lutita y caliza en capas = sedimentarias.", "Sandstone, shale, limestone in layers = sedimentary."]}, {"mod": "geo", "q": "A geologist rubs a \u003cb>gold-colored\u003c/b> mineral on an unglazed porcelain plate and gets a \u003cb>greenish-black powder\u003c/b>, so the geologist knows it is pyrite, not gold. Which property helped?", "help": "Un mineral dorado deja un polvo negro verdoso en la placa. ¿Qué propiedad usó?", "opts": ["Streak", "Hardness", "Magnetism"], "ans": 0, "why": ["Color del polvo = raya.", "Powder color = streak."]}, {"mod": "geo", "q": "Which of these is \u003cb>NOT\u003c/b> a mineral?", "help": "¿Cuál NO es un mineral?", "opts": ["Quartz", "Halite (rock salt)", "Coal (formed from ancient plants)"], "ans": 2, "why": ["El carbón viene de plantas → orgánico → no es mineral.", "Coal comes from plants → organic → not a mineral."]}, {"mod": "geo", "q": "Which property measures how easily a mineral can be \u003cb>scratched\u003c/b>, using the \u003cb>Mohs scale\u003c/b> from 1 to 10?", "help": "¿Qué propiedad mide qué tan fácil se raya un mineral (escala de Mohs)?", "opts": ["Luster", "Hardness", "Cleavage"], "ans": 1, "why": ["Rayar / escala de Mohs = dureza.", "Scratching / Mohs scale = hardness."]}, {"mod": "geo", "q": "\u003cb>Obsidian\u003c/b> is a black, glassy rock with \u003cb>no visible crystals\u003c/b>. How did it form?", "help": "La obsidiana es negra, como vidrio, sin cristales. ¿Cómo se formó?", "opts": ["Lava cooled very quickly on Earth's surface.", "Magma cooled slowly deep underground.", "Sediments were compacted and cemented."], "ans": 0, "why": ["Sin cristales = enfriamiento muy rápido → ígnea extrusiva.", "No crystals = very fast cooling → extrusive igneous."]}, {"mod": "geo", "q": "\u003cb>Shale\u003c/b> is buried deep and changed by \u003cb>heat and pressure\u003c/b> into \u003cb>slate\u003c/b>, without melting. What type of rock is slate?", "help": "La lutita se convierte en pizarra por calor y presión. ¿Qué tipo de roca es la pizarra?", "opts": ["Sedimentary", "Metamorphic", "Igneous"], "ans": 1, "why": ["Calor + presión sin derretirse = metamórfica.", "Heat + pressure without melting = metamorphic."]}, {"mod": "geo", "q": "\u003cb>Mica\u003c/b> peels apart into thin, flat, smooth \u003cb>sheets\u003c/b>. Which property is this?", "help": "La mica se separa en láminas planas y lisas. ¿Qué propiedad es?", "opts": ["Cleavage", "Fracture", "Streak"], "ans": 0, "why": ["Se rompe en láminas planas = exfoliación.", "Breaks in flat sheets = cleavage."]}, {"mod": "geo", "q": "Ocean waves hit a cliff and \u003cb>break\u003c/b> the rock; then the water \u003cb>carries\u003c/b> the pieces away. The breaking is ______ and the carrying away is ______.", "help": "Las olas rompen la roca y luego se llevan los pedazos. Romper = ___ ; llevar = ___.", "opts": ["erosion; weathering", "weathering; erosion", "deposition; weathering"], "ans": 1, "why": ["Romper = meteorización; transportar = erosión.", "Breaking = weathering; carrying = erosion."]}, {"mod": "geo", "q": "\u003cb>Red rusty stains\u003c/b> appear on rocks that contain \u003cb>iron\u003c/b> after years of rain. This is:", "help": "Manchas rojas de óxido en rocas con hierro. Esto es:", "opts": ["Chemical weathering (oxidation).", "Mechanical weathering.", "Deposition."], "ans": 0, "why": ["Hierro + oxígeno = óxido → química.", "Iron + oxygen = rust → chemical."]}, {"mod": "geo", "q": "\u003cb>Lichens\u003c/b> growing on a rock produce weak \u003cb>acids\u003c/b> that slowly break the rock down. What type of weathering is caused by \u003cb>living things\u003c/b>?", "help": "Los líquenes (seres vivos) rompen la roca. ¿Qué tipo de meteorización es?", "opts": ["Biological weathering.", "Compaction.", "Deposition."], "ans": 0, "why": ["Seres vivos (líquenes) → biológica.", "Living things (lichens) → biological."]}, {"mod": "geo", "q": "Which soil horizon is the \u003cb>most fertile\u003c/b>, dark, and full of \u003cb>humus and plant roots\u003c/b>?", "help": "¿Qué horizonte es el más fértil, oscuro, con humus y raíces?", "opts": ["A horizon (topsoil)", "C horizon (parent material)", "R horizon (bedrock)"], "ans": 0, "why": ["Horizonte A = suelo superficial fértil.", "A horizon = fertile topsoil."]}, {"mod": "geo", "q": "A farmer grows crops on a \u003cb>steep hill\u003c/b>. Every time it rains, water \u003cb>washes the soil away\u003c/b>. Which conservation practice is best?", "help": "Un agricultor siembra en una colina empinada y la lluvia se lleva el suelo. ¿Qué práctica es mejor?", "opts": ["Terracing or contour plowing.", "Removing all plants from the field.", "Plowing straight down the hill."], "ans": 0, "why": ["Terrazas o arado en curvas frenan el agua.", "Terracing or contour plowing slow the water."]}, {"mod": "cell", "q": "Which scientist was the \u003cb>first to see living\u003c/b> microorganisms (\"animalcules\") with simple microscopes he built himself?", "help": "¿Quién vio primero microorganismos vivos?", "opts": ["Robert Hooke", "Anton van Leeuwenhoek", "Rudolf Virchow"], "ans": 1, "why": ["Leeuwenhoek vio los primeros microorganismos vivos.", "Leeuwenhoek saw the first living microorganisms."]}, {"mod": "cell", "q": "Which scientist is known for the idea that \u003cb>all cells come from pre-existing cells\u003c/b>?", "help": "¿Quién dijo que toda célula viene de otra célula?", "opts": ["Rudolf Virchow", "Matthias Schleiden", "Robert Hooke"], "ans": 0, "why": ["Virchow: toda célula viene de otra célula.", "Virchow: all cells come from cells."]}, {"mod": "cell", "q": "Which statement is a \u003cb>postulate\u003c/b> of the cell theory?", "help": "¿Cuál es un postulado de la teoría celular?", "opts": ["All cells have a nucleus.", "All living things are made of one or more cells.", "All cells are the same size."], "ans": 1, "why": ["Es el postulado 1. Las bacterias no tienen núcleo, así que &quot;a&quot; es falsa.", "It&#x27;s postulate 1. Bacteria have no nucleus, so &quot;a&quot; is false."]}, {"mod": "cell", "q": "The \u003cb>heart\u003c/b> is made of muscle tissue, nerve tissue and connective tissue working together. The heart is an example of:", "help": "El corazón tiene varios tejidos trabajando juntos. Es un…", "opts": ["a cell.", "an organ.", "an organism."], "ans": 1, "why": ["Varios tejidos juntos = órgano.", "Several tissues together = organ."]}, {"mod": "cell", "q": "The stomach, intestines and liver \u003cb>work together\u003c/b> to digest food. Together they form:", "help": "Estómago, intestinos e hígado trabajan juntos. Forman…", "opts": ["a tissue.", "an organ system.", "a cell."], "ans": 1, "why": ["Varios órganos juntos = sistema de órganos.", "Several organs together = organ system."]}, {"mod": "cell", "q": "A cell has a \u003cb>cell wall\u003c/b>, \u003cb>chloroplasts\u003c/b> and a \u003cb>large central vacuole\u003c/b>. What type of cell is it?", "help": "Tiene pared, cloroplastos y vacuola central grande.", "opts": ["Animal cell", "Plant cell", "Virus"], "ans": 1, "why": ["Pared + cloroplastos + vacuola central = vegetal.", "Wall + chloroplasts + central vacuole = plant."]}, {"mod": "cell", "q": "Which structure is found in \u003cb>BOTH\u003c/b> prokaryotic and eukaryotic cells?", "help": "¿Qué estructura tienen las procariotas y las eucariotas?", "opts": ["Nucleus", "Ribosomes", "Mitochondria"], "ans": 1, "why": ["Los ribosomas están en todas las células.", "Ribosomes are in all cells."]}, {"mod": "cell", "q": "\u003cb>Muscle cells\u003c/b> need a lot of \u003cb>energy\u003c/b>. Which organelle would you find in very large numbers in them?", "help": "Las células musculares necesitan mucha energía. ¿Qué organelo tienen en gran cantidad?", "opts": ["Mitochondria", "Vacuoles", "Chloroplasts"], "ans": 0, "why": ["Mitocondria = energía (ATP).", "Mitochondria = energy (ATP)."]}, {"mod": "cell", "q": "A cell has \u003cb>circular DNA\u003c/b> in its cytoplasm, ribosomes and a cell wall, but \u003cb>no nucleus\u003c/b>. What is it?", "help": "ADN circular, ribosomas, pared, pero sin núcleo.", "opts": ["A eukaryotic animal cell", "A prokaryotic bacterium", "A eukaryotic plant cell"], "ans": 1, "why": ["Sin núcleo + ADN circular = bacteria procariota.", "No nucleus + circular DNA = prokaryotic bacterium."]}, {"mod": "cell", "q": "Which organelle works like a \u003cb>post office\u003c/b>, \u003cb>packaging and shipping proteins\u003c/b>?", "help": "¿Qué organelo empaca y envía proteínas?", "opts": ["Golgi apparatus", "Lysosome", "Vacuole"], "ans": 0, "why": ["Golgi empaca y envía proteínas.", "Golgi packages and ships proteins."]}, {"mod": "cell", "q": "A virus injects its DNA into a bacterium. The viral DNA \u003cb>joins the bacterium's DNA\u003c/b> and stays \u003cb>hidden\u003c/b> for many generations. Which cycle is this?", "help": "El ADN viral se une al de la bacteria y se queda escondido.", "opts": ["Lytic cycle", "Lysogenic cycle", "Binary fission"], "ans": 1, "why": ["ADN escondido en el de la célula = lisogénico.", "DNA hidden in the host DNA = lysogenic."]}, {"mod": "cell", "q": "A \u003cb>starfish\u003c/b> loses an arm, and the \u003cb>arm grows into a whole new starfish\u003c/b>. This asexual reproduction is called:", "help": "Un brazo de estrella de mar se convierte en una estrella nueva.", "opts": ["Fragmentation", "Budding", "Binary fission"], "ans": 0, "why": ["Un pedazo crece hasta ser un organismo nuevo = fragmentación.", "A piece grows into a new organism =
