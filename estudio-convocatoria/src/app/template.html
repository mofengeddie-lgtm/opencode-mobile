<title>Entender Ciencias</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap">
<style>
/* Layout (estilo Claude + Codex): materias a la izquierda, una sola acción al centro, entrada única abajo.
   Paleta estricta de 3 colores: crema / carbón suave, tinta y un acento ámbar. Serifa en títulos, mono en números. */
:root {
  --bg: #FAF8F5; --surface: #FFFFFF; --soft: #F2EEE7; --line: #E6E0D6;
  --ink: #1E1D1A; --muted: #6A665E;
  --accent: #A65A16; --accent-ink: #FFFFFF; --accent-soft: #F5E6D5;
  --good: #2E6A4F; --good-soft: #E3EFE8;
  --plate: #FFFDF9;
  --font-title: "Source Serif 4", Georgia, "Times New Roman", serif;
  --font-body: Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  --composer-h: 92px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #161618; --surface: #1E1E21; --soft: #242428; --line: #303035;
    --ink: #ECE7DF; --muted: #A39E95;
    --accent: #E3A25B; --accent-ink: #161618; --accent-soft: #3A2A1B;
    --good: #7CC4A0; --good-soft: #1C2A23; --plate: #F4F0E8; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #161618; --surface: #1E1E21; --soft: #242428; --line: #303035;
  --ink: #ECE7DF; --muted: #A39E95;
  --accent: #E3A25B; --accent-ink: #161618; --accent-soft: #3A2A1B;
  --good: #7CC4A0; --good-soft: #1C2A23; --plate: #F4F0E8; color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { min-height: 100%; }
body { background: var(--bg); color: var(--ink); font: 16px/1.55 var(--font-body); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 8px; }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.kicker { font: 600 .74rem var(--font-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.title { font-family: var(--font-title); font-weight: 700; font-size: clamp(1.75rem, 5vw, 2.35rem); line-height: 1.12; margin: .2rem 0 0; text-wrap: balance; letter-spacing: -.01em; }
.title-en { color: var(--muted); font-size: 1.05rem; margin: .25rem 0 0; }
h2.h { font-family: var(--font-title); font-size: 1.3rem; font-weight: 700; margin: 0; line-height: 1.2; }
p { margin: 0; }
.muted { color: var(--muted); }
.small { font-size: .86rem; }
[hidden] { display: none !important; }

/* Bilingüe */
.en { display: block; color: var(--muted); font-size: .94em; }
.bi-inline .en { display: inline; }
body[data-lang="es"] .en { display: none !important; }
body[data-lang="en"] .es { display: none !important; }
body[data-lang="en"] .en { color: inherit; font-size: 1em; }

/* ---------- Estructura ---------- */
.app { display: grid; grid-template-columns: 1fr; min-height: 100vh; }
@media (min-width: 960px) { .app { grid-template-columns: 284px minmax(0, 1fr); } body.focus .app { grid-template-columns: minmax(0, 1fr); } }
.side { background: var(--soft); border-right: 1px solid var(--line); display: flex; flex-direction: column; gap: 1rem; padding: 1.1rem 1rem 1rem max(16px, env(safe-area-inset-left, 0px)); min-width: 0; }
@media (min-width: 960px) { .side { position: sticky; top: 0; height: 100vh; overflow-y: auto; } body.focus .side { display: none; } }
@media (max-width: 959px) {
  .side { position: fixed; z-index: 40; inset: 0 auto 0 0; width: min(86vw, 330px); overflow-y: auto; transform: translateX(-105%); transition: transform .25s ease; padding-top: calc(1.1rem + env(safe-area-inset-top, 0px)); padding-bottom: calc(1rem + env(safe-area-inset-bottom, 0px)); }
  .side.open { transform: none; box-shadow: 0 0 40px rgb(0 0 0 / .25); }
}
.scrim { position: fixed; inset: 0; z-index: 35; background: rgb(0 0 0 / .35); }
.main { display: flex; flex-direction: column; min-width: 0; min-height: 100vh; }
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: .65rem; padding: .6rem max(16px, env(safe-area-inset-right, 0px)) .6rem max(16px, env(safe-area-inset-left, 0px)); min-height: 52px; }
.icon-btn { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; width: 38px; height: 38px; display: inline-grid; place-items: center; font-size: 1.1rem; flex: none; }
@media (min-width: 960px) { .menu-btn { display: none; } body.focus .menu-btn { display: none; } }
.crumb { flex: 1; min-width: 0; font-size: .92rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.crumb b { font-weight: 600; }
.timer { font-size: .95rem; font-weight: 600; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: .2rem .55rem; }
.progress-top { position: absolute; left: 0; right: 0; bottom: -1px; height: 3px; background: transparent; }
.progress-top span { display: block; height: 100%; background: var(--accent); transition: width .3s; }
.view { flex: 1; width: 100%; max-width: 760px; margin: 0 auto; padding: 1.4rem max(16px, env(safe-area-inset-right, 0px)) calc(var(--composer-h) + 2rem) max(16px, env(safe-area-inset-left, 0px)); display: grid; gap: 1.1rem; align-content: start; }

/* ---------- Barra lateral ---------- */
.brand { font-family: var(--font-title); font-size: 1.45rem; font-weight: 700; letter-spacing: -.01em; }
.brand-sub { font-size: .82rem; color: var(--muted); }
.side nav { display: grid; gap: .9rem; }
.side-link { display: flex; justify-content: space-between; align-items: center; text-decoration: none; padding: .45rem .6rem; border-radius: 10px; font-weight: 600; }
.side-link[aria-current="page"], .topic-link[aria-current="page"] { background: var(--surface); box-shadow: inset 0 0 0 1px var(--line); }
.mod { display: grid; gap: .35rem; }
.mod-row { display: flex; justify-content: space-between; align-items: baseline; padding: 0 .6rem; font-weight: 700; }
.bar { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; margin: 0 .6rem; }
.bar span { display: block; height: 100%; background: var(--accent); border-radius: 0 3px 3px 0; }
.topic-list { list-style: none; margin: .2rem 0 0; padding: 0; display: grid; gap: 1px; }
.topic-link { display: grid; grid-template-columns: auto 1fr auto; gap: .55rem; align-items: center; text-decoration: none; font-size: .9rem; padding: .35rem .6rem; border-radius: 8px; }
.topic-link:hover { background: var(--surface); }
.topic-link .pct { font: 500 .78rem var(--font-mono); color: var(--muted); }
.ring { width: 14px; height: 14px; border-radius: 50%; background: conic-gradient(var(--accent) calc(var(--p) * 1%), var(--line) 0); flex: none; }
.side-foot { margin-top: auto; display: grid; gap: .55rem; font-size: .86rem; padding: 0 .6rem; }
.side-foot .row { display: flex; justify-content: space-between; gap: .5rem; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; padding: 2px; background: var(--surface); }
.seg button { border: 0; background: transparent; padding: .3rem .7rem; border-radius: 999px; font-size: .82rem; font-weight: 600; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.sync { font-size: .78rem; color: var(--muted); }

/* ---------- Tarjetas y botones ---------- */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 1.1rem 1.15rem; display: grid; gap: .75rem; min-width: 0; }
.card.quiet { background: transparent; }
.card.accent { border-color: var(--accent); }
.row-wrap { display: flex; flex-wrap: wrap; gap: .5rem; align-items: center; }
.btn { border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 12px; padding: .65rem 1rem; font-weight: 600; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; gap: .45rem; min-height: 44px; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.dark { background: var(--ink); border-color: var(--ink); color: var(--bg); }
.btn.block { width: 100%; }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.link-btn { border: 0; background: none; padding: .25rem; color: var(--muted); font-size: .88rem; text-decoration: underline; text-underline-offset: 3px; }
.chip { display: inline-flex; align-items: center; gap: .35rem; border: 1px solid var(--line); border-radius: 999px; padding: .15rem .6rem; font-size: .78rem; font-weight: 600; color: var(--muted); background: var(--surface); }
.chip.hot { color: var(--accent); border-color: var(--accent); }
.chip.ok { color: var(--good); border-color: var(--good); }
.grid2 { display: grid; gap: .75rem; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); }

/* Hoy */
.big-num { font: 600 clamp(2.4rem, 9vw, 3.4rem)/1 var(--font-mono); }
.mood { display: grid; grid-template-columns: repeat(3, 1fr); gap: .5rem; }
.mood button { border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: .8rem .4rem; font-weight: 600; display: grid; gap: .2rem; justify-items: center; min-height: 72px; }
.mood button span { font-size: 1.35rem; }
.modes { display: grid; grid-template-columns: repeat(3, 1fr); gap: .5rem; }
.modes button { border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: .65rem .5rem; text-align: left; display: grid; gap: .1rem; min-height: 64px; }
.modes button b { font-size: .95rem; }
.modes button small { color: var(--muted); font-size: .76rem; }
.modes button[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.stat-row { display: grid; grid-template-columns: 1fr auto; gap: .35rem .75rem; align-items: baseline; }
.stat-row .delta { font: 600 .95rem var(--font-mono); }
.states { display: flex; flex-wrap: wrap; gap: .4rem 1rem; font-size: .82rem; color: var(--muted); }
.states i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: .3rem; vertical-align: 0; }
.st-new { background: var(--line); } .st-learning { background: var(--muted); } .st-mastered { background: var(--good); } .st-due { background: var(--accent); }
.plan-topics { display: grid; gap: .4rem; }
.plan-topics a { display: flex; justify-content: space-between; gap: .5rem; text-decoration: none; border: 1px solid var(--line); border-radius: 10px; padding: .55rem .75rem; background: var(--bg); }
.only-mobile { display: grid; }
@media (min-width: 960px) { .only-mobile { display: none; } }

/* Tema: Sistema de Entender */
.steps { display: grid; gap: .9rem; }
.step { display: grid; grid-template-columns: 2rem minmax(0, 1fr); gap: .75rem; }
.step-n { width: 2rem; height: 2rem; border-radius: 50%; border: 1.5px solid var(--ink); display: grid; place-items: center; font: 600 .85rem var(--font-mono); }
.step-body { display: grid; gap: .7rem; min-width: 0; padding-bottom: .4rem; }
.map3 { display: grid; gap: .5rem; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); }
.map3 > div { border: 1px solid var(--line); border-radius: 12px; padding: .7rem .8rem; background: var(--surface); display: grid; gap: .25rem; align-content: start; }
.map3 > div.exam { border-color: var(--accent); background: var(--accent-soft); }
.map3 .kicker { color: var(--ink); display: block; }
body.focus .menu-btn { display: none; }
.map3 .exam .kicker { color: var(--accent); }
.sum { list-style: none; margin: 0; padding: 0; display: grid; gap: .55rem; }
.sum li { padding-left: .9rem; border-left: 2px solid var(--line); }
.plate { margin: 0; overflow-x: auto; background: var(--plate); border: 1px solid var(--line); border-radius: 14px; padding: .7rem; }
.fig-wrap { margin: 0; display: grid; gap: .35rem; min-width: 0; }
.fig-wrap figcaption { font-size: .84rem; color: var(--muted); }
.tbl { overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
.tbl table { width: 100%; border-collapse: collapse; font-size: .88rem; min-width: 540px; }
.tbl th, .tbl td { text-align: left; vertical-align: top; padding: .5rem .65rem; border-bottom: 1px solid var(--line); line-height: 1.4; }
.tbl thead th { background: var(--soft); font-size: .8rem; font-weight: 700; }
.tbl tbody th { font-weight: 600; }
.tbl tbody tr:last-child > * { border-bottom: 0; }
.plate svg { display: block; width: 100%; min-width: 560px; height: auto; }
.beats { list-style: none; margin: 0; padding: 0; display: grid; gap: .4rem; counter-reset: b; }
.beats li { counter-increment: b; display: grid; grid-template-columns: 1.6rem 1fr; gap: .5rem; padding: .5rem .6rem; border-radius: 10px; transition: background .2s; }
.beats li::before { content: counter(b); font: 600 .8rem var(--font-mono); color: var(--muted); padding-top: .15rem; }
.beats li.now { background: var(--accent-soft); }
.beats li.now::before { color: var(--accent); }
.audio-only { position: fixed; inset: 0; z-index: 50; background: var(--bg); display: grid; place-items: center; padding: 2rem max(16px, env(safe-area-inset-right, 0px)) 2rem max(16px, env(safe-area-inset-left, 0px)); text-align: center; }
.audio-only .now-line { font-family: var(--font-title); font-size: clamp(1.4rem, 5vw, 2rem); max-width: 30ch; line-height: 1.3; }
.life { font-size: 1.05rem; }

/* Sesión (modo enfoque) */
.qcard { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 1.3rem 1.2rem; display: grid; gap: .9rem; min-height: 12rem; align-content: start; }
.qcard .q { font-family: var(--font-title); font-size: clamp(1.25rem, 4.2vw, 1.6rem); line-height: 1.3; font-weight: 600; }
.qcard .q .en { font-family: var(--font-body); font-size: .62em; font-weight: 400; margin-top: .45rem; }
.answer { border-top: 1px dashed var(--line); padding-top: .85rem; display: grid; gap: .6rem; }
.answer .a { font-size: 1.08rem; font-weight: 600; }
.answer .a .en { font-weight: 400; }
.actions { position: sticky; bottom: calc(var(--composer-h) + .5rem); display: grid; gap: .5rem; padding-top: .5rem; background: linear-gradient(to bottom, transparent, var(--bg) 35%); }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: .6rem; }
.two .btn { min-height: 56px; font-size: 1.02rem; }
.err-chips { display: flex; flex-wrap: wrap; gap: .4rem; }
.err-chips button { border: 1px solid var(--line); background: var(--bg); border-radius: 999px; padding: .3rem .7rem; font-size: .82rem; }
.err-chips button[aria-pressed="true"] { border-color: var(--ink); background: var(--ink); color: var(--bg); }
.notice { border-radius: 12px; padding: .7rem .9rem; background: var(--accent-soft); font-size: .92rem; }
.done-num { font: 600 2.6rem/1 var(--font-mono); }

/* Simulacro */
.opts { display: grid; gap: .5rem; }
.opts button { text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: .75rem .9rem; display: grid; grid-template-columns: 1.6rem 1fr; gap: .4rem; min-height: 52px; }
.opts button span:first-child { font: 600 .9rem var(--font-mono); color: var(--muted); }
.opts button[aria-pressed="true"] { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }
.review-list { display: grid; gap: .6rem; }
.review-list .card { gap: .4rem; }

/* Tutor + entrada única */
.tutor { position: sticky; bottom: var(--composer-h); z-index: 9; margin: 0 auto; width: 100%; max-width: 760px; padding: 0 max(16px, env(safe-area-inset-right, 0px)) 0 max(16px, env(safe-area-inset-left, 0px)); }
.tutor-box { background: var(--surface); border: 1px solid var(--line); border-radius: 16px 16px 0 0; box-shadow: 0 -8px 30px rgb(0 0 0 / .08); max-height: min(58vh, 520px); display: grid; grid-template-rows: auto 1fr auto; }
.tutor-head { display: flex; align-items: center; justify-content: space-between; gap: .5rem; padding: .65rem .9rem; border-bottom: 1px solid var(--line); }
.tutor-head .kicker { color: var(--accent); }
.msgs { overflow-y: auto; padding: .8rem .9rem; display: grid; gap: .65rem; align-content: start; }
.msg { max-width: 92%; white-space: pre-wrap; overflow-wrap: anywhere; line-height: 1.5; font-size: .96rem; }
.msg.me { justify-self: end; background: var(--soft); border-radius: 14px 14px 4px 14px; padding: .55rem .8rem; }
.msg.tu { justify-self: start; }
.msg .meta { display: flex; gap: .4rem; align-items: center; margin-top: .35rem; }
.tutor-foot { display: flex; gap: .4rem; flex-wrap: wrap; padding: .55rem .9rem; border-top: 1px solid var(--line); }
.composer { position: sticky; bottom: 0; z-index: 10; background: var(--bg); border-top: 1px solid var(--line); padding: .6rem max(16px, env(safe-area-inset-right, 0px)) calc(.6rem + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.composer-inner { max-width: 760px; margin: 0 auto; display: grid; gap: .35rem; }
.ctx { display: flex; align-items: center; gap: .4rem; font-size: .78rem; color: var(--muted); }
.ctx b { color: var(--ink); font-weight: 600; }
.inbox { display: flex; align-items: flex-end; gap: .4rem; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: .4rem .4rem .4rem .8rem; }
.inbox textarea { flex: 1; border: 0; outline: none; background: transparent; resize: none; min-height: 26px; max-height: 140px; padding: .35rem 0; line-height: 1.4; }
.inbox .icon-btn { border: 0; width: 38px; height: 38px; background: transparent; }
.inbox .icon-btn.on { background: var(--accent-soft); color: var(--accent); }
.send { background: var(--ink); color: var(--bg); border: 0; border-radius: 12px; height: 38px; padding: 0 .9rem; font-weight: 600; }
.partial { font-size: .82rem; color: var(--muted); font-style: italic; }
.attach { display: inline-flex; align-items: center; gap: .3rem; font-size: .78rem; border: 1px solid var(--line); border-radius: 8px; padding: .1rem .45rem; }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; scroll-behavior: auto !important; } }
</style>

<script>
(() => {
  "use strict";

  /* ================= Datos ================= */
  const TOPICS = CONTENT.topics;
  const TOPIC = Object.fromEntries(TOPICS.map((t) => [t.id, t]));
  const MOD = Object.fromEntries(CONTENT.modules.map((m) => [m.id, m]));
  const ITEMS = [];
  const ITEM = {};
  TOPICS.forEach((t) => t.items.forEach(([id, qes, qen, aes, aen, hot]) => {
    const it = { id, topic: t.id, mod: t.mod, q: [qes, qen], a: [aes, aen], hot: !!hot };
    ITEMS.push(it); ITEM[id] = it;
  }));
  const DAY = 864e5;
  const EXAM = new Date(2026, 11, 4, 7, 0, 0).getTime();
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const bl = (p, tag = "span") => `<${tag} class="es">${esc(p[0])}</${tag}><${tag} class="en">${esc(p[1])}</${tag}>`;
  const tableHtml = (tb) => `<div class="tbl"><table><thead><tr>${tb.head.map((h) => `<th scope="col">${esc(h)}</th>`).join("")}</tr></thead><tbody>${tb.rows.map((r) => `<tr>${r.map((c, i) => (i ? `<td>${esc(c)}</td>` : `<th scope="row">${esc(c)}</th>`)).join("")}</tr>`).join("")}</tbody></table></div>`;
  const BANK = MCQ.concat(CONTENT.mcq || []);
  const $ = (s, r = document) => r.querySelector(s);
  const $$ = (s, r = document) => [...r.querySelectorAll(s)];
  const pad = (n) => String(n).padStart(2, "0");
  const dayKey = (ts = Date.now()) => { const d = new Date(ts); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };
  const daysToExam = () => Math.max(0, Math.ceil((new Date(2026, 11, 4).getTime() - new Date(new Date().toDateString()).getTime()) / DAY));
  const PANIC_N = Math.ceil(ITEMS.length * 0.2); // el 20 % más probable
  const MODES = { ratitos: { es: "Ratitos", min: 5, note: "3–5 min · bus" }, pomodoro: { es: "Pomodoro", min: 25, note: "25 min + 5 de pausa" }, maraton: { es: "Maratón", min: 90, note: "1–2 h con pausas" } };

  /* ================= FSRS-6 (21 pesos por defecto) ================= */
  const W = [0.212, 1.2931, 2.3065, 8.2956, 6.4133, 0.8334, 3.0194, 0.001, 1.8722, 0.1666, 0.796, 1.4835, 0.0614, 0.2629, 1.6483, 0.6014, 1.8729, 0.5425, 0.0912, 0.0658, 0.1542];
  const DECAY = -W[20];
  const FACTOR = Math.pow(0.9, 1 / DECAY) - 1;
  const retr = (t, s) => Math.pow(1 + (FACTOR * t) / s, DECAY);
  const ivl = (s, r = 0.9) => (s / FACTOR) * (Math.pow(r, 1 / DECAY) - 1);
  const clampD = (d) => Math.min(10, Math.max(1, d));
  const d0 = (g) => clampD(W[4] - Math.exp(W[5] * (g - 1)) + 1);
  const nextD = (d, g) => { const dp = d + (-W[6] * (g - 3) * (10 - d)) / 9; return clampD(W[7] * d0(4) + (1 - W[7]) * dp); };
  const sRecall = (d, s, r, g) => s * (Math.exp(W[8]) * (11 - d) * Math.pow(s, -W[9]) * (Math.exp(W[10] * (1 - r)) - 1) * (g === 2 ? W[15] : 1) * (g === 4 ? W[16] : 1) + 1);
  const sForget = (d, s, r) => Math.min(s, W[11] * Math.pow(d, -W[12]) * (Math.pow(s + 1, W[13]) - 1) * Math.exp(W[14] * (1 - r)));
  const sShort = (s, g) => { let inc = Math.exp(W[17] * (g - 3 + W[18])) * Math.pow(s, -W[19]); if (g >= 3) inc = Math.max(inc, 1); return s * inc; };

  /* ================= Estado y guardado ================= */
  const KEY = "entender7:v1";
  const blank = () => ({ v: 1, cards: {}, feyn: {}, seen: {}, checkin: null, mode: "ratitos", hist: {}, days: {}, sims: [], life: false, log: [], lastVisit: 0, updatedAt: 0 });
  const loadLocal = () => { try { const raw = localStorage.getItem(KEY); if (raw) return Object.assign(blank(), JSON.parse(raw)); } catch { /* sin almacenamiento */ } return blank(); };
  let S = loadLocal();
  let lang = "both";
  try { lang = localStorage.getItem("entender7:lang") || "both"; } catch { /* nada */ }
  document.body.dataset.lang = lang;

  let remote = null, writing = false, again = false, remoteTimer = 0, sync = "local";
  const persistLocal = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch { /* nada */ } };
  function save() {
    S.updatedAt = Date.now();
    const k = dayKey();
    S.hist[k] = { geo: modPct("geo"), cell: modPct("cell") };
    const keys = Object.keys(S.hist).sort();
    while (keys.length > 40) delete S.hist[keys.shift()];
    persistLocal();
    if (remote) { clearTimeout(remoteTimer); remoteTimer = setTimeout(flushRemote, 1500); }
  }
  async function flushRemote() {
    if (!remote) return;
    if (writing) { again = true; return; }
    writing = true;
    try { await remote.set(JSON.parse(JSON.stringify(S))); setSync("cloud"); }
    catch (e) { if (e && e.code === "invalid_argument") { remote = null; setSync("local"); } else setSync("retry"); }
    finally { writing = false; if (again) { again = false; flushRemote(); } }
  }
  function setSync(s) { sync = s; const el = $("#sync"); if (el) el.textContent = SYNC_COPY[s]; }
  const SYNC_COPY = { cloud: "☁ Progreso guardado en tu cuenta", local: "Guardado en este dispositivo", loading: "Sincronizando…", slow: "Sin conexión: se guarda en este dispositivo", retry: "No se pudo sincronizar; se guarda aquí y se reintenta" };
  async function initRemote() {
    if (!window.claude || !window.claude.use) return;
    try {
      const [db, user] = await Promise.all([claude.use("db"), claude.use("user")]);
      if (!db || !user) return;
      const uid = await user.id();
      if (!uid) return;
      const ref = db.doc(`data/users/${uid}/progreso`);
      setSync("loading");
      const timer = setTimeout(() => setSync("slow"), 10000);
      const snap = await ref.get();
      clearTimeout(timer);
      remote = ref;
      if (snap.exists) {
        const r = snap.data();
        if ((r.updatedAt || 0) > (S.updatedAt || 0)) { S = Object.assign(blank(), JSON.parse(JSON.stringify(r))); persistLocal(); render(); }
        else if ((S.updatedAt || 0) > (r.updatedAt || 0)) flushRemote();
      } else if (S.updatedAt) flushRemote();
      setSync("cloud");
    } catch { remote = null; setSync("local"); }
  }

  /* ================= Memoria: estados y dominio ================= */
  function status(id, now = Date.now()) {
    const c = S.cards[id];
    if (!c || !c.reps) return "new";
    if (c.due <= now) return "due";
    if (c.st === "review" && c.s >= 5 && retr((now - c.last) / DAY, c.s) >= 0.85) return "mastered";
    return "learning";
  }
  function mastery(id, now = Date.now()) {
    const c = S.cards[id];
    if (!c || !c.reps || c.st !== "review") return c && c.reps ? 0.05 : 0;
    return Math.max(0, Math.min(1, retr((now - c.last) / DAY, c.s) * Math.min(1, c.s / 5)));
  }
  const avg = (arr) => (arr.length ? arr.reduce((a, b) => a + b, 0) / arr.length : 0);
  const modPct = (m) => Math.round(100 * avg(ITEMS.filter((i) => i.mod === m).map((i) => mastery(i.id))));
  const topicPct = (t) => Math.round(100 * avg(ITEMS.filter((i) => i.topic === t).map((i) => mastery(i.id))));
  const counts = (pool) => pool.reduce((a, i) => { a[status(i.id)]++; return a; }, { new: 0, learning: 0, mastered: 0, due: 0 });
  function yesterdayPct(m) {
    const today = dayKey();
    const prev = Object.keys(S.hist).filter((k) => k < today).sort().pop();
    return prev ? S.hist[prev][m] : 0;
  }
  function streak() {
    let n = 0; let d = new Date(); if (!S.days[dayKey(d.getTime())]) d = new Date(d.getTime() - DAY);
    while (S.days[dayKey(d.getTime())]) { n++; d = new Date(d.getTime() - DAY); }
    return n;
  }
  function capDue(due) {
    const now = Date.now();
    if (S.life && now >= EXAM) return Math.max(due, now + 30 * DAY);
    if (now >= EXAM) return due;
    const lim = EXAM - 20 * 3600e3; // el día antes del examen
    return Math.min(due, Math.max(now + 6 * 3600e3, lim));
  }
  function rate(id, g, ms, err) {
    const now = Date.now();
    const c = Object.assign({ st: "new", reps: 0, lapses: 0 }, S.cards[id]);
    if (!c.reps) { c.s = W[g - 1]; c.d = d0(g); }
    else {
      const t = Math.max(0, (now - c.last) / DAY);
      c.s = t < 1 ? sShort(c.s, g) : g === 1 ? sForget(c.d, c.s, retr(t, c.s)) : sRecall(c.d, c.s, retr(t, c.s), g);
      c.d = nextD(c.d, g);
    }
    if (g === 1 && c.st === "review") c.lapses++;
    c.reps++; c.last = now;
    if (g === 1) { c.st = "learn"; c.due = now + 5 * 60e3; }
    else { c.st = "review"; c.due = capDue(now + Math.max(1, Math.round(ivl(c.s) * (g === 2 ? 0.8 : 1))) * DAY); }
    S.cards[id] = c;
    S.log.push([now, id, g, Math.round(ms), err || 0]);
    if (S.log.length > 300) S.log.splice(0, S.log.length - 300);
    S.days[dayKey(now)] = (S.days[dayKey(now)] || 0) + 1;
    save();
  }

  /* ================= Planificador por fecha (Deadline Scheduler) ================= */
  function todayTopics() {
    const k = dayKey();
    const keys = Object.keys(CONTENT.plan).sort();
    if (k < keys[0]) return CONTENT.plan[keys[0]];
    return CONTENT.plan[k] || [];
  }
  function mood() { return S.checkin && S.checkin.date === dayKey() ? S.checkin.mood : "normal"; }
  const isNight = () => new Date().getHours() >= 22;
  function interleave(list) {
    const groups = {};
    list.forEach((id) => (groups[ITEM[id].topic] ||= []).push(id));
    const out = []; let last = null;
    while (out.length < list.length) {
      const keys = Object.keys(groups).filter((k) => groups[k].length).sort((a, b) => groups[b].length - groups[a].length);
      const k = keys.find((x) => x !== last) || keys[0];
      out.push(groups[k].shift()); last = k;
    }
    return out;
  }
  function planCounts() {
    const due = ITEMS.filter((i) => status(i.id) === "due").length;
    const fresh = ITEMS.filter((i) => status(i.id) === "new").length;
    const days = Math.max(1, daysToExam());
    let quota = Math.min(fresh, Math.ceil(fresh / days) + 2);
    if (mood() === "cansado") quota = Math.min(quota, 3);
    if (mood() === "energia") quota = Math.min(fresh, quota + 4);
    if (isNight() || Date.now() >= EXAM) quota = 0;
    return { due, quota };
  }
  function buildQueue(kind, minutes, topic) {
    let target = minutes <= 5 ? 8 : minutes <= 30 ? 32 : 80;
    if (mood() === "cansado") target = Math.round(target * 0.6);
    let pool = ITEMS;
    if (kind === "topic") pool = ITEMS.filter((i) => i.topic === topic);
    if (kind === "panic") pool = ITEMS.filter((i) => i.hot);
    const due = pool.filter((i) => status(i.id) === "due").sort((a, b) => S.cards[a.id].due - S.cards[b.id].due).map((i) => i.id);
    const fresh = pool.filter((i) => status(i.id) === "new").map((i) => i.id);
    if (kind === "panic") return interleave(pool.slice().sort((a, b) => mastery(a.id) - mastery(b.id)).slice(0, PANIC_N).map((i) => i.id));
    if (kind === "topic") {
      const rest = pool.map((i) => i.id).filter((id) => !due.includes(id) && !fresh.includes(id));
      return [...due, ...fresh, ...rest];
    }
    const today = todayTopics();
    const order = [...fresh.filter((id) => today.includes(ITEM[id].topic)), ...fresh.filter((id) => !today.includes(ITEM[id].topic))];
    const { quota } = planCounts();
    const reviews = due.slice(0, target);
    const nNew = Math.max(0, Math.min(quota, target - reviews.length));
    return interleave([...reviews, ...order.slice(0, nNew)]);
  }

  /* ================= Navegación ================= */

        <div class="row"><span class="muted">Idioma</span>
          <div class="seg" role="group" aria-label="Idioma">${[["both", "ES+EN"], ["es", "ES"], ["en", "EN"]].map(([k, l]) => `<button type="button" data-lang="${k}" aria-pressed="${lang === k}">${l}</button>`).join("")}</div></div>

  /* ================= Tema: Sistema de Entender en 5 pasos ================= */
  function renderTopic(v, t) {

  /* Explicador: voz (tts) o paso a paso */
  let TTS = null, beatIdx = -1, speaking = false;

  /* ================= Sesión (modo enfoque, 2 botones, antitrampa) ================= */
  let SES = null, tick = 0;
  function startSession(kind, queue, minutes) {
    stopSpeech();
    const before = { geo: modPct("geo"), cell: modPct("cell") };
    SES = { kind, queue: queue.slice(), i: 0, minutes, start: Date.now(), shownAt: 0, phase: "q", pend: null, anti: null, hint: false, results: [], repeats: {}, before, banner: null, breakUntil: 0, nextBreak: Date.now() + 25 * 60e3,

  function tickTimer() {

      return;
    }
    if (SES.minutes && SES.minutes < 60) el.textContent = fmtMs(Math.max(0, SES.start + SES.minutes * 60e3 - now));
    else el.textContent = fmtMs(now - SES.start);
  }
  const fmtMs = (ms) => { const s = Math.round(ms / 1000); return `${pad(Math.floor(s / 60))}:${pad(s % 60)}`; };
  function renderSession(v) {
    const s = SES;

      $("#yes", v).addEventListener("click", () => answer(true));

  function hintFor(it) { const a = it.a[0]; const words = a.split(" "); return words.slice(0, Math.max(1, Math.ceil(words.length / 4))).join(" ") + " …"; }
  function answer(yes) {
    const s = SES, id = s.current(), ms = Date.now() - s.shownAt;

    }

  function renderSimDone(v) {
    $("#crumb").innerHTML = `<b>Simulacro</b> · nota cruda`;
    $("#ptop").style.width = "100%";
    const n = SIM.qs.length, pct = Math.round((100 * SIM.score) / n);
    const need = Math.max(0, Math.ceil(0.7 * n) - SIM.score);
    const by = (m) => { const ks = SIM.qs.map((qi, k) => [qi, k]).filter(([qi]) => BANK[qi].mod === m); return `${ks.filter(([qi, k]) => BANK[qi].ans === SIM.picks[k]).length}/${ks.length}`; };
    const wrong = SIM.qs.map((qi, k) => [qi, k]).filter(([qi, k]) => BANK[qi].ans !== SIM.picks[k]);
    v.innerHTML = `<div><div class="kicker">Nota cruda</div><h1 class="title"><span class="mono">${SIM.score}/${n}</span> · ${pct} %</h1>
      <p class="muted" style="margin-top:.4rem">${need ? `Te faltan ${need} ${need === 1 ? "pregunta" : "preguntas"} para llegar al 70 %.` : "Llegas al 70 %: vas aprobando."}</p></div>
      <section class="card"><div class="stat-row"><b>Geología</b><span class="delta">${by("geo")}</span></div><div class="stat-row"><b>La Célula</b><span class="delta">${by("cell")}</span></div></section>
      ${wrong.length ? `<div class="kicker">Revisa estas ${wrong.length}</div><div class="review-list">${wrong.map(([qi, k]) => { const q = BANK[qi]; return `<div class="card"><p>${q.q}</p><p class="small">Tu respuesta: <b>${SIM.picks[k] >= 0 ? "abcd"[SIM.picks[k]] + ". " + q.opts[SIM.picks[k]] : "sin responder"}</b></p><p class="small">Correcta: <b>${"abcd"[q.ans]}. ${q.opts[q.ans]}</b></p><p class="small"><span class="es">${q.why[0]}</span><span class="en">${q.why[1]}</span></p></div>`; }).join("")}</div>` : ""}
      <div class="row-wrap"><button type="button" class="btn primary" id="again">Otro simulacro</button><a class="btn" href="#hoy">Volver a Hoy</a></div>`;
    $("#again", v).addEventListener("click", () => { SIM = { phase: "intro" }; render(); });
  }

  /* ================= Tutor Feynman (sample) + entrada única ================= */
  let SAMPLE = null, DICT = null, IMG = null, photo = null, ctl = null;
  const CHATS = {};
  const tries = {};
  function renderCtx() {
    const t = ctxTopic ? TOPIC[ctxTopic] : null;
    $("#ctx").innerHTML = t ? `Tutor sobre <b>${esc(t.es)}</b> <button type="button" class="link-btn" id="ctx-clear" style="font-size:.78rem">cambiar a general</button>` : `Tutor · <b>todo el temario</b>`;
    const c = $("#ctx-clear"); if (c) c.addEventListener("click", () => { ctxTopic = null; renderCtx(); });
    if (photo) $("#ctx").insertAdjacentHTML("beforeend", ` <span class="attach">📷 foto lista <button type="button" class="link-btn" id="photo-x" aria-label="Quitar foto">×</button></span>`);
    const x = $("#photo-x"); if (x) x.addEventListener("click", () => { photo = null; renderCtx(); });
  }
  function temario(t) {
    if (!t) return TOPICS.map((x) => `## ${MOD[x.mod].es} · ${x.es}\n` + x.sum.map((p) => "- " + p[0]).join("\n")).join("\n\n");
    return [`${MOD[t.mod].es} · ${t.es} (${t.en})`,
      `Lo fácil: ${t.map.easy[0]}`, `Lo difícil: ${t.map.hard[0]}`, `Siempre sale en el examen: ${t.map.exam[0]}`,
      "Resumen:", ...t.sum.map((p) => `- ${p[0]} / ${p[1]}`),
      "Preguntas y respuestas correctas:", ...t.items.map((i) => `- ${i[1]} → ${i[3]} (${i[4]})`),
      ...(t.table ? ["Tabla:", t.table.head.join(" | "), ...t.table.rows.map((r) => "- " + r.join(" | "))] : [])].join("\n");
  }
  function rules(t) {
    return `Eres el tutor de "Entender", una app de estudio. Hablas con un estudiante de 7.º grado de Costa Rica que estudia Ciencias para un examen EN INGLÉS el 4 de diciembre de 2026. Su idioma fuerte es el español.
Reglas:
- Cero juicios. Nunca lo hagas sentir mal; si dice que no entiende nada, está bien.
- Responde en español sencillo, en máximo 110 palabras, con oraciones cortas, sin títulos, tablas ni markdown. Escribe los términos clave también en inglés entre paréntesis, porque el examen es en inglés.
- Si explica un tema con sus palabras, compáralo SOLO con el temario de abajo: di primero qué entendió bien, luego qué le falta o qué confundió, y re-explica eso con una analogía de la vida diaria (Costa Rica, fútbol, la casa, el bus, el celular).
- Si pide otra explicación, usa una analogía diferente a las que ya usaste en esta conversación.
- Si envía una foto, léela y ayúdale según el temario.
- No inventes datos que no estén en el temario.
- Termina con UNA pregunta corta para comprobar que entendió.
- Solo si el estudiante intentó explicar el tema con sus palabras, agrega al final una línea aparte con una sola etiqueta: [ENTENDIDO], [CASI] o [TODAVIA_NO].

TEMARIO:
${temario(t)}`;
  }
  const TAG = /\s*\[(ENTENDIDO|CASI|TODAVIA_NO)\]\s*$/;
  const ERR_COPY = { not_granted: "El tutor necesita tu permiso para usar Claude. Puedes darlo desde el menú Permisos de esta página.", sampling_disabled: "El tutor no está disponible en esta cuenta.", rate_limited: "Muchas preguntas seguidas. Espera un momento y vuelve a intentar.", session_expired: "Tu sesión expiró. Vuelve a iniciar sesión en Claude.", refused: "No puedo responder eso. Prueba preguntarlo de otra forma.", image_rejected: "No pude leer esa foto. Prueba con otra más clara.", prompt_too_large: "El mensaje es muy largo. Escríbelo más corto." };
  function addMsg(who, text) {
    const d = document.createElement("div"); d.className = `msg ${who}`; d.textContent = text;
    $("#msgs").append(d); d.scrollIntoView({ block: "end" }); return d;
  }
  async function sendTutor(text) {
    $("#tutor").hidden = false; measure();
    const t = ctxTopic ? TOPIC[ctxTopic] : null;
    const key = t ? t.id : "_";
    const chat = (CHATS[key] ||= []);
    $("#tutor-topic").textContent = t ? t.es : "Todo el temario";
    if (!SAMPLE) { addMsg("tu", "El tutor no está disponible en esta vista. Abre la app dentro de Claude para usarlo; todo lo demás funciona igual."); return; }
    const img = photo; photo = null; renderCtx();
    addMsg("me", text || "📷 Te envío una foto.");
    chat.push({ role: "user", content: (text || "Te envío una foto de mis apuntes o de una pregunta. Ayúdame con ella.") + (img ? "\n(Adjunto una foto.)" : "") });
    const out = addMsg("tu", "Pensando…");
    ctl = new AbortController();
    $("#tutor-stop").hidden = false; $("#send-btn").disabled = true;
    try {
      const turns = [{ role: "user", content: rules(t) }, ...chat.slice(-8)];
      const opts = { cache: false, signal: ctl.signal, onText: ({ text: x }) => { out.textContent = x.replace(/\s*\[[A-Z_]*\]?\s*$/, ""); } };
      if (img) opts.images = [img];
      const res = await SAMPLE(turns, opts);
      const m = res.text.match(TAG);
      const clean = res.text.replace(TAG, "");
      out.textContent = clean;
      chat.push({ role: "assistant", content: clean });
      if (m && t) {
        S.feyn[t.id] = { ENTENDIDO: "entendido", CASI: "casi", TODAVIA_NO: "todavia" }[m[1]]; save();
        out.insertAdjacentHTML("beforeend", `<div class="meta"><span class="chip ${m[1] === "ENTENDIDO" ? "ok" : ""}">${{ ENTENDIDO: "✓ Lo entendiste", CASI: "◐ Casi", TODAVIA_NO: "Todavía no, y está bien" }[m[1]]}</span></div>`);
        if (route().name === "topic") renderSide(route());
      }
      if (TTS) {
        const b = document.createElement("button"); b.type = "button"; b.className = "link-btn"; b.textContent = "🔊 Escuchar";
        b.addEventListener("click", () => { TTS.speak(clean, { language: "es" }).catch(() => {}); });
        const meta = $(".meta", out) || out.appendChild(Object.assign(document.createElement("div"), { className: "meta" }));
        meta.append(b);
      }
    } catch (e) {
      chat.pop();
      if (e && e.code === "cancelled") out.textContent = e.text || "Detenido.";
      else out.textContent = (e && e.text ? e.text + "\n\n" : "") + (ERR_COPY[e && e.code] || "Se cortó la conexión. Vuelve a enviar tu mensaje.");
      if (e && (e.code === "not_granted" || e.code === "sampling_disabled")) SAMPLE = null;
      if (e && e.code === "images_unavailable") { IMG = null; $("#photo-btn").hidden = true; }
    } finally {
      $("#tutor-stop").hidden = true; $("#send-btn").disabled = false; ctl = null;
    }
  }
  $("#composer").addEventListener("submit", (e) => {
    e.preventDefault();
    const a = $("#ask"); const text = a.value.trim();
    if (!text && !photo) return;
    a.value = ""; grow();
    sendTutor(text);
  });
  $("#ask").addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); $("#composer").requestSubmit(); } });
  const grow = () => { const a = $("#ask"); a.style.height = "auto"; a.style.height = Math.min(140, a.scrollHeight) + "px"; measure(); };
  $("#ask").addEventListener("input", grow);
  $("#tutor-close").addEventListener("click", () => { $("#tutor").hidden = true; if (ctl) ctl.abort(); });
  $("#tutor-stop").addEventListener("click", () => { if (ctl) ctl.abort(); });
  $("#tutor-again").addEventListener("click", () => {
    const key = ctxTopic || "_";
    tries[key] = (tries[key] || 0) + 1;
    if (tries[key] > 5) { addMsg("tu", "Ya van 5 explicaciones distintas. Practica el tema un rato y vuelve: a veces se entiende mejor después de intentarlo."); return; }
    sendTutor(`Explícamelo de otra forma, con una analogía distinta (intento ${tries[key]} de 5).`);
  });
  $("#photo-btn").addEventListener("click", () => $("#photo").click());
  $("#photo").addEventListener("change", (e) => {
    const f = e.target.files && e.target.files[0];
    if (f && IMG && f.size <= IMG.maxInputBytes) { photo = f; renderCtx(); $("#ask").focus(); }
    e.target.value = "";
  });
  // Dictado: el botón llama start() directo desde el clic.
  $("#mic-btn").addEventListener("click", () => {
    if (!DICT) return;
    if (DICT.active()) { DICT.stop().catch(() => {}); return; }
    DICT.start().catch((e) => { if (e && (e.code === "not_granted" || e.code === "unavailable")) $("#mic-btn").hidden = true; });
  });
  function measure() { const h = $("#composer").offsetHeight; document.documentElement.style.setProperty("--composer-h", h + "px"); }
  window.addEventListener("resize", measure);

  /* ================= Capacidades de la plataforma ================= */
  async function initCaps() {
    if (!window.claude || !window.claude.use) return;
    claude.use("sample").then(async (s) => {
      SAMPLE = s;
      if (!s) return;
      const lim = await s.limits().catch(() => null);
      if (lim && lim.images) { IMG = lim.images; $("#photo").accept = lim.images.mediaTypes.join(","); $("#photo-btn").hidden = false; }
    });
    claude.use("tts").then((t) => {
      TTS = t; if (!t) return;
      t.onLine(({ id }) => { if (id && id[0] === "b") markBeat($("#view"), Number(id.slice(1))); });
      t.onState(({ state }) => { if (state === "idle") speaking = false; });
      if (route().name === "topic") render();
    });
    claude.use("dictation").then((d) => {
      DICT = d; if (!d) return;
      $("#mic-btn").hidden = false;
      d.onState(({ state }) => { $("#mic-btn").classList.toggle("on", state !== "idle"); $("#partial").hidden = state === "idle"; if (state === "idle") $("#partial").textContent = ""; measure(); });
      d.onPartial(({ text }) => { $("#partial").textContent = text; });
      d.onFinal(({ text }) => { const a = $("#ask"); a.value = a.value ? a.value + text : text.trimStart(); grow(); });
    });
  }

  render(); measure();
  initRemote(); initCaps();
})();
</script>
